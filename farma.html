<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber Farmer Ultra-Compact</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root {
            --bg: #030508;
            --panel: rgba(10, 15, 25, 0.9);
            --neon: #00f2ff;
            --pink: #ff007a;
            --green: #00ff88;
            --gold: #ffb800;
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle at 50% -20%, #1a2a4a 0%, var(--bg) 70%);
        }

        /* --- MINI HUD --- */
        .hud {
            width: 100%; max-width: 800px; padding: 15px;
            display: flex; justify-content: space-around;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon); box-shadow: 0 0 20px rgba(0,242,255,0.15);
        }

        .h-item { text-align: center; }
        .h-label { font-size: 8px; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; }
        .h-val { font-size: 18px; font-weight: 900; display: block; color: var(--gold); }

        /* --- GAME LAYOUT --- */
        .container {
            display: flex; gap: 20px; padding: 20px;
            width: 100%; max-width: 900px; height: calc(100vh - 80px);
            align-items: center;
        }

        /* --- MINI SHOP --- */
        .shop {
            width: 220px; background: var(--panel); border-radius: 20px;
            padding: 15px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .s-card {
            background: #000; border: 1px solid #222; border-radius: 12px;
            padding: 10px; margin-bottom: 10px; cursor: pointer;
            transition: 0.2s; position: relative;
        }

        .s-card:hover { border-color: var(--green); transform: translateX(5px); }
        .s-card.active { border-color: var(--pink); box-shadow: 0 0 15px var(--pink); }

        .s-name { font-size: 12px; font-weight: 900; display: block; }
        .s-price { font-size: 10px; color: var(--gold); }

        /* --- COMPACT GRID --- */
        .grid {
            flex-grow: 1; display: grid; 
            grid-template-columns: repeat(3, 120px); 
            grid-template-rows: repeat(3, 120px);
            gap: 15px; justify-content: center;
        }

        .plot {
            background: #080a0f; border: 2px solid #1a1e26; border-radius: 20px;
            position: relative; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }

        .plot:hover { border-color: var(--neon); box-shadow: 0 0 20px rgba(0,242,255,0.2); }

        .p-icon { font-size: 45px; z-index: 2; transition: 0.4s; }
        
        .plot.ready .p-icon { animation: bounce 0.8s infinite alternate; }

        @keyframes bounce { 
            from { transform: scale(1); filter: drop-shadow(0 0 5px var(--pink)); } 
            to { transform: scale(1.2); filter: drop-shadow(0 0 20px var(--pink)); } 
        }

        /* --- RGB PROGRESS --- */
        .p-bar-wrap {
            position: absolute; bottom: 10px; width: 60%; height: 4px;
            background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden;
            display: none;
        }

        .p-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--neon), var(--green), var(--neon));
            background-size: 200%; animation: rgb 2s linear infinite;
        }

        @keyframes rgb { to { background-position: 200% center; } }

        /* --- FX --- */
        .money-fx {
            position: absolute; font-size: 14px; font-weight: 900;
            color: var(--green); animation: fly 1s forwards; pointer-events: none;
        }

        @keyframes fly {
            0% { opacity: 0; transform: translateY(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        .btn-back {
            position: absolute; bottom: 20px; left: 20px;
            padding: 8px 15px; font-size: 10px; color: #444;
            border: 1px solid #222; text-decoration: none; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="h-item"><span class="h-label">Credits</span><span class="h-val" id="m">$100</span></div>
        <div class="h-item"><span class="h-label">Level</span><span class="h-val" id="l" style="color:var(--neon)">1</span></div>
        <div class="h-item"><span class="h-label">Experience</span><span class="h-val" id="x" style="color:var(--green)">0</span></div>
    </div>

    <div class="container">
        <div class="shop" id="shop"></div>
        <div class="grid" id="grid"></div>
    </div>

    <a href="index.html" class="btn-back">TERMINATE</a>

    <script>
        const cfg = {
            m: parseInt(localStorage.getItem('m')) || 100,
            x: parseInt(localStorage.getItem('x')) || 0,
            l: parseInt(localStorage.getItem('l')) || 1,
            sel: null
        };

        const seeds = [
            { id: 1, n: "NEON", i: "🌾", c: 10, t: 3, w: 25, xp: 10 },
            { id: 2, n: "LASER", i: "🥕", c: 50, t: 8, w: 140, xp: 40 },
            { id: 3, n: "CORE", i: "🎃", c: 200, t: 20, w: 600, xp: 150 },
            { id: 4, n: "VOID", i: "🌸", c: 800, t: 50, w: 2800, xp: 500 }
        ];

        let plots = Array(9).fill().map(() => ({ s: null, ready: false }));

        function ui() {
            const sDiv = document.getElementById('shop');
            sDiv.innerHTML = '<h4 style="margin:0 0 15px 0; font-size:12px; color:var(--neon)">LAB_STATION</h4>';
            seeds.forEach(s => {
                const d = document.createElement('div');
                d.className = `s-card ${cfg.sel === s.id ? 'active' : ''}`;
                d.innerHTML = `<span class="s-name">${s.i} ${s.n}</span><span class="s-price">$${s.c}</span>`;
                d.onclick = () => { if(cfg.m >= s.c) { cfg.sel = s.id; ui(); } };
                sDiv.appendChild(d);
            });

            const gDiv = document.getElementById('grid');
            gDiv.innerHTML = '';
            plots.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `plot ${p.ready ? 'ready' : ''}`;
                div.innerHTML = `<span class="p-icon">${p.ready ? p.s.i : (p.s ? '🌱' : '')}</span>
                                 <div class="p-bar-wrap" id="w-${i}"><div class="p-bar-fill" id="f-${i}"></div></div>`;
                div.onclick = () => click(i);
                gDiv.appendChild(div);
                if(p.s && !p.ready) { 
                    const w = document.getElementById(`w-${i}`);
                    w.style.display = 'block';
                    // Bar jest animowany przez CSS transition w click()
                }
            });

            document.getElementById('m').innerText = '$' + cfg.m;
            document.getElementById('l').innerText = cfg.l;
            document.getElementById('x').innerText = cfg.x;
            localStorage.setItem('m', cfg.m); localStorage.setItem('x', cfg.x); localStorage.setItem('l', cfg.l);
        }

        function click(i) {
            const p = plots[i];
            if(!p.s && cfg.sel) {
                const s = seeds.find(x => x.id === cfg.sel);
                cfg.m -= s.c; p.s = s; cfg.sel = null;
                ui();
                const f = document.getElementById(`f-${i}`);
                const w = document.getElementById(`w-${i}`);
                w.style.display = 'block';
                f.style.transition = `width ${s.t}s linear`;
                setTimeout(() => f.style.width = '100%', 50);
                setTimeout(() => { p.ready = true; ui(); }, s.t * 1000);
            } else if(p.ready) {
                fx(i, `+$${p.s.w}`);
                cfg.m += p.s.w; cfg.x += p.s.xp;
                if(cfg.x >= cfg.l * 1000) { cfg.l++; fx(i, "LVL UP!", "#ff007a"); }
                p.s = null; p.ready = false;
                ui();
            }
        }

        function fx(i, txt, col) {
            const d = document.querySelectorAll('.plot')[i];
            const e = document.createElement('div');
            e.className = 'money-fx'; e.innerText = txt;
            if(col) e.style.color = col;
            d.appendChild(e); setTimeout(() => e.remove(), 1000);
        }

        ui();
    </script>
</body>
</html>
