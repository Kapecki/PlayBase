<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Farmer | PlayBase</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --bg: #f8fafc;
            --accent: #10b981; /* Piękna zieleń */
            --dark: #0f172a;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --gold: #f59e0b;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* --- Czysty, nowoczesny HUD --- */
        .header {
            width: 100%; max-width: 900px; padding: 30px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .stats { display: flex; gap: 15px; }
        
        .stat-box {
            background: var(--card); padding: 12px 24px; border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; border: 1px solid #e2e8f0;
        }

        .stat-label { font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-val { font-size: 18px; font-weight: 800; color: var(--dark); }

        /* --- Layout Gry --- */
        .main-container {
            display: grid; grid-template-columns: 260px 1fr;
            gap: 30px; width: 100%; max-width: 950px; padding: 0 20px;
        }

        /* --- Sklep (Sidebar) --- */
        .sidebar {
            background: var(--card); border-radius: 24px; padding: 24px;
            border: 1px solid #e2e8f0; height: fit-content;
        }

        .sidebar h3 { margin: 0 0 20px 0; font-size: 16px; font-weight: 800; }

        .seed-card {
            padding: 16px; border-radius: 16px; border: 1px solid #f1f5f9;
            background: #f8fafc; cursor: pointer; transition: 0.2s;
            margin-bottom: 12px; display: flex; align-items: center; gap: 12px;
        }

        .seed-card:hover { transform: translateY(-2px); border-color: var(--accent); background: #f0fdf4; }
        .seed-card.active { border-color: var(--accent); background: #f0fdf4; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }

        .seed-icon { font-size: 24px; }
        .seed-info b { display: block; font-size: 14px; }
        .seed-info span { font-size: 11px; color: var(--text-sub); }

        /* --- Siatka Farmy --- */
        .farm-grid {
            display: grid; grid-template-columns: repeat(3, 140px);
            gap: 20px; justify-content: center;
        }

        .plot {
            width: 140px; height: 140px; background: var(--card);
            border-radius: 28px; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: 0.2s;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.02);
        }

        .plot:hover { border-color: var(--accent); transform: scale(1.02); }
        
        .plant-emoji { font-size: 50px; transition: 0.3s; }

        /* --- Pasek postępu (Subtelny) --- */
        .prog-container {
            position: absolute; bottom: 15px; width: 60%; height: 6px;
            background: #f1f5f9; border-radius: 10px; overflow: hidden;
            display: none;
        }

        .prog-bar {
            height: 100%; width: 0%; background: var(--accent);
            border-radius: 10px; transition: linear;
        }

        /* --- Animacja Gotowości --- */
        .plot.ready .plant-emoji {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .back-link {
            margin-top: 40px; color: var(--text-sub); text-decoration: none;
            font-size: 13px; font-weight: 600; transition: 0.2s;
        }
        .back-link:hover { color: var(--dark); }

        /* Floating Money FX */
        .gain-fx {
            position: absolute; font-weight: 800; color: var(--accent);
            animation: floatUp 1s forwards; pointer-events: none;
        }

        @keyframes floatUp {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-40px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Portfel</span>
                <span class="stat-val" id="cash-ui">$50</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Doświadczenie</span>
                <span class="stat-val" id="xp-ui">0</span>
            </div>
        </div>
        <div class="stat-box" style="border-color: var(--dark);">
            <span class="stat-label">Poziom</span>
            <span class="stat-val" id="lvl-ui">1</span>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <h3>Nasiona</h3>
            <div id="shop-root"></div>
        </div>

        <div class="farm-grid" id="grid-root"></div>
    </div>

    <a href="index.html" class="back-link">← Wróć do Lobby</a>

    <script>
        const game = {
            money: parseInt(localStorage.getItem('m_v4')) || 50,
            xp: parseInt(localStorage.getItem('x_v4')) || 0,
            lvl: parseInt(localStorage.getItem('l_v4')) || 1,
            selected: null
        };

        const seeds = [
            { id: 1, name: "Pszenica", icon: "🌾", cost: 10, time: 5, yield: 25, xp: 15 },
            { id: 2, name: "Marchew", icon: "🥕", cost: 45, time: 12, yield: 120, xp: 40 },
            { id: 3, name: "Pomidor", icon: "🍅", cost: 150, time: 30, yield: 450, xp: 120 }
        ];

        let plots = Array(9).fill().map(() => ({ seed: null, ready: false }));

        function init() {
            const shop = document.getElementById('shop-root');
            seeds.forEach(s => {
                const div = document.createElement('div');
                div.className = 'seed-card';
                div.innerHTML = `
                    <div class="seed-icon">${s.icon}</div>
                    <div class="seed-info">
                        <b>${s.name}</b>
                        <span>$${s.cost} • ${s.time}s</span>
                    </div>
                `;
                div.onclick = () => {
                    if(game.money >= s.cost) {
                        game.selected = s;
                        document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('active'));
                        div.classList.add('active');
                    }
                };
                shop.appendChild(div);
            });

            const grid = document.getElementById('grid-root');
            plots.forEach((_, i) => {
                const p = document.createElement('div');
                p.className = 'plot';
                p.id = `plot-${i}`;
                p.innerHTML = `<div class="plant-emoji" id="e-${i}"></div>
                               <div class="prog-container" id="c-${i}"><div class="prog-bar" id="b-${i}"></div></div>`;
                p.onclick = () => handlePlot(i);
                grid.appendChild(p);
            });
            update();
        }

        function handlePlot(i) {
            const p = plots[i];
            const el = document.getElementById(`plot-${i}`);
            const emoji = document.getElementById(`e-${i}`);

            if(!p.seed && game.selected) {
                game.money -= game.selected.cost;
                p.seed = {...game.selected};
                game.selected = null;
                document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('active'));

                emoji.innerText = "🌱";
                const cont = document.getElementById(`c-${i}`);
                const bar = document.getElementById(`b-${i}`);
                cont.style.display = 'block';
                bar.style.transition = `width ${p.seed.time}s linear`;
                setTimeout(() => bar.style.width = '100%', 50);

                setTimeout(() => {
                    p.ready = true;
                    el.classList.add('ready');
                    emoji.innerText = p.seed.icon;
                    cont.style.display = 'none';
                    bar.style.transition = 'none';
                    bar.style.width = '0%';
                }, p.seed.time * 1000);
                update();
            } else if(p.ready) {
                game.money += p.seed.yield;
                game.xp += p.seed.xp;
                
                // Efekt pieniędzy
                const fx = document.createElement('div');
                fx.className = 'gain-fx';
                fx.innerText = `+$${p.seed.yield}`;
                el.appendChild(fx);
                setTimeout(() => fx.remove(), 1000);

                if(game.xp >= game.lvl * 500) { game.lvl++; }

                p.seed = null;
                p.ready = false;
                el.classList.remove('ready');
                emoji.innerText = "";
                update();
            }
        }

        function update() {
            document.getElementById('cash-ui').innerText = `$${game.money}`;
            document.getElementById('xp-ui').innerText = game.xp;
            document.getElementById('lvl-ui').innerText = game.lvl;
            localStorage.setItem('m_v4', game.money);
            localStorage.setItem('x_v4', game.xp);
            localStorage.setItem('l_v4', game.lvl);
        }

        init();
    </script>
</body>
</html>
