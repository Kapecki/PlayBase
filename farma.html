<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Farmer Pro | RGB Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg: #020408;
            --panel: rgba(15, 20, 30, 0.95);
            --neon-blue: #00d4ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --gold: #ffcc00;
            --rgb-speed: 3s;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.05) 0%, transparent 40%);
        }

        /* --- UI NAVIGATION --- */
        .top-hud {
            width: 100%;
            max-width: 1300px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(2, 4, 8, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid rgba(0, 212, 255, 0.2);
        }

        .hud-stats {
            display: flex;
            gap: 25px;
        }

        .hud-card {
            background: var(--panel);
            border: 1px solid var(--neon-blue);
            padding: 12px 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .hud-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shineHUD 4s infinite;
        }

        @keyframes shineHUD { to { left: 200%; } }

        .hud-label { font-size: 9px; letter-spacing: 2px; color: var(--neon-blue); text-transform: uppercase; display: block; }
        .hud-value { font-size: 22px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }

        /* --- GAME ENGINE LAYOUT --- */
        .game-engine {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 50px;
            width: 100%;
            max-width: 1300px;
            margin-top: 50px;
            padding: 0 40px;
        }

        /* --- ADVANCED SHOP --- */
        .lab-shop {
            background: var(--panel);
            border-radius: 40px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .shop-header {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 30px;
            text-align: center;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .seed-item {
            background: rgba(0,0,0,0.4);
            border: 2px solid #1a1e26;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .seed-item:hover {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.05);
            transform: translateX(10px);
        }

        .seed-item.active {
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
        }

        .seed-icon-box { font-size: 40px; }
        .seed-meta h4 { margin: 0; font-size: 18px; }
        .seed-meta p { margin: 5px 0 0; font-size: 11px; color: #666; }
        .seed-price { margin-left: auto; color: var(--gold); font-weight: bold; }

        /* --- CYBER GRID --- */
        .farm-core {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .plot-unit {
            aspect-ratio: 1/1;
            background: #080a0f;
            border: 2px solid #151921;
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .plot-unit:hover {
            border-color: var(--neon-blue);
            background: #0d121b;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .visual-container {
            font-size: 75px;
            z-index: 10;
            transition: 0.5s;
        }

        .plot-unit.maturing .visual-container { filter: blur(2px) brightness(0.7); transform: scale(0.8); }
        
        .plot-unit.finished {
            animation: neonPulse 1.5s infinite alternate;
        }

        @keyframes neonPulse {
            from { border-color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
            to { border-color: white; box-shadow: 0 0 30px var(--neon-pink), inset 0 0 15px var(--neon-pink); }
        }

        /* --- RGB PROGRESS ENGINE --- */
        .progress-hull {
            position: absolute;
            bottom: 25px;
            width: 70%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-rgb {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0000, #ff00ff, #00d4ff, #00ff99, #ff0000);
            background-size: 300% 100%;
            animation: moveRGB 3s linear infinite;
        }

        @keyframes moveRGB { to { background-position: 300% center; } }

        /* --- FLOATING FX --- */
        .cash-fx {
            position: absolute;
            font-weight: 900;
            color: var(--neon-green);
            pointer-events: none;
            animation: floatCash 1.2s forwards;
            z-index: 100;
        }

        @keyframes floatCash {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            30% { opacity: 1; transform: translateY(-40px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-100px) scale(1); }
        }

        .btn-exit {
            text-decoration: none;
            color: #444;
            font-size: 11px;
            border: 1px solid #222;
            padding: 10px 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-exit:hover { color: white; border-color: white; box-shadow: 0 0 15px rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <header class="top-hud">
        <a href="index.html" class="btn-exit">TERMINATE SESSION</a>
        
        <div class="hud-stats">
            <div class="hud-card">
                <span class="hud-label">User Level</span>
                <span class="hud-value" id="lvl">1</span>
            </div>
            <div class="hud-card" style="border-color: var(--neon-pink);">
                <span class="hud-label">Cyber Credits</span>
                <span class="hud-value" id="credits">$50</span>
            </div>
            <div class="hud-card" style="border-color: var(--neon-green);">
                <span class="hud-label">Core XP</span>
                <span class="hud-value" id="xp">0</span>
            </div>
        </div>
    </header>

    <main class="game-engine">
        <section class="lab-shop">
            <h2 class="shop-header">SEED LABORATORY</h2>
            <div id="shop-root"></div>
        </section>

        <section class="farm-core" id="grid-root"></section>
    </main>

    <script>
        // --- GAME CORE ENGINE ---
        const state = {
            credits: parseInt(localStorage.getItem('cc_credits')) || 100,
            xp: parseInt(localStorage.getItem('cc_xp')) || 0,
            lvl: parseInt(localStorage.getItem('cc_lvl')) || 1,
            selectedId: null
        };

        const seeds = [
            { id: 1, name: "Neon Fiber", icon: "🌾", cost: 20, time: 5, yield: 55, xp: 15 },
            { id: 2, name: "Laser Root", icon: "🥕", cost: 100, time: 15, yield: 280, xp: 50 },
            { id: 3, name: "Plasma Core", icon: "🎃", cost: 450, time: 40, yield: 1350, xp: 180 },
            { id: 4, name: "Binary Blossom", icon: "🌸", cost: 1500, time: 80, yield: 5500, xp: 750 }
        ];

        let grid = Array(9).fill().map(() => ({ data: null, state: 'empty' }));

        function init() {
            // Render Shop
            const shop = document.getElementById('shop-root');
            seeds.forEach(s => {
                const item = document.createElement('div');
                item.className = 'seed-item';
                item.innerHTML = `
                    <div class="seed-icon-box">${s.icon}</div>
                    <div class="seed-meta">
                        <h4>${s.name}</h4>
                        <p>Time: ${s.time}s | XP: +${s.xp}</p>
                    </div>
                    <div class="seed-price">$${s.cost}</div>
                `;
                item.onclick = () => {
                    if(state.credits >= s.cost) {
                        state.selectedId = s.id;
                        document.querySelectorAll('.seed-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                    }
                };
                shop.appendChild(item);
            });

            // Render Grid
            const root = document.getElementById('grid-root');
            grid.forEach((_, i) => {
                const unit = document.createElement('div');
                unit.className = 'plot-unit';
                unit.id = `plot-${i}`;
                unit.innerHTML = `
                    <div class="visual-container" id="vis-${i}"></div>
                    <div class="progress-hull" id="hull-${i}">
                        <div class="progress-rgb" id="bar-${i}"></div>
                    </div>
                `;
                unit.onclick = () => interact(i);
                root.appendChild(unit);
            });
            syncHUD();
        }

        function interact(i) {
            const plot = grid[i];
            const visual = document.getElementById(`vis-${i}`);
            const el = document.getElementById(`plot-${i}`);

            // Planting Logic
            if(plot.state === 'empty' && state.selectedId) {
                const seed = seeds.find(s => s.id === state.selectedId);
                state.credits -= seed.cost;
                plot.data = { ...seed };
                plot.state = 'growing';
                state.selectedId = null;
                document.querySelectorAll('.seed-item').forEach(el => el.classList.remove('active'));

                el.classList.add('maturing');
                visual.innerText = "🌱";
                
                const hull = document.getElementById(`hull-${i}`);
                const bar = document.getElementById(`bar-${i}`);
                hull.style.display = 'block';
                bar.style.transition = `width ${seed.time}s linear`;
                
                setTimeout(() => bar.style.width = '100%', 50);

                setTimeout(() => {
                    plot.state = 'ready';
                    el.classList.remove('maturing');
                    el.classList.add('finished');
                    visual.innerText = seed.icon;
                    hull.style.display = 'none';
                    bar.style.width = '0%';
                }, seed.time * 1000);

                syncHUD();
            } 
            // Harvesting Logic
            else if(plot.state === 'ready') {
                const reward = plot.data.yield;
                const xpGain = plot.data.xp;
                state.credits += reward;
                state.xp += xpGain;

                // FX
                createFX(el, `+$${reward}\n+${xpGain}XP`);

                // Level Check
                if(state.xp >= state.lvl * 800) {
                    state.lvl++;
                    createFX(el, "LEVEL UP!", "#ff00ff");
                }

                plot.state = 'empty';
                plot.data = null;
                el.classList.remove('finished');
                visual.innerText = "";
                syncHUD();
            }
        }

        function createFX(parent, txt, color = "#39ff14") {
            const fx = document.createElement('div');
            fx.className = 'cash-fx';
            fx.innerText = txt;
            if(color) fx.style.color = color;
            parent.appendChild(fx);
            setTimeout(() => fx.remove(), 1200);
        }

        function syncHUD() {
            document.getElementById('credits').innerText = "$" + state.credits;
            document.getElementById('xp').innerText = state.xp;
            document.getElementById('lvl').innerText = state.lvl;
            
            localStorage.setItem('cc_credits', state.credits);
            localStorage.setItem('cc_xp', state.xp);
            localStorage.setItem('cc_lvl', state.lvl);
        }

        init();
    </script>
</body>
</html>
