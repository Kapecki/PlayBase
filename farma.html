<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Farm Pro | Simulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        
        body {
            margin: 0; background: #020205; color: white; font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* --- HUD --- */
        .top-bar {
            width: 100%; max-width: 1100px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
            border-bottom: 2px solid #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.2);
        }

        .user-tag { color: #ff00ff; font-weight: 900; text-shadow: 0 0 10px #ff00ff; }
        .money-val { color: #39ff14; font-size: 1.5rem; text-shadow: 0 0 10px #39ff14; }

        /* --- GRA --- */
        .container { display: flex; gap: 40px; margin-top: 50px; padding: 20px; }

        .shop {
            background: rgba(10,10,20,0.8); padding: 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); width: 250px;
        }

        .seed-card {
            background: #000; border: 2px solid #333; padding: 15px;
            margin-bottom: 15px; border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .seed-card:hover { border-color: #00d4ff; box-shadow: 0 0 15px #00d4ff; transform: scale(1.05); }
        .seed-card.active { border-color: #ff00ff; box-shadow: 0 0 15px #ff00ff; }

        .grid { display: grid; grid-template-columns: repeat(3, 160px); gap: 20px; }

        .plot {
            width: 160px; height: 160px; background: #0a0a0f; border-radius: 30px;
            border: 2px solid #111; position: relative; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.4s; overflow: hidden;
        }

        .plot:hover { border-color: #00d4ff; box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }

        /* Pasek Postępu RGB */
        .progress-box {
            position: absolute; bottom: 15px; width: 70%; height: 6px;
            background: #222; border-radius: 10px; overflow: hidden; display: none;
        }
        .progress-bar {
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #ff00ff, #00d4ff, #39ff14);
            background-size: 200%; animation: moveGradient 2s linear infinite;
        }
        @keyframes moveGradient { to { background-position: 200% center; } }

        .emoji { font-size: 60px; transition: 0.5s; }
        .timer-val { font-size: 10px; margin-top: 10px; color: #00d4ff; }

        /* MODAL RANKINGU */
        #rankBox {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #05050a; padding: 30px; border-radius: 20px; border: 2px solid #ff00ff;
            z-index: 100; box-shadow: 0 0 50px #ff00ff;
        }
        
        .rank-item { display: flex; justify-content: space-between; gap: 50px; margin-bottom: 10px; }

        .pop-text {
            position: absolute; color: #39ff14; font-weight: 900;
            animation: floatUp 1s forwards; pointer-events: none;
        }
        @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-100px); } }

    </style>
</head>
<body>

    <div class="top-bar">
        <div>USER: <span class="user-tag" id="ui-nick">---</span></div>
        <div class="money-val" id="ui-cash">$0</div>
        <button onclick="toggleRank()" style="background:transparent; border:1px solid #ff00ff; color:white; padding:5px 15px; cursor:pointer;">RANKING</button>
    </div>

    <div class="container">
        <div class="shop" id="shop">
            <h3 style="color:#00d4ff">SKLEP NASION</h3>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <div id="rankBox">
        <h2 style="color:#ff00ff">RANKING XP</h2>
        <div id="rankList"></div>
        <button onclick="toggleRank()" style="width:100%; margin-top:15px;">ZAMKNIJ</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <script>
        let p = {
            nick: localStorage.getItem('nick') || "Pilot",
            cash: parseInt(localStorage.getItem('m')) || 100,
            xp: parseInt(localStorage.getItem('x')) || 0,
            music: localStorage.getItem('musicOn') === 'true'
        };

        if(p.music) document.getElementById('bgMusic').play().catch(() => {});

        const seeds = [
            { name: "Neon Wheat", icon: "🌾", cost: 15, time: 4, win: 40, xp: 20 },
            { name: "Cyber Carrot", icon: "🥕", cost: 70, time: 10, win: 220, xp: 75 },
            { name: "Mega Core", icon: "🎃", cost: 300, time: 30, win: 1200, xp: 350 }
        ];

        let selected = null;
        let plots = Array(9).fill().map(() => ({ seed: null, ready: false, timer: 0 }));

        function init() {
            document.getElementById('ui-nick').innerText = p.nick;
            
            const shop = document.getElementById('shop');
            seeds.forEach(s => {
                const div = document.createElement('div');
                div.className = 'seed-card';
                div.innerHTML = `<b>${s.icon} ${s.name}</b><br><small>Koszt: $${s.cost} | +${s.xp}XP</small>`;
                div.onclick = () => {
                    if(p.cash >= s.cost) {
                        selected = s;
                        document.querySelectorAll('.seed-card').forEach(x => x.classList.remove('active'));
                        div.classList.add('active');
                    }
                };
                shop.appendChild(div);
            });

            const grid = document.getElementById('grid');
            plots.forEach((_, i) => {
                const div = document.createElement('div');
                div.className = 'plot';
                div.innerHTML = `<div class="emoji" id="e-${i}"></div>
                                 <div class="timer-val" id="t-${i}"></div>
                                 <div class="progress-box" id="pb-${i}"><div class="progress-bar" id="f-${i}"></div></div>`;
                div.onclick = () => clickPlot(i);
                grid.appendChild(div);
            });
            updateUI();
            setInterval(tick, 1000);
        }

        function clickPlot(i) {
            const plot = plots[i];
            if(!plot.seed && selected) {
                p.cash -= selected.cost;
                plot.seed = {...selected}; plot.timer = plot.seed.time;
                selected = null;
                document.querySelectorAll('.seed-card').forEach(x => x.classList.remove('active'));
                document.getElementById(`e-${i}`).innerText = "🌱";
                const bar = document.getElementById(`f-${i}`);
                document.getElementById(`pb-${i}`).style.display = 'block';
                bar.style.transition = `width ${plot.seed.time}s linear`;
                setTimeout(() => bar.style.width = '100%', 50);
                updateUI();
            } else if(plot.ready) {
                showFX(i, `+$${plot.seed.win}`);
                p.cash += plot.seed.win; p.xp += plot.seed.xp;
                plot.seed = null; plot.ready = false;
                document.getElementById(`e-${i}`).innerText = "";
                document.getElementById(`t-${i}`).innerText = "";
                document.getElementById(`f-${i}`).style.width = '0%';
                document.getElementById(`f-${i}`).style.transition = 'none';
                document.getElementById(`pb-${i}`).style.display = 'none';
                updateUI();
            }
        }

        function tick() {
            plots.forEach((pl, i) => {
                if(pl.seed && pl.timer > 0) {
                    pl.timer--;
                    document.getElementById(`t-${i}`).innerText = pl.timer + "S";
                    if(pl.timer === 0) {
                        pl.ready = true;
                        document.getElementById(`e-${i}`).innerText = pl.seed.icon;
                        document.getElementById(`t-${i}`).innerText = "GOTOWE";
                    }
                }
            });
            localStorage.setItem('m', p.cash);
            localStorage.setItem('x', p.xp);
        }

        function showFX(i, txt) {
            const el = document.createElement('div');
            el.className = 'pop-text'; el.innerText = txt;
            document.querySelectorAll('.plot')[i].appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function updateUI() {
            document.getElementById('ui-cash').innerText = `$${p.cash}`;
        }

        function toggleRank() {
            const box = document.getElementById('rankBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            if(box.style.display === 'block') {
                const list = [{n: "Cyberpuniek", x: 9999}, {n: "NeonGirl", x: 5500}, {n: p.nick, x: p.xp}].sort((a,b) => b.x - a.x);
                document.getElementById('rankList').innerHTML = list.map(i => `<div class="rank-item"><span>${i.n}</span><span>${i.x} XP</span></div>`).join('');
            }
        }

        init();
    </script>
</body>
</html>
