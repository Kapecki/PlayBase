<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Farma Ultra Pro RGB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        body {
            margin: 0; background: #020205; color: white; font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- HEADER --- */
        .hud {
            width: 100%; max-width: 1100px; padding: 25px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border-bottom: 2px solid #00f2ff; margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }

        .cash { color: #39ff14; font-size: 2rem; text-shadow: 0 0 10px #39ff14; }

        /* --- GAME ENGINE --- */
        .game-area { display: flex; gap: 50px; }

        .shop {
            width: 300px; background: rgba(255, 255, 255, 0.02);
            padding: 20px; border-radius: 30px; border: 1px solid #333;
        }

        .seed-buy {
            background: #000; border: 2px solid #444; padding: 15px;
            margin-bottom: 15px; border-radius: 20px; cursor: pointer;
            transition: 0.3s;
        }
        .seed-buy:hover { transform: scale(1.05); border-color: #ff007a; box-shadow: 0 0 20px #ff007a; }
        .seed-buy.active { border-color: #00f2ff; box-shadow: 0 0 20px #00f2ff; }

        .grid { display: grid; grid-template-columns: repeat(3, 160px); gap: 20px; }

        .plot {
            width: 160px; height: 160px; background: #080810; border-radius: 35px;
            border: 2px solid #1a1a2e; position: relative; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .plot:hover { border-color: #00f2ff; transform: scale(1.05); }

        /* Pasek postępu RGB */
        .p-bar-wrap {
            position: absolute; bottom: 20px; width: 70%; height: 8px;
            background: #111; border-radius: 10px; overflow: hidden; display: none;
        }
        .p-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff007a, #00f2ff, #39ff14);
            background-size: 200%; animation: rgb-move 2s linear infinite;
        }
        @keyframes rgb-move { to { background-position: 200% center; } }

        .emoji { font-size: 70px; }
        .timer { font-size: 12px; color: #00f2ff; margin-top: 5px; }

        .back-link { margin-top: 40px; color: #666; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

    <div class="hud">
        <div id="displayNick" style="color:#ff007a">---</div>
        <div class="cash" id="displayCash">$0</div>
        <div id="displayXp" style="color:#39ff14">XP: 0</div>
    </div>

    <div class="game-area">
        <div class="shop" id="shop"></div>
        <div class="grid" id="grid"></div>
    </div>

    <a href="index.html" class="back-link">WRÓĆ DO TERMINALA</a>

    <script>
        const state = {
            nick: localStorage.getItem('nick') || "Player",
            money: parseInt(localStorage.getItem('m')) || 200,
            xp: parseInt(localStorage.getItem('x')) || 0,
            selected: null
        };

        const seeds = [
            { name: "Neon Wheat", icon: "🌾", cost: 20, time: 5, win: 60, xp: 20 },
            { name: "Cyber Root", icon: "🥕", cost: 100, time: 15, win: 350, xp: 80 },
            { name: "Ultra Core", icon: "🎃", cost: 500, time: 45, win: 2000, xp: 450 }
        ];

        let plots = Array(9).fill().map(() => ({ seed: null, ready: false, t: 0 }));

        function init() {
            document.getElementById('displayNick').innerText = `USER: ${state.nick}`;
            
            const shopEl = document.getElementById('shop');
            seeds.forEach(s => {
                const d = document.createElement('div');
                d.className = 'seed-buy';
                d.innerHTML = `<b>${s.icon} ${s.name}</b><br><small>Cena: $${s.cost} | XP: +${s.xp}</small>`;
                d.onclick = () => {
                    if(state.money >= s.cost) {
                        state.selected = s;
                        document.querySelectorAll('.seed-buy').forEach(x => x.classList.remove('active'));
                        d.classList.add('active');
                    }
                };
                shopEl.appendChild(d);
            });

            const gridEl = document.getElementById('grid');
            plots.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'plot';
                d.innerHTML = `<div class="emoji" id="e-${i}"></div>
                               <div class="timer" id="t-${i}"></div>
                               <div class="p-bar-wrap" id="pw-${i}"><div class="p-bar-fill" id="pf-${i}"></div></div>`;
                d.onclick = () => clickPlot(i);
                gridEl.appendChild(d);
            });
            updateUI();
            setInterval(tick, 1000);
        }

        function clickPlot(i) {
            const p = plots[i];
            if(!p.seed && state.selected) {
                state.money -= state.selected.cost;
                p.seed = {...state.selected}; p.t = p.seed.time;
                state.selected = null;
                document.querySelectorAll('.seed-buy').forEach(x => x.classList.remove('active'));
                
                document.getElementById(`e-${i}`).innerText = "🌱";
                document.getElementById(`pw-${i}`).style.display = 'block';
                const fill = document.getElementById(`pf-${i}`);
                fill.style.transition = `width ${p.seed.time}s linear`;
                setTimeout(() => fill.style.width = '100%', 50);
                updateUI();
            } else if(p.ready) {
                state.money += p.seed.win; state.xp += p.seed.xp;
                p.seed = null; p.ready = false;
                document.getElementById(`e-${i}`).innerText = "";
                document.getElementById(`t-${i}`).innerText = "";
                document.getElementById(`pf-${i}`).style.width = "0%";
                document.getElementById(`pf-${i}`).style.transition = "none";
                document.getElementById(`pw-${i}`).style.display = 'none';
                updateUI();
            }
        }

        function tick() {
            plots.forEach((p, i) => {
                if(p.seed && p.t > 0) {
                    p.t--;
                    document.getElementById(`t-${i}`).innerText = p.t + "S";
                    if(p.t === 0) {
                        p.ready = true;
                        document.getElementById(`e-${i}`).innerText = p.seed.icon;
                        document.getElementById(`t-${i}`).innerText = "GOTOWE";
                    }
                }
            });
            localStorage.setItem('m', state.money);
            localStorage.setItem('x', state.xp);
        }

        function updateUI() {
            document.getElementById('displayCash').innerText = `$${state.money}`;
            document.getElementById('displayXp').innerText = `XP: ${state.xp}`;
        }

        init();
    </script>
</body>
</html>
