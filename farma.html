<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Farma Ultra RGB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00d4ff;
            --neon-green: #39ff14;
            --glass: rgba(255, 255, 255, 0.05);
            --border-rgb: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8);
        }

        body {
            margin: 0; background: #020205; color: white;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            /* Dynamiczne animowane tło */
            background: radial-gradient(circle at 50% 50%, #0d0d2b 0%, #020205 100%);
        }

        /* --- ANIMOWANE GWIAZDY W TLE --- */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2; z-index: -1; animation: drift 60s linear infinite;
        }
        @keyframes drift { from { background-position: 0 0; } to { background-position: 1000px 1000px; } }

        /* --- NOWOCZESNY HUD --- */
        .hud-container {
            width: 100%; max-width: 1000px; padding: 25px;
            display: flex; justify-content: space-around; align-items: center;
            background: var(--glass); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px; border-radius: 0 0 30px 30px;
        }

        .hud-card {
            text-align: center; position: relative;
        }

        .hud-card span:first-child {
            display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: 3px; color: var(--neon-blue); font-weight: bold;
        }

        .hud-card span:last-child {
            font-family: 'Orbitron', sans-serif; font-size: 24px;
            font-weight: 900; text-shadow: 0 0 10px var(--neon-blue);
        }

        /* --- PRZYCISK RANKINGU --- */
        .rank-trigger {
            background: transparent; border: 2px solid var(--neon-pink);
            color: var(--neon-pink); padding: 10px 25px; border-radius: 50px;
            font-family: 'Orbitron', sans-serif; cursor: pointer;
            transition: 0.4s; box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }
        .rank-trigger:hover {
            background: var(--neon-pink); color: black;
            box-shadow: 0 0 30px var(--neon-pink); transform: scale(1.05);
        }

        /* --- GŁÓWNY LAYOUT --- */
        .main-game {
            display: flex; gap: 40px; width: 100%; max-width: 1100px;
            padding: 20px; align-items: flex-start;
        }

        /* --- SKLEP (Cyber-Lab) --- */
        .cyber-shop {
            flex: 1; background: var(--glass); border-radius: 30px;
            padding: 30px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .seed-item {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 15px; margin-bottom: 15px;
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .seed-item:hover {
            border-color: var(--neon-green); transform: translateX(10px);
            background: rgba(57, 255, 20, 0.05);
        }

        .seed-item.active {
            border-color: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue);
            background: rgba(0, 212, 255, 0.1);
        }

        /* --- FARMA (Cyber-Grid) --- */
        .farm-grid {
            display: grid; grid-template-columns: repeat(3, 160px); gap: 25px;
        }

        .plot {
            width: 160px; height: 160px; border-radius: 35px;
            background: #0a0a0f; position: relative; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.05);
            transition: 0.4s; overflow: hidden;
        }

        /* RGB Border effect */
        .plot::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--neon-blue));
            animation: rotate 4s linear infinite; display: none;
        }
        .plot.growing::before { display: block; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .plot-inner {
            width: 152px; height: 152px; background: #0a0a0f;
            border-radius: 33px; z-index: 1; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .plot:hover {
            border-color: var(--neon-blue); transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .emoji { font-size: 60px; filter: drop-shadow(0 0 15px white); transition: 0.5s; }
        .timer { font-family: 'Orbitron'; font-size: 10px; color: var(--neon-blue); margin-top: 10px; font-weight: bold; }

        /* --- RANKING MODAL --- */
        #rankModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(5, 5, 10, 0.95); padding: 40px; border-radius: 40px;
            border: 2px solid var(--neon-pink); box-shadow: 0 0 100px rgba(255, 0, 255, 0.3);
            z-index: 1000; width: 400px; backdrop-filter: blur(30px);
        }

        .rank-row {
            display: flex; justify-content: space-between; padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-family: 'Orbitron';
        }

        /* --- EFEKTY --- */
        .fx-pop {
            position: absolute; pointer-events: none; animation: floatUp 1s forwards;
            font-family: 'Orbitron'; font-weight: 900;
        }
        @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-100px) scale(1.5); } }

    </style>
</head>
<body>

<div class="hud-container">
    <div class="hud-card"><span>Cyber-Kasa</span><span id="m">$0</span></div>
    <div class="hud-card"><span>Poziom</span><span id="l" style="color:var(--neon-pink)">1</span></div>
    <div class="hud-card"><span>Total XP</span><span id="x" style="color:var(--neon-green)">0</span></div>
    <button class="rank-trigger" onclick="toggleRank(true)">TOP GRACZE</button>
</div>

<div class="main-game">
    <div class="cyber-shop" id="shop">
        <h2 style="font-family:'Orbitron'; font-size: 18px; letter-spacing: 2px; margin-bottom: 25px; color: var(--neon-blue);">LABORATORIUM</h2>
    </div>

    <div class="farm-grid" id="grid"></div>
</div>

<div id="rankModal">
    <h2 style="font-family:'Orbitron'; text-align: center; color: var(--neon-pink);">GALERIA SŁAW</h2>
    <div id="rankContent"></div>
    <button onclick="toggleRank(false)" style="width:100%; margin-top:20px; background:transparent; color:white; border:1px solid white; padding:10px; border-radius:10px; cursor:pointer;">ZAMKNIJ</button>
</div>

<script>
    let player = {
        name: localStorage.getItem('nick') || prompt("Podaj swój Cyber-Nick:") || "Guest",
        m: parseInt(localStorage.getItem('m')) || 150,
        x: parseInt(localStorage.getItem('x')) || 0,
        l: parseInt(localStorage.getItem('l')) || 1
    };
    localStorage.setItem('nick', player.name);

    const seeds = [
        { name: "Neon Wheat", icon: "🌾", cost: 20, time: 5, win: 50, xp: 25 },
        { name: "Cyber Root", icon: "🥕", cost: 100, time: 15, win: 300, xp: 90 },
        { name: "Plasma Core", icon: "🎃", cost: 500, time: 40, win: 1800, xp: 400 }
    ];

    let selected = null;
    let plots = Array(9).fill().map(() => ({ seed: null, ready: false, t: 0 }));

    function init() {
        const sDiv = document.getElementById('shop');
        seeds.forEach((s, idx) => {
            const div = document.createElement('div');
            div.className = 'seed-item';
            div.innerHTML = `<span style="font-size:30px">${s.icon}</span> 
                             <div style="flex:1"><b>${s.name}</b><br><small style="color:var(--neon-green)">XP +${s.xp}</small></div>
                             <div style="font-family:'Orbitron'; color:var(--neon-blue)">$${s.cost}</div>`;
            div.onclick = () => {
                if(player.m >= s.cost) {
                    selected = s;
                    document.querySelectorAll('.seed-item').forEach(x => x.classList.remove('active'));
                    div.classList.add('active');
                }
            };
            sDiv.appendChild(div);
        });

        const gDiv = document.getElementById('grid');
        plots.forEach((_, i) => {
            const p = document.createElement('div');
            p.className = 'plot';
            p.id = `plot-${i}`;
            p.innerHTML = `<div class="plot-inner">
                            <div class="emoji" id="e-${i}"></div>
                            <div class="timer" id="t-${i}"></div>
                           </div>`;
            p.onclick = () => clickPlot(i);
            gDiv.appendChild(p);
        });
        updateUI();
        setInterval(tick, 1000);
    }

    function clickPlot(i) {
        const p = plots[i];
        if(!p.seed && selected) {
            player.m -= selected.cost;
            p.seed = {...selected}; p.t = p.seed.time;
            selected = null;
            document.querySelectorAll('.seed-item').forEach(x => x.classList.remove('active'));
            document.getElementById(`plot-${i}`).classList.add('growing');
            document.getElementById(`e-${i}`).innerText = "🌱";
            updateUI();
        } else if(p.ready) {
            pop(i, `+$${p.seed.win}`, "#00d4ff");
            player.m += p.seed.win; player.x += p.seed.xp;
            if(player.x >= player.l * 1000) { player.l++; pop(i, "LEVEL UP!", "#ff00ff"); }
            p.seed = null; p.ready = false;
            document.getElementById(`plot-${i}`).classList.remove('growing');
            document.getElementById(`e-${i}`).innerText = "";
            document.getElementById(`t-${i}`).innerText = "";
            updateUI();
        }
    }

    function tick() {
        plots.forEach((p, i) => {
            if(p.seed && p.t > 0) {
                p.t--;
                document.getElementById(`t-${i}`).innerText = p.t + "S";
                if(p.t === 0) {
                    p.ready = true;
                    document.getElementById(`e-${i}`).innerText = p.seed.icon;
                    document.getElementById(`t-${i}`).innerText = "READY";
                    document.getElementById(`t-${i}`).style.color = "var(--neon-green)";
                }
            }
        });
        save();
    }

    function pop(i, txt, col) {
        const p = document.createElement('div');
        p.className = 'fx-pop'; p.innerText = txt; p.style.color = col;
        p.style.textShadow = `0 0 10px ${col}`;
        document.getElementById(`plot-${i}`).appendChild(p);
        setTimeout(() => p.remove(), 1000);
    }

    function updateUI() {
        document.getElementById('m').innerText = `$${player.m}`;
        document.getElementById('x').innerText = player.x;
        document.getElementById('l').innerText = player.l;
    }

    function save() {
        localStorage.setItem('m', player.m);
        localStorage.setItem('x', player.x);
        localStorage.setItem('l', player.l);
    }

    function toggleRank(show) {
        const m = document.getElementById('rankModal');
        const c = document.getElementById('rankContent');
        m.style.display = show ? 'block' : 'none';
        if(show) {
            let top = [
                {n: "CyberPuniek", x: 25000}, {n: player.name, x: player.x, me: true}, {n: "NeonMasta", x: 12000}, {n: "Bot01", x: 500}
            ].sort((a,b) => b.x - a.x);
            c.innerHTML = top.map((p, idx) => `
                <div class="rank-row" style="${p.me ? 'color:var(--neon-pink); border:1px solid var(--neon-pink); border-radius:10px;' : ''}">
                    <span>#${idx+1} ${p.n}</span>
                    <span>${p.x} XP</span>
                </div>`).join('');
        }
    }

    init();
</script>
</body>
</html>
