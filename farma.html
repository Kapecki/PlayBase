<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>RGB HYPER FARMER | PlayBase</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@900&display=swap');

        :root {
            --bg: #000000;
            --neon-rgb: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
        }

        body {
            margin: 0; background: var(--bg); color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #110022 0%, #000 100%);
        }

        /* --- TĘCZOWY PASEK NA GÓRZE --- */
        .top-glow {
            width: 100%; height: 5px; background: var(--neon-rgb);
            background-size: 400%; animation: rgb-move 5s linear infinite;
        }

        @keyframes rgb-move { 0% { background-position: 0%; } 100% { background-position: 400%; } }

        /* --- STATYSTYKI --- */
        .hud {
            display: flex; gap: 20px; padding: 30px;
        }

        .hud-box {
            background: #111; border: 3px solid #fff;
            padding: 15px 30px; border-radius: 10px;
            box-shadow: 0 0 15px #ff00ff, inset 0 0 10px #00ffff;
            animation: border-flicker 2s infinite;
        }

        @keyframes border-flicker {
            0%, 100% { border-color: #00ffff; box-shadow: 0 0 20px #00ffff; }
            50% { border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
        }

        .hud-val { font-family: 'Press Start 2P', cursive; font-size: 14px; color: #fff; }

        /* --- GAME LAYOUT --- */
        .wrapper { display: flex; gap: 40px; margin-top: 20px; padding: 20px; }

        /* --- SKLEP --- */
        .shop {
            background: rgba(20, 20, 20, 0.9); padding: 25px;
            border-radius: 20px; border: 2px solid #333;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
        }

        .seed {
            background: #000; border: 2px solid #444; padding: 15px;
            margin-bottom: 15px; cursor: pointer; border-radius: 15px;
            transition: 0.2s; position: relative; overflow: hidden;
        }

        .seed:hover {
            transform: scale(1.05); border-color: #00ff00;
            box-shadow: 0 0 30px #00ff00;
        }

        .seed.active { border-color: #ff0000; box-shadow: 0 0 30px #ff0000; animation: shake 0.2s infinite; }

        @keyframes shake { 0% { left: 0; } 50% { left: 2px; } 100% { left: 0; } }

        /* --- GRID --- */
        .grid {
            display: grid; grid-template-columns: repeat(3, 160px); gap: 25px;
        }

        .plot {
            width: 160px; height: 160px; background: #050505;
            border-radius: 20px; position: relative; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid transparent;
            background-image: linear-gradient(#050505, #050505), var(--neon-rgb);
            background-origin: border-box; background-clip: content-box, border-box;
            background-size: 100% 100%, 400% 400%;
            animation: rgb-move 5s linear infinite;
        }

        .plot:hover { transform: scale(1.1) rotate(2deg); z-index: 10; }

        .plot-icon { font-size: 80px; filter: drop-shadow(0 0 15px #fff); }

        /* --- PROGRESS BAR --- */
        .bar-wrap {
            position: absolute; bottom: 10px; width: 80%; height: 12px;
            background: #222; border-radius: 10px; overflow: hidden; display: none;
        }

        .bar-fill {
            height: 100%; width: 0%; background: var(--neon-rgb);
            background-size: 400%; animation: rgb-move 2s linear infinite;
        }

        /* --- WYBUCH KASY --- */
        .cash-pop {
            position: absolute; font-family: 'Press Start 2P';
            font-size: 20px; color: #0f0; animation: explode 0.8s forwards;
            text-shadow: 0 0 10px #0f0; pointer-events: none;
        }

        @keyframes explode {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5) translateY(-100px); opacity: 0; }
        }

        .back-btn {
            margin-top: 50px; text-decoration: none; color: #ff0000;
            font-size: 12px; border: 2px solid #ff0000; padding: 10px 20px;
            border-radius: 5px; box-shadow: 0 0 15px #ff0000; transition: 0.3s;
        }
        .back-btn:hover { background: #ff0000; color: #000; }
    </style>
</head>
<body>

    <div class="top-glow"></div>

    <div class="hud">
        <div class="hud-box"><span class="hud-label">MONEY:</span> <span id="m" class="hud-val">$100</span></div>
        <div class="hud-box"><span class="hud-label">LVL:</span> <span id="l" class="hud-val">1</span></div>
    </div>

    <div class="wrapper">
        <div class="shop" id="shop">
            <h2 style="color:#0ff; text-align:center; margin-bottom:20px;">RGB STORE</h2>
            </div>

        <div class="grid" id="grid">
            </div>
    </div>

    <a href="index.html" class="back-btn">EXIT TO LOBBY</a>

    <script>
        let money = 100;
        let selectedSeed = null;

        const seeds = [
            { id: 1, name: "NEON WHEAT", icon: "🌾", cost: 10, time: 3, win: 30 },
            { id: 2, name: "CYBER ROOT", icon: "🥕", cost: 50, time: 7, win: 150 },
            { id: 3, name: "GIGA PUMPKIN", icon: "🎃", cost: 200, time: 15, win: 700 }
        ];

        let farmState = Array(9).fill().map(() => ({ seed: null, ready: false }));

        function init() {
            const sDiv = document.getElementById('shop');
            seeds.forEach(s => {
                const div = document.createElement('div');
                div.className = 'seed';
                div.innerHTML = `<b style="color:#0ff">${s.name}</b><br><small>Cost: $${s.cost}</small>`;
                div.onclick = () => {
                    if(money >= s.cost) {
                        selectedSeed = s;
                        document.querySelectorAll('.seed').forEach(x => x.classList.remove('active'));
                        div.classList.add('active');
                    }
                };
                sDiv.appendChild(div);
            });

            const gDiv = document.getElementById('grid');
            for(let i=0; i<9; i++) {
                const p = document.createElement('div');
                p.className = 'plot';
                p.innerHTML = `<div class="plot-icon" id="i-${i}"></div>
                               <div class="bar-wrap" id="w-${i}"><div class="bar-fill" id="f-${i}"></div></div>`;
                p.onclick = () => clickPlot(i);
                gDiv.appendChild(p);
            }
            updateUI();
        }

        function clickPlot(i) {
            const plot = farmState[i];
            const iconEl = document.getElementById(`i-${i}`);

            if(!plot.seed && selectedSeed) {
                money -= selectedSeed.cost;
                plot.seed = {...selectedSeed};
                selectedSeed = null;
                document.querySelectorAll('.seed').forEach(x => x.classList.remove('active'));

                iconEl.innerText = "🌱";
                const wrap = document.getElementById(`w-${i}`);
                const fill = document.getElementById(`f-${i}`);
                wrap.style.display = 'block';
                fill.style.transition = `width ${plot.seed.time}s linear`;
                
                setTimeout(() => fill.style.width = '100%', 50);

                setTimeout(() => {
                    plot.ready = true;
                    iconEl.innerText = plot.seed.icon;
                    wrap.style.display = 'none';
                }, plot.seed.time * 1000);
            } else if(plot.ready) {
                pop(i, `+$${plot.seed.win}`);
                money += plot.seed.win;
                plot.seed = null;
                plot.ready = false;
                iconEl.innerText = "";
                document.getElementById(`f-${i}`).style.width = '0%';
                document.getElementById(`f-${i}`).style.transition = 'none';
            }
            updateUI();
        }

        function pop(i, txt) {
            const plotEl = document.querySelectorAll('.plot')[i];
            const p = document.createElement('div');
            p.className = 'cash-pop'; p.innerText = txt;
            plotEl.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        function updateUI() {
            document.getElementById('m').innerText = `$${money}`;
        }

        init();
    </script>
</body>
</html>
