<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Cyber Farmer</title>
    <style>
        :root { --bg: #0b0e14; --panel: #161b22; --accent: #00ff99; --gold: #ffcc00; --primary: #00d4ff; }
        body { 
            margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        
        .top-nav { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .money-box { background: var(--panel); padding: 15px 30px; border-radius: 50px; border: 2px solid var(--gold); color: var(--gold); font-size: 24px; font-weight: bold; box-shadow: 0 0 15px rgba(255, 204, 0, 0.2); }

        .game-area { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        
        /* SKLEP */
        .shop { background: var(--panel); padding: 25px; border-radius: 25px; width: 280px; border: 1px solid #333; }
        .seed-item { 
            background: #0b0e14; padding: 15px; border-radius: 15px; margin-bottom: 12px; 
            border: 2px solid #222; cursor: pointer; transition: 0.3s;
        }
        .seed-item:hover { border-color: var(--accent); transform: scale(1.03); }
        .seed-item.selected { border-color: var(--primary); background: #1a2430; }

        /* POLA */
        .farm-grid { display: grid; grid-template-columns: repeat(3, 130px); gap: 15px; }
        .plot { 
            width: 130px; height: 130px; background: #2a1d15; border: 4px solid #3d2b1f; 
            border-radius: 20px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; cursor: pointer; position: relative; transition: 0.2s;
        }
        .plot:hover { border-color: var(--accent); }
        .plot-icon { font-size: 50px; transition: 0.3s; }
        
        .progress-container { position: absolute; bottom: 10px; width: 80%; height: 6px; background: #000; border-radius: 10px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; }

        .btn-back { margin-top: 50px; padding: 12px 25px; background: transparent; border: 1px solid #444; color: white; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .btn-back:hover { background: #444; }

        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .ready-anim { animation: bounce 0.6s infinite; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="btn-back" style="margin-top:0" onclick="location.href='index.html'">← WYJDŹ</button>
        <div class="money-box">💰 $<span id="money">50</span></div>
    </div>

    <div class="game-area">
        <div class="shop">
            <h2 style="color: var(--accent); margin-top:0">NASIONA</h2>
            <div id="shop-list"></div>
        </div>

        <div class="farm-grid" id="farm-grid"></div>
    </div>

    <script>
        let money = parseInt(localStorage.getItem('farm_money')) || 50;
        let selectedSeed = null;

        const seedTypes = [
            { name: 'Pszenica', icon: '🌾', cost: 10, time: 5, profit: 25 },
            { name: 'Marchew', icon: '🥕', cost: 40, time: 12, profit: 100 },
            { name: 'Dynia', icon: '🎃', cost: 150, time: 30, profit: 400 }
        ];

        let plots = Array(9).fill().map(() => ({ plant: null, ready: false }));

        function initShop() {
            const list = document.getElementById('shop-list');
            seedTypes.forEach((seed, idx) => {
                const div = document.createElement('div');
                div.className = 'seed-item';
                div.innerHTML = `<strong>${seed.icon} ${seed.name}</strong><br><small>Koszt: $${seed.cost} | Zysk: $${seed.profit}</small>`;
                div.onclick = () => {
                    if(money >= seed.cost) {
                        selectedSeed = seed;
                        document.querySelectorAll('.seed-item').forEach(i => i.classList.remove('selected'));
                        div.classList.add('selected');
                    }
                };
                list.appendChild(div);
            });
        }

        function initGrid() {
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';
            plots.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'plot';
                div.innerHTML = `
                    <span class="plot-icon" id="icon-${i}"></span>
                    <div class="progress-container" id="prog-cont-${i}">
                        <div class="progress-fill" id="prog-fill-${i}"></div>
                    </div>
                `;
                div.onclick = () => handlePlot(i);
                grid.appendChild(div);
            });
        }

        function handlePlot(i) {
            const p = plots[i];
            const icon = document.getElementById(`icon-${i}`);
            
            if (!p.plant && selectedSeed) {
                money -= selectedSeed.cost;
                p.plant = {...selectedSeed};
                updateUI();
                
                icon.innerText = '🌱';
                const cont = document.getElementById(`prog-cont-${i}`);
                const fill = document.getElementById(`prog-fill-${i}`);
                cont.style.display = 'block';
                
                let start = Date.now();
                let timer = setInterval(() => {
                    let elapsed = Date.now() - start;
                    let percent = (elapsed / (p.plant.time * 1000)) * 100;
                    fill.style.width = percent + '%';
                    
                    if (percent >= 100) {
                        clearInterval(timer);
                        p.ready = true;
                        cont.style.display = 'none';
                        icon.innerText = p.plant.icon;
                        icon.classList.add('ready-anim');
                    }
                }, 100);
                
                selectedSeed = null;
                document.querySelectorAll('.seed-item').forEach(i => i.classList.remove('selected'));
            } 
            else if (p.ready) {
                money += p.plant.profit;
                p.plant = null;
                p.ready = false;
                icon.innerText = '';
                icon.classList.remove('ready-anim');
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('money').innerText = money;
            localStorage.setItem('farm_money', money);
        }

        initShop();
        initGrid();
        updateUI();
    </script>
</body>
</html>
