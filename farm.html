<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Cyber Farmer</title>
    <style>
        :root { --bg: #0b0e14; --panel: #161b22; --accent: #00ff99; --gold: #ffcc00; }
        body { 
            margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 40px 20px; }
        .balance-card { background: var(--panel); padding: 15px 35px; border-radius: 100px; border: 2px solid var(--gold); font-size: 24px; font-weight: bold; color: var(--gold); box-shadow: 0 0 20px rgba(255,204,0,0.1); }

        .main-layout { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; padding: 20px; }
        
        .shop-box { background: var(--panel); padding: 30px; border-radius: 30px; width: 280px; border: 1px solid #333; }
        .seed-btn { 
            background: #0b0e14; padding: 15px; border-radius: 20px; margin-bottom: 15px; 
            border: 2px solid #222; cursor: pointer; transition: 0.3s;
        }
        .seed-btn:hover { border-color: var(--accent); }
        .seed-btn.selected { border-color: #00d4ff; background: #1a2430; }

        .grid { display: grid; grid-template-columns: repeat(3, 130px); gap: 20px; }
        .plot { 
            width: 130px; height: 130px; background: #1a1614; border: 4px solid #2d241e; 
            border-radius: 25px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative; overflow: hidden; transition: 0.2s;
        }
        .plot:hover { border-color: var(--accent); }
        .plant-icon { font-size: 50px; z-index: 2; }
        
        .progress-container { position: absolute; bottom: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.5); }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; }

        .back-btn { padding: 12px 25px; background: transparent; border: 1px solid #333; color: #555; border-radius: 15px; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-btn:hover { color: white; border-color: white; }

        @keyframes readyGrow { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .ready { animation: readyGrow 0.8s infinite; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">← POWRÓT DO LOBBY</a>
        <div class="balance-card">💰 $<span id="money">50</span></div>
    </div>

    <div class="main-layout">
        <div class="shop-box">
            <h2 style="color: var(--accent); margin-top: 0;">SKLEP</h2>
            <div id="seeds-container"></div>
        </div>

        <div class="grid" id="farm-grid"></div>
    </div>

    <script>
        let money = parseInt(localStorage.getItem('farmer_cash')) || 50;
        let activeSeed = null;

        const catalog = [
            { id: 0, name: 'Pszenica', icon: '🌾', cost: 10, time: 5, win: 25 },
            { id: 1, name: 'Marchew', icon: '🥕', cost: 50, time: 15, win: 150 },
            { id: 2, name: 'Dynia', icon: '🎃', cost: 200, time: 45, win: 700 }
        ];

        let farmState = Array(9).fill().map(() => ({ crop: null, isReady: false }));

        function init() {
            // Renderuj sklep
            const shop = document.getElementById('seeds-container');
            catalog.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'seed-btn';
                btn.innerHTML = `<strong>${item.icon} ${item.name}</strong><br><small>Koszt: $${item.cost} | Zysk: $${item.win}</small>`;
                btn.onclick = () => {
                    if(money >= item.cost) {
                        activeSeed = item;
                        document.querySelectorAll('.seed-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    }
                };
                shop.appendChild(btn);
            });

            // Renderuj pola
            const grid = document.getElementById('farm-grid');
            farmState.forEach((_, i) => {
                const plot = document.createElement('div');
                plot.className = 'plot';
                plot.innerHTML = `<span class="plant-icon" id="icon-${i}"></span><div class="progress-container"><div class="progress-bar" id="bar-${i}"></div></div>`;
                plot.onclick = () => clickPlot(i);
                grid.appendChild(plot);
            });
            updateUI();
        }

        function clickPlot(i) {
            let p = farmState[i];
            if(!p.crop && activeSeed) {
                money -= activeSeed.cost;
                p.crop = {...activeSeed};
                activeSeed = null;
                document.querySelectorAll('.seed-btn').forEach(b => b.classList.remove('selected'));
                grow(i);
            } else if(p.isReady) {
                money += p.crop.win;
                p.crop = null;
                p.isReady = false;
                document.getElementById(`icon-${i}`).innerText = '';
                document.getElementById(`icon-${i}`).classList.remove('ready');
            }
            updateUI();
        }

        function grow(i) {
            const bar = document.getElementById(`bar-${i}`);
            const icon = document.getElementById(`icon-${i}`);
            icon.innerText = '🌱';
            let start = Date.now();
            let duration = farmState[i].crop.time * 1000;

            let interval = setInterval(() => {
                let passed = Date.now() - start;
                let progress = (passed / duration) * 100;
                bar.style.width = progress + '%';
                if(progress >= 100) {
                    clearInterval(interval);
                    farmState[i].isReady = true;
                    icon.innerText = farmState[i].crop.icon;
                    icon.classList.add('ready');
                    bar.style.width = '0%';
                }
            }, 50);
        }

        function updateUI() {
            document.getElementById('money').innerText = money;
            localStorage.setItem('farmer_cash', money);
        }

        init();
    </script>
</body>
</html>
