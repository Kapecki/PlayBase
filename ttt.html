<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | TicTacToe</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .board { display: grid; gap: 10px; background: #00d4ff; padding: 10px; border-radius: 15px; }
        .board.s3 { grid-template-columns: repeat(3, 100px); }
        .board.s6 { grid-template-columns: repeat(6, 60px); }
        .cell { width: 100%; height: 100px; background: #0b0e14; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
        .board.s6 .cell { height: 60px; font-size: 20px; }
        .btn { padding: 15px 30px; margin-top: 20px; cursor: pointer; border-radius: 10px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1 id="status">TWÓJ RUCH (X)</h1>
    <div id="board" class="board s3"></div>
    <button class="btn" style="background:#ff4d4d; color:white" onclick="location.href='index.html'">POWRÓT DO LOBBY</button>

    <script>
        let board = Array(9).fill("");
        let active = true;
        const bEl = document.getElementById('board');

        function init() {
            bEl.innerHTML = '';
            board.forEach((_, i) => {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => { if(board[i] === "" && active) { board[i] = "X"; update(); if(!check()) { active = false; setTimeout(ai, 500); } } };
                bEl.appendChild(c);
            });
        }

        function ai() {
            let free = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if(free.length) board[free[Math.floor(Math.random()*free.length)]] = "O";
            update(); check(); active = true;
        }

        function update() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((v, i) => { cells[i].innerText = v; cells[i].style.color = v === "X" ? "red" : "#00d4ff"; });
        }

        function check() {
            const win = (s) => {
                const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                return lines.some(l => l.every(idx => board[idx] === s));
            };
            if(win("X")) { alert("WYGRAŁEŚ!"); location.reload(); return true; }
            if(win("O")) { alert("AI WYGRAŁO!"); location.reload(); return true; }
            if(!board.includes("")) { alert("REMIS!"); location.reload(); return true; }
            return false;
        }
        init();
    </script>
</body>
</html>
