<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | TicTacToe Pro</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .board { display: grid; gap: 12px; background: var(--primary); padding: 12px; border-radius: 20px; box-shadow: 0 0 50px rgba(0,212,255,0.3); }
        .board.s3 { grid-template-columns: repeat(3, 120px); }
        .cell { width: 120px; height: 120px; background: #0b0e14; display: flex; align-items: center; justify-content: center; font-size: 60px; cursor: pointer; border-radius: 10px; transition: 0.2s; font-weight: bold; }
        .cell:hover { background: #161b22; }

        /* Ekran końca gry */
        #end-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        #end-msg { font-size: 50px; color: var(--primary); margin-bottom: 30px; text-shadow: 0 0 20px var(--primary); }
        
        .btn { padding: 15px 40px; cursor: pointer; border-radius: 15px; border: none; font-weight: bold; transition: 0.3s; font-family: inherit; }
    </style>
</head>
<body>
    <audio id="bg-music" loop autoplay><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio>

    <h1 id="status" style="margin-bottom: 30px; letter-spacing: 2px;">TWÓJ RUCH <span style="color:red">(X)</span></h1>
    
    <div id="board" class="board s3"></div>

    <div id="end-screen">
        <div id="end-msg">WYGRANA!</div>
        <button class="btn" style="background:var(--primary)" onclick="location.reload()">ZAGRAJ PONOWNIE</button>
        <button class="btn" style="background:none; color:white; margin-top:20px; border: 1px solid #444" onclick="location.href='index.html'">POWRÓT DO LOBBY</button>
    </div>

    <button class="btn" style="background:#ff4d4d; color:white; margin-top: 40px;" onclick="location.href='index.html'">PODDAJ SIĘ</button>

    <script>
        let board = Array(9).fill("");
        let active = true;
        const music = document.getElementById('bg-music');
        
        // Fix dla muzyki (przeglądarki blokują auto-play)
        window.onclick = () => { music.play(); };

        function init() {
            const bEl = document.getElementById('board');
            board.forEach((_, i) => {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => { if(board[i] === "" && active) { board[i] = "X"; update(); if(!check()) { active = false; setTimeout(ai, 500); } } };
                bEl.appendChild(c);
            });
        }

        function ai() {
            let free = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if(free.length) board[free[Math.floor(Math.random()*free.length)]] = "O";
            update(); check(); active = true;
        }

        function update() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((v, i) => { cells[i].innerText = v; cells[i].style.color = v === "X" ? "#ff4d4d" : "#00d4ff"; });
        }

        function check() {
            const win = (s) => {
                const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                return lines.some(l => l.every(idx => board[idx] === s));
            };
            if(win("X")) { showEnd("ZWYCIĘSTWO!"); return true; }
            if(win("O")) { showEnd("PRZEGRAŁEŚ!"); return true; }
            if(!board.includes("")) { showEnd("REMIS!"); return true; }
            return false;
        }

        function showEnd(msg) {
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-msg').innerText = msg;
            active = false;
        }
        init();
    </script>
</body>
</html>
