<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Cyber Dash Pro</title>
    <style>
        :root { --neon: #00ff99; --primary: #00d4ff; }
        body { background: #000; color: var(--neon); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        canvas { border: 4px solid var(--neon); background: #050505; border-radius: 20px; box-shadow: 0 0 30px rgba(0,255,153,0.2); }

        #game-over { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .btn { padding: 12px 30px; margin-top: 15px; cursor: pointer; border-radius: 12px; border: none; font-weight: bold; background: #333; color: white; transition: 0.3s; }
        .btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <audio id="dash-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"></audio>

    <h1 id="score" style="text-shadow: 0 0 10px var(--neon); margin-bottom: 10px;">DYSTANS: 0m</h1>
    <canvas id="game" width="360" height="550"></canvas>
    
    <div id="controls" style="margin-top: 15px; color: #555; font-size: 14px;">Użyj klawiszy A / D lub STRZAŁEK</div>

    <div id="game-over">
        <h1 style="font-size: 60px; color: #ff4d4d; margin-bottom: 10px;">KOLIZJA!</h1>
        <h2 id="final-score" style="color: white; margin-bottom: 40px;">Wynik: 0m</h2>
        <button class="btn" style="background:var(--neon); color:black" onclick="location.reload()">SPRÓBUJ PONOWNIE</button>
        <button class="btn" style="background:none; color:white; border: 1px solid #444" onclick="location.href='index.html'">LOBBY</button>
    </div>

    <button id="start-hint" class="btn" style="background:var(--primary); color:black; position: fixed; bottom: 20px;">KLIKNIJ ABY ZACZĄĆ</button>

    <script>
        const cvs = document.getElementById('game');
        const ctx = cvs.getContext('2d');
        const music = document.getElementById('dash-music');
        let game = { active: false, x: 155, obs: [], score: 0, speed: 6 };

        window.onclick = () => { if(!game.active) { game.active = true; document.getElementById('start-hint').style.display='none'; music.play(); loop(); } };

        window.onkeydown = (e) => {
            if(e.key === "ArrowLeft" || e.key === "a") game.x = Math.max(15, game.x - 75);
            if(e.key === "ArrowRight" || e.key === "d") game.x = Math.min(265, game.x + 75);
        };

        function loop() {
            if(!game.active) return;
            ctx.clearRect(0, 0, 360, 550);
            
            // Gracz (Neonowa Kula)
            ctx.shadowBlur = 20; ctx.shadowColor = var(--primary);
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(game.x + 40, 480, 22, 0, 7); ctx.fill();
            ctx.shadowBlur = 0;

            // Przeszkody
            if(Math.random() < 0.04) game.obs.push({ x: [15, 100, 185, 270][Math.floor(Math.random()*4)], y: -50 });

            game.obs.forEach((o, i) => {
                o.y += game.speed;
                ctx.fillStyle = "#00ff99";
                ctx.fillRect(o.x, o.y, 75, 30);
                
                // Kolizja
                if(o.y > 440 && o.y < 500 && Math.abs(o.x - game.x) < 50) { 
                    gameOver();
                }
                if(o.y > 600) { game.obs.splice(i, 1); game.speed += 0.05; }
            });

            game.score += 0.15;
            document.getElementById('score').innerText = "DYSTANS: " + Math.floor(game.score) + "m";
            requestAnimationFrame(loop);
        }

        function gameOver() {
            game.active = false;
            music.pause();
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-score').innerText = "Twój dystans: " + Math.floor(game.score) + "m";
        }
    </script>
</body>
</html>
