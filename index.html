<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAPECKI - MULTIVERSE GENERATOR</title>
    <style>
        :root {
            --primary: #ff0000;
            --secondary: #00ff00;
            --bg: #050505;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: 0.5s;
        }

        /* EFEKT ULTRA RGB */
        .ultra-mode {
            animation: rainbowBG 2s infinite linear;
        }

        @keyframes rainbowBG {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid var(--primary);
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            max-width: 500px;
            z-index: 10;
        }

        h1 { font-size: 3rem; margin: 0; color: var(--primary); text-shadow: 0 0 10px red; }

        #project-display {
            font-size: 1.5rem;
            margin: 30px 0;
            min-height: 80px;
            color: #ddd;
            font-weight: bold;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255,0,0,0.4);
        }

        .btn:hover { transform: scale(1.1); box-shadow: 0 0 30px red; }

        .xp-bar {
            width: 100%;
            height: 10px;
            background: #222;
            margin-top: 20px;
            border-radius: 5px;
            overflow: hidden;
        }

        #xp-progress {
            width: 0%;
            height: 100%;
            background: var(--secondary);
            transition: 0.5s;
        }

        .stats { margin-top: 10px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

    <div class="main-card">
        <div id="lvl-display" style="color: var(--secondary); font-weight: bold;">LEVEL 1</div>
        <h1>KAPECKI HUB</h1>
        <p>Wylosuj swój następny projekt:</p>
        
        <div id="project-display">Kliknij przycisk, aby zacząć...</div>

        <button class="btn" onclick="generateProject()">LOSUJ PROJEKT</button>

        <div class="xp-bar">
            <div id="xp-progress"></div>
        </div>
        <div class="stats">XP: <span id="xp-val">0</span>/100</div>
        
        <button id="ultra-btn" class="btn" style="display:none; margin-top:20px; background: gold; color: black;" onclick="activateUltra()">AKTYWUJ TRYB ULTRA</button>
    </div>

    <script>
        const projects = [
            "Symulator Clickera w kosmosie 🚀",
            "Horror o złym RGB w pokoju 🕯️",
            "Strona, która sama pisze piosenki o Kapeckim 🎵",
            "Gra: Ucieczka przed lagami 🎮",
            "Generator ultra-szybkich skryptów AI 🤖",
            "Portal do wymiany petów w Clickerze 🐾",
            "Symulator YouTubera z 1 miliardem subów 📹",
            "Aplikacja: Detektor czystego RGB w pokoju 🌈"
        ];

        let xp = 0;
        let lvl = 1;

        function generateProject() {
            // Losowanie
            const randomProject = projects[Math.floor(Math.random() * projects.length)];
            document.getElementById('project-display').innerText = randomProject;

            // Dodawanie XP
            xp += 25;
            if (xp >= 100) {
                xp = 0;
                lvl++;
                document.getElementById('lvl-display').innerText = "LEVEL " + lvl;
                if(lvl === 3) {
                    document.getElementById('ultra-btn').style.display = 'inline-block';
                }
            }

            document.getElementById('xp-progress').style.width = xp + "%";
            document.getElementById('xp-val').innerText = xp;
        }

        function activateUltra() {
            document.body.classList.add('ultra-mode');
            document.querySelector('.main-card').style.borderColor = 'gold';
            document.querySelector('h1').innerText = "ULTRA K-HUB";
            document.querySelector('h1').style.color = "gold";
            alert("TRYB ULTRA AKTYWOWANY! Widzisz te kolory?!");
        }
    </script>
</body>
</html>
