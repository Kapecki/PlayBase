<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Tic-Tac-Toe Pro</title>
    <style>
        :root {
            --primary: #00d4ff; --secondary: #ffcc00; --danger: #ff4d4d;
            --bg: #0b0e14; --card: #161b22; --accent: #8e44ad;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Arial Black', sans-serif; background: var(--bg); color: white; overflow: hidden; }

        /* --- PASEK GÓRNY --- */
        #top-bar {
            position: fixed; top: 0; right: 0; padding: 25px; display: flex; align-items: center; gap: 15px; z-index: 1000;
        }
        .user-pill { 
            background: rgba(0, 212, 255, 0.1); border: 2px solid var(--primary); 
            padding: 10px 25px; border-radius: 50px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        .settings-icon { font-size: 28px; cursor: pointer; transition: 0.4s; display: inline-block; }
        .settings-icon:hover { transform: rotate(90deg); color: var(--secondary); }

        /* --- OKNO USTAWIEŃ (MODAL) --- */
        #settings-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .settings-card { 
            background: var(--card); padding: 40px; border-radius: 35px; border: 3px solid var(--primary); 
            width: 380px; text-align: center; box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
        }
        .settings-card h2 { margin-top: 0; color: var(--primary); }
        .settings-card input { 
            width: 90%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 2px solid #333; 
            background: #0b0e14; color: white; font-family: inherit; text-align: center; font-size: 18px;
        }
        .settings-card input:focus { border-color: var(--primary); outline: none; }
        
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin: 25px 0; padding: 0 10px; }
        
        /* --- KAFLE GŁÓWNE --- */
        #home-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hub-grid { display: flex; gap: 40px; }
        .hub-btn { 
            width: 350px; background: var(--card); border: 4px solid #333; border-radius: 45px; 
            padding: 50px; text-align: center; cursor: pointer; transition: 0.4s;
        }
        .hub-btn:hover { border-color: var(--primary); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,212,255,0.2); }
        .hub-btn.locked { border-style: dashed; opacity: 0.4; cursor: default; }

        /* --- RANKING I GRY --- */
        #game-lobby {
            display: none; position: fixed; inset: 0; background: var(--bg); z-index: 500;
            flex-direction: column; align-items: center; padding-top: 100px; overflow-y: auto;
        }
        .leaderboard {
            width: 90%; max-width: 550px; background: rgba(255,255,255,0.03); border: 3px solid var(--secondary);
            border-radius: 30px; padding: 25px; margin-bottom: 40px;
        }
        .rank-entry { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #222; font-size: 20px; }
        .rank-entry.highlight { color: var(--secondary); background: rgba(255,204,0,0.1); border-radius: 12px; border-bottom: none; }

        /* --- PLANSZA --- */
        #game-arena { display: none; position: fixed; inset: 0; background: #000; z-index: 600; flex-direction: column; align-items: center; justify-content: center; }
        .board { display: grid; gap: 12px; background: var(--primary); padding: 12px; border-radius: 20px; }
        .board.s9 { grid-template-columns: repeat(3, 130px); }
        .board.s18 { grid-template-columns: repeat(6, 100px); }
        .cell { background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 12px; font-size: 60px; transition: 0.2s; }
        .board.s9 .cell { width: 130px; height: 130px; }
        .board.s18 .cell { width: 100px; height: 100px; font-size: 50px; }
        .cell.x { color: var(--danger); } .cell.o { color: var(--primary); }

        .btn { padding: 15px 40px; border-radius: 15px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 16px; transition: 0.3s; }
        .btn:hover { filter: brightness(1.2); transform: scale(1.05); }

        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 30px; }
        .lvl-box { width: 75px; height: 75px; border-radius: 18px; border: 3px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; }
        .lvl-box.off { opacity: 0.15; cursor: not-allowed; }
    </style>
</head>
<body>

    <audio id="audio-player" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="top-bar">
        <div class="user-pill">
            <span id="player-name-tag">Wczytywanie...</span>
            <span class="settings-icon" onclick="openSettings()">⚙️</span>
        </div>
    </div>

    <div id="settings-overlay">
        <div class="settings-card">
            <h2>USTAWIENIA PROFILU</h2>
            <p style="color: #888;">Zmień nazwę gracza:</p>
            <input type="text" id="name-input" maxlength="15">
            
            <div class="toggle-row">
                <span>Muzyka w tle:</span>
                <button id="music-btn" class="btn" style="background: var(--danger);" onclick="toggleMusic()">WYŁĄCZONA</button>
            </div>
            
            <button class="btn" style="background: var(--primary); width: 100%; margin-top: 10px;" onclick="closeSettings()">ZAPISZ I WRÓĆ</button>
        </div>
    </div>

    <div id="home-screen">
        <h1 style="font-size: 80px; color: var(--primary); text-shadow: 0 0 30px rgba(0,212,255,0.3); margin-bottom: 50px;">PlayBase</h1>
        <div class="hub-grid">
            <div class="hub-btn" onclick="goToLobby()">
                <div style="font-size: 80px; margin-bottom: 20px;">🏆</div>
                <h2>KÓŁKO I KRZYŻYK</h2>
                <p>20 poziomów. Plansze 3x3 i 6x3. Ranking Live.</p>
            </div>
            <div class="hub-btn locked">
                <div style="font-size: 80px; margin-bottom: 20px;">❓</div>
                <h2>WKRÓTCE ????</h2>
                <p>Nowa gra wkrótce zostanie odblokowana.</p>
            </div>
        </div>
    </div>

    <div id="game-lobby">
        <div class="leaderboard">
            <h2 style="text-align: center; color: var(--secondary); margin-top: 0;">RANKING GLOBALNY</h2>
            <div id="rank-content"></div>
        </div>

        <h3 style="color: var(--primary)">ETAPY KLASYCZNE (3x3)</h3>
        <div class="level-grid" id="grid3x3"></div>

        <h3 style="color: var(--accent)">WIELKA ARENA (6x3)</h3>
        <div class="level-grid" id="grid6x3"></div>

        <button class="btn" onclick="location.reload()" style="background: #333; color: white; margin-bottom: 50px;">POWRÓT DO MENU</button>
    </div>

    <div id="game-arena">
        <div id="game-status" style="font-size: 40px; color: var(--secondary); margin-bottom: 30px;">TWOJA KOLEJ</div>
        <div id="game-board" class="board"></div>
        <button class="btn" onclick="backToLobby()" style="background: var(--danger); color: white; margin-top: 40px;">PODDAJ SIĘ</button>
    </div>

    <script>
        // --- SYSTEM ZAPISU I PROFILU ---
        const randomNames = ["SzybkiWilk", "CyberGracz", "MistrzX", "TurboO", "Gamer2026"];
        let playerName = localStorage.getItem('pb_name') || randomNames[Math.floor(Math.random()*randomNames.length)] + "_" + Math.floor(Math.random()*99);
        let playerWins = parseInt(localStorage.getItem('pb_wins')) || 0;
        let unlockedLvl = parseInt(localStorage.getItem('pb_unlocked')) || 1;
        let musicActive = false;

        function init() {
            document.getElementById('player-name-tag').innerText = playerName;
            document.getElementById('name-input').value = playerName;
        }

        function openSettings() { document.getElementById('settings-overlay').style.display = 'flex'; }

        function closeSettings() {
            const newName = document.getElementById('name-input').value.trim();
            if(newName) {
                playerName = newName;
                localStorage.setItem('pb_name', playerName);
                document.getElementById('player-name-tag').innerText = playerName;
            }
            document.getElementById('settings-overlay').style.display = 'none';
            if(document.getElementById('game-lobby').style.display === 'flex') refreshLeaderboard();
        }

        function toggleMusic() {
            const player = document.getElementById('audio-player');
            const btn = document.getElementById('music-btn');
            if(!musicActive) {
                player.play();
                btn.innerText = "WŁĄCZONA";
                btn.style.background = "#2ecc71";
                musicActive = true;
            } else {
                player.pause();
                btn.innerText = "WYŁĄCZONA";
                btn.style.background = "var(--danger)";
                musicActive = false;
            }
        }

        function refreshLeaderboard() {
            const content = document.getElementById('rank-content');
            const data = [
                {n: playerName, w: playerWins, me: true},
                {n: "Szymon_PRO", w: 14},
                {n: "Oliwia_X", w: 9},
                {n: "Legenda99", w: 5}
            ].sort((a,b) => b.w - a.w);

            content.innerHTML = '';
            data.forEach((p, i) => {
                content.innerHTML += `
                    <div class="rank-entry ${p.me ? 'highlight' : ''}">
                        <span>#${i+1} ${p.n}</span>
                        <span>${p.w} wygranych</span>
                    </div>`;
            });
        }

        function goToLobby() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-lobby').style.display = 'flex';
            refreshLeaderboard();
            drawLevels();
        }

        function drawLevels() {
            const draw = (id, s, e, col) => {
                const el = document.getElementById(id); el.innerHTML = '';
                for(let i=s; i<=e; i++) {
                    const box = document.createElement('div');
                    box.className = `lvl-box ${i > unlockedLvl ? 'off' : ''}`;
                    box.style.background = col; box.innerText = i;
                    if(i <= unlockedLvl) box.onclick = () => startMatch(i);
                    el.appendChild(box);
                }
            };
            draw('grid3x3', 1, 10, '#2ecc71');
            draw('grid6x3', 11, 20, '#a55eea');
        }

        // --- SILNIK GRY ---
        let boardState = [];
        let activeMatch = false;
        let matchLvl = 1;

        function startMatch(lvl) {
            matchLvl = lvl;
            document.getElementById('game-lobby').style.display = 'none';
            document.getElementById('game-arena').style.display = 'flex';
            
            const arena = document.getElementById('game-board');
            const isSmall = lvl <= 10;
            const size = isSmall ? 9 : 18;
            arena.className = `board ${isSmall ? 's9' : 's18'}`;
            boardState = Array(size).fill("");
            
            arena.innerHTML = '';
            for(let i=0; i<size; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => {
                    if(boardState[i] === "" && activeMatch) {
                        boardState[i] = "X"; renderBoard();
                        if(!checkGameOver()) {
                            activeMatch = false;
                            document.getElementById('game-status').innerText = "AI MYŚLI...";
                            setTimeout(aiPlay, 600);
                        }
                    }
                };
                arena.appendChild(c);
            }
            activeMatch = true;
            document.getElementById('game-status').innerText = "TWOJA KOLEJ (X)";
        }

        function aiPlay() {
            let options = boardState.map((v,i) => v===""?i:null).filter(v=>v!==null);
            if(options.length) boardState[options[Math.floor(Math.random()*options.length)]] = "O";
            renderBoard();
            if(!checkGameOver()) {
                activeMatch = true;
                document.getElementById('game-status').innerText = "TWOJA KOLEJ (X)";
            }
        }

        function checkGameOver() {
            const win = (p) => {
                const goal = matchLvl <= 10 ? 3 : 4;
                const c = matchLvl <= 10 ? 3 : 6;
                for(let i=0; i<boardState.length; i++) {
                    if(scanLine(i, 1, p, goal, c)) return true;
                    if(scanLine(i, c, p, goal, c)) return true;
                }
                return false;
            };

            if(win("X")) {
                activeMatch = false;
                playerWins++; unlockedLvl = Math.max(unlockedLvl, matchLvl + 1);
                localStorage.setItem('pb_wins', playerWins);
                localStorage.setItem('pb_unlocked', unlockedLvl);
                document.getElementById('game-status').innerText = "WYGRAŁEŚ! 🎉";
                return true;
            }
            if(win("O")) {
                activeMatch = false;
                document.getElementById('game-status').innerText = "PRZEGRAŁEŚ! 🤖";
                return true;
            }
            if(!boardState.includes("")) {
                activeMatch = false;
                document.getElementById('game-status').innerText = "REMIS! 🤝";
                return true;
            }
            return false;
        }

        function scanLine(s, step, p, goal, cols) {
            let count = 0;
            for(let i=0; i<goal; i++) {
                let idx = s + i*step;
                if(idx < boardState.length && boardState[idx] === p) count++;
            }
            return count === goal;
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            boardState.forEach((v,i) => { cells[i].innerText = v; cells[i].className = `cell ${v.toLowerCase()}`; });
        }

        function backToLobby() {
            document.getElementById('game-arena').style.display = 'none';
            goToLobby();
        }

        init();
    </script>
</body>
</html>
