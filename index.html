<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortress of Gears - RGB Edition</title>
    <style>
        /* Animacja tęczy RGB */
        @keyframes rgb-border {
            0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }
        @keyframes rgb-text {
            0% { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
            33% { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
            66% { color: #0000ff; text-shadow: 0 0 5px #0000ff; }
            100% { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
        }

        body {
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            animation: rgb-text 6s infinite linear;
            margin-bottom: 5px;
        }

        /* Panel Statystyk i Sklepu */
        #top-bar {
            display: flex;
            gap: 20px;
            background: #222;
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #333;
            animation: rgb-border 8s infinite linear;
            margin-bottom: 20px;
            align-items: center;
        }

        .stat { font-size: 18px; font-weight: bold; }
        
        .btn-buy {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-buy:hover { background: #444; border-color: #00ff00; }

        /* Główny Kontener */
        #game-container {
            display: flex;
            background-color: #151515;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #222;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Droga potworów */
        #path {
            width: 100px;
            height: 400px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .gate {
            position: absolute;
            width: 100%;
            text-align: center;
            padding: 5px 0;
            font-size: 12px;
            font-weight: bold;
            background: #333;
        }
        .spawn { top: 0; color: #ff4d4d; }
        .base { bottom: 0; color: #1e90ff; }

        /* Siatka kół */
        #grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 15px;
        }
        .slot {
            background-color: #1c1c1c;
            border: 2px dashed #333;
            border-radius: 50%;
            position: relative;
        }

        /* Koła Zębate RGB */
        .gear {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 28px;
            cursor: grab;
            user-select: none;
            border: 4px dashed;
            animation: spin 3s linear infinite, rgb-border 5s infinite linear;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Jednostki */
        .mob, .defender {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            position: absolute;
            left: 37px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .mob { background: #9400d3; top: 30px; }
        .defender { background: #00eded; bottom: 30px; animation: rgb-border 3s infinite linear; }

        /* PANEL Z LINKAMI */
        #links-panel {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }
        .custom-link {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: #222;
            border-radius: 5px;
            border: 1px solid #444;
            font-weight: bold;
            transition: 0.3s;
        }
        .custom-link:hover {
            animation: rgb-border 2s infinite linear;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>FORTRESS OF GEARS - CHROMA RGB</h1>

    <div id="top-bar">
        <div class="stat">Złoto: <span id="gold">50</span> 💰</div>
        <div class="stat">Życie: <span id="hp">10</span> ❤️</div>
        <button class="btn-buy" id="btn-buy-gear">Kup Koło Lvl 1 (Koszt: 20💰)</button>
    </div>

    <div id="game-container">
        <div id="path">
            <div class="gate spawn">PORTAL</div>
            <div class="gate base">BAZA</div>
        </div>
        <div id="grid"></div>
    </div>

    <div id="links-panel">
        <a href="https://github.com" target="_blank" class="custom-link">Mój GitHub 🚀</a>
        <a href="https://codepen.io" target="_blank" class="custom-link">Moje Projekty 💻</a>
    </div>

<script>
    let gold = 50;
    let hp = 10;
    let draggedGear = null;
    let mobs = [];
    let defenders = [];

    const grid = document.getElementById('grid');
    const path = document.getElementById('path');
    const goldDisplay = document.getElementById('gold');
    const hpDisplay = document.getElementById('hp');

    // Generowanie siatki 3x3
    for (let i = 0; i < 9; i++) {
        const slot = document.createElement('div');
        slot.classList.add('slot');
        slot.addEventListener('dragover', (e) => e.preventDefault());
        slot.addEventListener('drop', handleDrop);
        grid.appendChild(slot);
    }

    // Zakupywanie kół zębatych
    document.getElementById('btn-buy-gear').addEventListener('click', () => {
        if (gold >= 20) {
            const emptySlot = Array.from(document.querySelectorAll('.slot')).find(slot => !slot.hasChildNodes());
            if (emptySlot) {
                gold -= 20;
                goldDisplay.innerText = gold;
                createGear(emptySlot, 1);
            } else {
                alert("Brak wolnego miejsca na siatce!");
            }
        } else {
            alert("Za mało złota!");
        }
    });

    function createGear(slot, level) {
        if (level > 4) level = 4;
        const gear = document.createElement('div');
        gear.classList.add('gear');
        gear.draggable = true;
        gear.innerText = level;
        gear.dataset.level = level;

        // Im wyższy lvl, tym szybciej się kręci i częściej strzela
        gear.style.animationDuration = `${4 / level}s, 4s`;

        const spawnRate = 4000 / level;
        const interval = setInterval(() => {
            if (document.body.contains(gear)) {
                spawnDefender(level);
            } else {
                clearInterval(interval);
            }
        }, spawnRate);

        gear.addEventListener('dragstart', () => draggedGear = gear);
        gear.addEventListener('dragend', () => draggedGear = null);
        slot.appendChild(gear);
    }

    function handleDrop(e) {
        e.preventDefault();
        const targetSlot = this;
        const targetGear = targetSlot.querySelector('.gear');
        if (!draggedGear) return;

        const sourceSlot = draggedGear.parentElement;

        if (!targetGear) {
            targetSlot.appendChild(draggedGear);
        } else if (targetGear !== draggedGear) {
            const lvl1 = parseInt(draggedGear.dataset.level);
            const lvl2 = parseInt(targetGear.dataset.level);

            if (lvl1 === lvl2 && lvl1 < 4) {
                sourceSlot.innerHTML = '';
                targetSlot.innerHTML = '';
                createGear(targetSlot, lvl1 + 1);
                gold += 10; // Bonus za merge
                goldDisplay.innerText = gold;
            }
        }
    }

    function spawnMob() {
        const mob = document.createElement('div');
        mob.classList.add('mob');
        mob.innerText = "👹";
        mob.style.top = "30px";
        mob.dataset.hp = 3;
        path.appendChild(mob);
        mobs.push(mob);
    }
    setInterval(spawnMob, 3500);

    function spawnDefender(level) {
        const def = document.createElement('div');
        def.classList.add('defender');
        def.innerText = level === 1 ? "⚔️" : level === 2 ? "💥" : "⚡";
        def.style.bottom = "30px";
        def.dataset.power = level;
        path.appendChild(def);
        defenders.push(def);
    }

    // Pętla gry
    function update() {
        // Ruch potworów w dół
        for (let i = mobs.length - 1; i >= 0; i--) {
            let mob = mobs[i];
            let top = mob.offsetTop;
            mob.style.top = (top + 1) + "px";

            if (top >= 360) {
                hp--;
                hpDisplay.innerText = hp;
                mob.remove();
                mobs.splice(i, 1);
                if (hp <= 0) {
                    alert("Koniec gry! Twoja baza została zniszczona.");
                    window.location.reload();
                }
            }
        }

        // Ruch obrońców w górę
        for (let i = defenders.length - 1; i >= 0; i--) {
            let def = defenders[i];
            let top = def.offsetTop;
            def.style.top = (top - 2) + "px";

            if (top <= 20) {
                def.remove();
                defenders.splice(i, 1);
            }
        }

        // Walka
        for (let i = mobs.length - 1; i >= 0; i--) {
            let mob = mobs[i];
            for (let j = defenders.length - 1; j >= 0; j--) {
                let def = defenders[j];
                if (Math.abs(mob.offsetTop - def.offsetTop) < 20) {
                    let mHp = parseInt(mob.dataset.hp) - parseInt(def.dataset.power);
                    def.remove();
                    defenders.splice(j, 1);

                    if (mHp <= 0) {
                        gold += 15;
                        goldDisplay.innerText = gold;
                        mob.remove();
                        mobs.splice(i, 1);
                        break;
                    } else {
                        mob.dataset.hp = mHp;
                    }
                }
            }
        }
        requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
