<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Tic-Tac-Toe Network Edition</title>
    <style>
        :root {
            --primary: #00d4ff; --secondary: #ffcc00; --danger: #ff4d4d;
            --bg: #0b0e14; --card: #161b22; --accent: #a55eea;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Arial Black', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }

        /* --- HUB GŁÓWNY --- */
        #home-screen { height: 100vh; padding: 60px; text-align: center; background: radial-gradient(circle, #1e293b, #0b0e14); }
        .main-header h1 { font-size: clamp(40px, 10vw, 70px); color: var(--primary); text-shadow: 0 0 30px rgba(0,212,255,0.5); }
        
        .hub-grid { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 50px; }
        .hub-card { 
            width: 380px; background: var(--card); border: 5px solid #30363d; border-radius: 45px; 
            padding: 45px; transition: 0.4s; cursor: pointer; position: relative;
        }
        .hub-card:hover { transform: scale(1.05); border-color: var(--primary); }
        .hub-card.mystery { border-style: dashed; opacity: 0.6; }

        /* --- MENU Z TABELĄ (WIDOK PO KLIKNIĘCIU) --- */
        #game-menu {
            display: none; position: fixed; inset: 0; background: #0b0e14;
            z-index: 100; flex-direction: column; align-items: center; padding: 40px; overflow-y: auto;
        }

        .leaderboard-box {
            width: 100%; max-width: 650px; background: #1c222d; border: 4px solid var(--secondary);
            border-radius: 35px; padding: 30px; margin-bottom: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .leaderboard-box h2 { color: var(--secondary); margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .rank-list { width: 100%; }
        .rank-row { 
            display: flex; justify-content: space-between; padding: 15px 25px; 
            margin: 10px 0; border-radius: 15px; background: rgba(255,255,255,0.05);
            font-size: 20px; transition: 0.3s;
        }
        .rank-row.me { background: linear-gradient(90deg, rgba(255,204,0,0.3), rgba(0,212,255,0.3)); border: 2px solid var(--secondary); transform: scale(1.02); }
        .rank-num { font-weight: bold; width: 40px; }
        .rank-name { flex: 1; text-align: left; padding-left: 20px; }

        /* --- ARENA --- */
        #game-arena { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
        .board { display: grid; gap: 12px; background: var(--primary); padding: 12px; border-radius: 20px; }
        .board.s9 { grid-template-columns: repeat(3, 130px); }
        .board.s18 { grid-template-columns: repeat(6, 100px); }

        .cell { background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .board.s9 .cell { width: 130px; height: 130px; font-size: 80px; }
        .board.s18 .cell { width: 100px; height: 100px; font-size: 55px; }
        .cell.x { color: var(--danger); } .cell.o { color: var(--primary); }

        .status-txt { font-size: 35px; margin-bottom: 25px; color: var(--secondary); text-align: center; }
        .btn-action { margin-top: 25px; padding: 15px 45px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; font-size: 18px; }
        
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin: 20px 0; }
        .lvl-btn { width: 70px; height: 70px; border-radius: 15px; border: 3px solid white; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        .lvl-btn.locked { opacity: 0.2; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="main-header">
            <h1>PlayBase</h1>
            <p>Zdominuj globalne rankingi.</p>
        </div>
        <div class="hub-grid">
            <div class="hub-card" onclick="enterGame()">
                <div style="font-size: 90px;">👑</div>
                <h2>KÓŁKO I KRZYŻYK</h2>
                <p>Wejdź do tabeli i walcz o 1. miejsce!</p>
            </div>
            <div class="hub-card mystery">
                <div style="font-size: 90px;">❓</div>
                <h2>WKRÓTCE ????</h2>
                <p>Nowa gra już w produkcji.</p>
            </div>
        </div>
    </div>

    <div id="game-menu">
        <div class="leaderboard-box">
            <h2>🏆 Tabela Globalna (LIVE)</h2>
            <div id="leaderboard-content" class="rank-list">
                </div>
        </div>

        <div style="text-align: center;">
            <h3 style="color: var(--primary)">ARENA 3x3 (LVL 1-10)</h3>
            <div class="level-grid" id="grid-s"></div>
            <h3 style="color: var(--accent)">ARENA 6x3 (LVL 11-20)</h3>
            <div class="level-grid" id="grid-l"></div>
        </div>

        <button class="btn-action" onclick="location.reload()" style="background: #333; color: white;">POWRÓT</button>
    </div>

    <div id="game-arena">
        <div class="status-txt" id="status">TWOJA KOLEJ (X)</div>
        <div id="board" class="board"></div>
        <button class="btn-action" onclick="exitToMenu()" style="background: var(--danger); color: white;">ZREZYGNUJ</button>
    </div>

    <script>
        /** * SILNIK PLAYBASE LIVE v8.0 **/
        
        // Dane gracza
        let myWins = parseInt(localStorage.getItem('pb8_wins')) || 0;
        let myLvl = parseInt(localStorage.getItem('pb8_lvl')) || 1;
        
        // Symulacja innych graczy (Backend Simulation)
        let players = [
            { name: "TY (MISTRZ)", wins: myWins, isMe: true },
            { name: "X-Pro-Gamer", wins: 15 },
            { name: "Szymon_2012", wins: 8 },
            { name: "Bot_Tester", wins: 3 }
        ];

        function updateLeaderboard() {
            players[0].wins = myWins; // Aktualizuj moje punkty
            // Sortowanie po wygranych
            players.sort((a, b) => b.wins - a.wins);
            
            const container = document.getElementById('leaderboard-content');
            container.innerHTML = '';
            
            players.forEach((p, index) => {
                const row = document.createElement('div');
                row.className = `rank-row ${p.isMe ? 'me' : ''}`;
                row.innerHTML = `
                    <span class="rank-num">#${index + 1}</span>
                    <span class="rank-name">${p.name}</span>
                    <span class="rank-wins">${p.wins} WYGRANYCH</span>
                `;
                container.appendChild(row);
            });
        }

        function enterGame() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-menu').style.display = 'flex';
            updateLeaderboard();
            renderLvls();
        }

        function renderLvls() {
            const draw = (id, s, e, col) => {
                const div = document.getElementById(id); div.innerHTML = '';
                for(let i=s; i<=e; i++) {
                    const b = document.createElement('div');
                    b.className = `lvl-btn ${i > myLvl ? 'locked' : ''}`;
                    b.style.background = col; b.innerText = i;
                    if(i <= myLvl) b.onclick = () => startMatch(i);
                    div.appendChild(b);
                }
            };
            draw('grid-s', 1, 10, '#2ecc71');
            draw('grid-l', 11, 20, '#a55eea');
        }

        /* --- LOGIKA GRY --- */
        let board = [];
        let curLvl = 1;
        let active = true;

        function startMatch(l) {
            curLvl = l;
            document.getElementById('game-menu').style.display = 'none';
            document.getElementById('game-arena').style.display = 'flex';
            
            const bEl = document.getElementById('board');
            const size = l <= 10 ? 9 : 18;
            bEl.className = l <= 10 ? 'board s9' : 'board s18';
            board = Array(size).fill("");
            
            bEl.innerHTML = '';
            for(let i=0; i<size; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => move(i);
                bEl.appendChild(c);
            }
            active = true;
            document.getElementById('status').innerText = "TWOJA KOLEJ (X)";
        }

        function move(i) {
            if(board[i] === "" && active) {
                board[i] = "X";
                refresh();
                if(!check()) {
                    active = false;
                    document.getElementById('status').innerText = "AI MYŚLI...";
                    setTimeout(ai, 500);
                }
            }
        }

        function ai() {
            let free = board.map((v,i) => v===""?i:null).filter(v=>v!==null);
            if(free.length > 0) {
                let choice = free[Math.floor(Math.random()*free.length)];
                board[choice] = "O";
            }
            refresh();
            if(!check()) {
                active = true;
                document.getElementById('status').innerText = "TWOJA KOLEJ (X)";
            }
        }

        function check() {
            const isS = curLvl <= 10;
            const target = isS ? 3 : 4;
            const cols = isS ? 3 : 6;

            const win = (p) => {
                for(let i=0; i<board.length; i++) {
                    if(line(i, 1, p, target, cols)) return true;
                    if(line(i, cols, p, target, cols)) return true;
                    if(line(i, cols+1, p, target, cols)) return true;
                    if(line(i, cols-1, p, target, cols)) return true;
                }
                return false;
            };

            if(win("X")) return end("X");
            if(win("O")) return end("O");
            if(!board.includes("")) return end("tie");
            return false;
        }

        function line(s, step, p, t, cols) {
            let c = 0;
            for(let i=0; i<t; i++) {
                let idx = s + i*step;
                if(idx >= 0 && idx < board.length && board[idx] === p) {
                    if(step === 1 && Math.floor(idx/cols) !== Math.floor(s/cols)) break;
                    c++;
                } else break;
            }
            return c === t;
        }

        function end(res) {
            active = false;
            if(res === "X") {
                document.getElementById('status').innerText = "ZWYCIĘSTWO! 🎉";
                myWins++; localStorage.setItem('pb8_wins', myWins);
                if(curLvl === myLvl && myLvl < 20) { myLvl++; localStorage.setItem('pb8_lvl', myLvl); }
            } else if(res === "O") document.getElementById('status').innerText = "PRZEGRANA 🤖";
            else document.getElementById('status').innerText = "REMIS 🤝";
            return true;
        }

        function refresh() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((v, i) => {
                cells[i].innerText = v;
                cells[i].className = `cell ${v.toLowerCase()}`;
            });
        }

        function exitToMenu() {
            document.getElementById('game-arena').style.display = 'none';
            document.getElementById('game-menu').style.display = 'flex';
            updateLeaderboard();
            renderLvls();
        }

        // DODATEK: Symulacja "życia" tabeli co 10 sekund (ktoś inny może zdobyć punkt)
        setInterval(() => {
            if(Math.random() > 0.7) {
                players[1].wins += 1; // Inny gracz zdobywa punkt
                if(document.getElementById('game-menu').style.display === 'flex') updateLeaderboard();
            }
        }, 10000);
    </script>
</body>
</html>
