<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Base Ultra RGB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --neon-green: #39ff14;
        }

        body {
            margin: 0; background: #000; color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at center, #0a0a20 0%, #000 100%);
            overflow: hidden;
        }

        /* --- TŁO RGB --- */
        .bg-glow {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            opacity: 0.05; filter: blur(100px); z-index: -1;
        }

        .container { text-align: center; z-index: 1; }

        h1 {
            font-size: 4rem; text-transform: uppercase; letter-spacing: 10px;
            margin-bottom: 50px; text-shadow: 0 0 20px var(--neon-blue);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; text-shadow: 0 0 40px var(--neon-blue); } }

        /* --- MENU GIER --- */
        .menu { display: flex; gap: 40px; justify-content: center; }

        .game-card {
            width: 250px; height: 350px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 242, 255, 0.3);
            border-radius: 30px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; color: white;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Płynne rośnięcie */
            position: relative; overflow: hidden;
        }

        /* EFEKT ROŚNIĘCIA I ŚWIECENIA */
        .game-card:hover {
            transform: scale(1.15); /* Rośnie przy najechaniu */
            border-color: var(--neon-pink);
            box-shadow: 0 0 50px rgba(255, 0, 122, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .game-card i { font-size: 80px; margin-bottom: 20px; transition: 0.5s; }
        .game-card:hover i { transform: scale(1.2); filter: drop-shadow(0 0 15px var(--neon-pink)); }

        .game-title { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; }

        /* --- USTAWIENIA --- */
        .settings {
            margin-top: 60px; padding: 20px;
            background: rgba(0, 0, 0, 0.6); border-radius: 20px;
            border: 1px solid #333; width: 400px;
        }

        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }

        input[type="text"] {
            background: #000; border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 8px; border-radius: 5px;
            font-family: 'Orbitron'; text-align: center;
        }

        .toggle-btn {
            background: var(--neon-blue); color: black; border: none;
            padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <h1>Cyber-Lobby</h1>

        <div class="menu">
            <a href="farma.html" class="game-card">
                <div style="font-size: 60px;">🌾</div>
                <span class="game-title">FARMA PRO</span>
                <p style="font-size: 10px; color: var(--neon-blue);">ULTRASONIC SIMULATOR</p>
            </a>

            <div class="game-card" style="opacity: 0.5; cursor: not-allowed;">
                <div style="font-size: 60px;">🚀</div>
                <span class="game-title">SOON</span>
                <p style="font-size: 10px;">LOCKED</p>
            </div>
        </div>

        <div class="settings">
            <div class="setting-row">
                <span>NICK:</span>
                <input type="text" id="nickInput" placeholder="Twoja ksywa...">
            </div>
            <div class="setting-row">
                <span>MUZYKA:</span>
                <button class="toggle-btn" id="musicBtn">ON</button>
            </div>
        </div>
    </div>

    <script>
        const nickInput = document.getElementById('nickInput');
        const musicBtn = document.getElementById('musicBtn');

        // Wczytywanie danych
        nickInput.value = localStorage.getItem('nick') || "Player_One";
        let musicOn = localStorage.getItem('musicOn') === 'true';
        updateMusicBtn();

        nickInput.oninput = () => localStorage.setItem('nick', nickInput.value);

        musicBtn.onclick = () => {
            musicOn = !musicOn;
            localStorage.setItem('musicOn', musicOn);
            updateMusicBtn();
        };

        function updateMusicBtn() {
            musicBtn.innerText = musicOn ? "ON" : "OFF";
            musicBtn.style.background = musicOn ? "#39ff14" : "#ff007a";
        }
    </script>
</body>
</html>
