<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAPECKI - LIVE DISCORD</title>
    <style>
        :root {
            --bg-main: #313338;
            --bg-sidebar: #1e1f22;
            --bg-channels: #2b2d31;
            --accent-red: #ff0000;
            --text-primary: #f2f3f5;
            --text-muted: #949ba4;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex; overflow: hidden;
        }

        /* RGB ANIMACJA DLA LOGO */
        @keyframes rgb-border {
            0% { box-shadow: 0 0 15px red; }
            50% { box-shadow: 0 0 15px #ff00ff; }
            100% { box-shadow: 0 0 15px red; }
        }

        /* BOCZNY PASEK SERWERÓW */
        .server-sidebar {
            width: 72px; background-color: var(--bg-sidebar);
            display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 10px;
        }

        .server-btn {
            width: 48px; height: 48px; background-color: var(--accent-red);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; cursor: pointer; transition: 0.2s;
            color: white; text-decoration: none;
            animation: rgb-border 3s infinite;
        }

        .server-btn:hover { border-radius: 15px; background-color: #cc0000; }

        /* LISTA KANAŁÓW */
        .channel-sidebar {
            width: 240px; background-color: var(--bg-channels);
            display: flex; flex-direction: column;
        }

        .header {
            height: 48px; padding: 0 16px; display: flex; align-items: center;
            font-weight: bold; border-bottom: 1px solid #232428;
        }

        .channel-list { padding: 10px; flex-grow: 1; }
        .channel {
            padding: 8px; border-radius: 4px; color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .channel:hover, .channel.active { background-color: #3f4147; color: white; }

        /* GŁÓWNY CZAT */
        .chat-container { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        
        #messages-flow {
            flex-grow: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }

        .msg-card { display: flex; gap: 15px; position: relative; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .avatar { width: 40px; height: 40px; background: red; border-radius: 50%; flex-shrink: 0; }
        
        .msg-body b { color: #fff; font-size: 14px; }
        .msg-text { color: #dcdee1; margin-top: 4px; word-break: break-all; }

        .delete-btn {
            position: absolute; right: 10px; top: 0;
            color: #ed4245; cursor: pointer; font-size: 12px;
            display: none; background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 4px;
        }
        .msg-card:hover .delete-btn { display: block; }

        /* POLE WPISYWANIA */
        .input-box { padding: 0 20px 24px; }
        #chat-input {
            width: 100%; background: #383a40; border: none; padding: 15px;
            border-radius: 8px; color: white; outline: none; font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="server-sidebar">
        <a href="https://www.youtube.com/@Kapecki" target="_blank" class="server-btn">K</a>
    </div>

    <div class="channel-sidebar">
        <div class="header">KAPECKI HUB</div>
        <div class="channel-list">
            <div class="channel active"># ogólny</div>
            <div class="channel"># projekty-rgb</div>
            <div class="channel"># pomoc</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="header"># ogólny</div>
        <div id="messages-flow">
            <div class="msg-card">
                <div class="avatar" style="background: #5865f2;"></div>
                <div class="msg-body">
                    <b>System Bot</b> <span style="color:gray; font-size:10px;">TERAZ</span>
                    <div class="msg-text">Witaj na pokładzie! Możesz tu pisać i usuwać wiadomości. 🔥</div>
                </div>
            </div>
        </div>

        <div class="input-box">
            <input type="text" id="chat-input" placeholder="Napisz coś i kliknij Enter...">
        </div>
    </div>

    <script>
        const input = document.getElementById('chat-input');
        const flow = document.getElementById('messages-flow');

        // Funkcja dodawania wiadomości
        function addMessage(text) {
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-card';
            msgDiv.innerHTML = `
                <div class="avatar"></div>
                <div class="msg-body">
                    <b>Ty (Kapecki)</b> <span style="color:gray; font-size:10px;">Dziś o ${now}</span>
                    <div class="msg-text">${text}</div>
                </div>
                <div class="delete-btn" onclick="this.parentElement.remove()">USUŃ</div>
            `;
            flow.appendChild(msgDiv);
            flow.scrollTop = flow.scrollHeight; // Przewiń na dół
        }

        // Obsługa klawisza Enter
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && input.value.trim() !== "") {
                addMessage(input.value);
                input.value = ""; // Wyczyść pole
            }
        });
    </script>

</body>
</html>
