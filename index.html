<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAPECKI - OFFICIAL RGB HUB</title>
    <style>
        /* Animacja tęczowego tła */
        @keyframes rainbowBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Gradient RGB */
            background: linear-gradient(-45deg, #ff0000, #ff00ff, #0000ff, #00ff00);
            background-size: 400% 400%;
            animation: rainbowBG 10s ease infinite;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Kontener na logo */
        .hub-container {
            text-align: center;
            z-index: 10;
        }

        /* Twoje Logo z YT */
        .logo-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: url('https://yt3.googleusercontent.com/ytc/AIdro_n8ePZ89A083jZ8q9O49S9O49S9O49S9O49S9O4=s176-c-k-c0x00ffffff-no-rj') no-repeat center;
            background-size: cover;
            border: 8px solid white;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(255, 0, 0, 0.6);
            display: inline-block;
            cursor: pointer;
            transition: 0.4s;
            animation: pulseLogo 2s infinite alternate;
        }

        .logo-circle:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 100px rgba(255, 255, 255, 1);
        }

        @keyframes pulseLogo {
            from { transform: scale(1); box-shadow: 0 0 30px rgba(255, 255, 255, 0.5); }
            to { transform: scale(1.05); box-shadow: 0 0 70px rgba(255, 0, 0, 1); }
        }

        h1 {
            color: white;
            font-size: 3.5rem;
            text-shadow: 0 0 20px black, 0 0 10px rgba(255,255,255,0.5);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .btn-visit {
            margin-top: 20px;
            padding: 15px 40px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
            display: inline-block;
        }

        .btn-visit:hover {
            background: #ff0000;
            color: white;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <a href="https://www.youtube.com/@Kapecki" target="_blank">
            <div class="logo-circle"></div>
        </a>
        <h1>KAPECKI</h1>
        <p style="color: white; font-weight: bold;">EXPLORE THE RGB JOURNEY</p>
        <a href="https://www.youtube.com/@Kapecki" target="_blank" class="btn-visit">SUBSKRYBUJ</a>
    </div>

</body>
</html>
