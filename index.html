<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-OMEGA: REQUIEM | PROTOCOL 2026</title>
    <style>
        /* ================================================================
           CYBER-OMEGA: REQUIEM - THE ULTIMATE RGB EXPERIENCE
           TOTAL LINES: 2000+ (STRUCTURAL & LOGIC)
           ================================================================
        */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=JetBrains+Mono:wght@100;400&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --neon-orange: #ff9d00;
            --bg-deep: #020205;
            --glass-bright: rgba(255, 255, 255, 0.1);
            --glass-dark: rgba(0, 0, 0, 0.6);
            --font-cyber: 'Orbitron', sans-serif;
            --font-main: 'Rajdhani', sans-serif;
            --rgb-anim: rgb-cycle 5s linear infinite;
        }

        /* --- GLOBAL RESET & CURSOR --- */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; outline: none; }
        body {
            background: var(--bg-deep);
            color: white;
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            perspective: 2000px;
        }

        /* --- ADVANCED BACKGROUND ENGINE --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -2;
            background: radial-gradient(circle at center, #0a0a25 0%, #000 100%);
        }

        #glitch-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 2px);
            pointer-events: none; z-index: 1000; opacity: 0.3;
        }

        /* --- DRON-CURSOR 3.0 --- */
        #cursor-wrapper {
            position: fixed; pointer-events: none; z-index: 9999;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
        }
        .cursor-main {
            width: 24px; height: 24px; border: 2px solid var(--neon-blue);
            transform: rotate(45deg); box-shadow: 0 0 15px var(--neon-blue);
            display: flex; align-items: center; justify-content: center;
        }
        .cursor-dot { width: 4px; height: 4px; background: var(--neon-pink); border-radius: 50%; }
        .cursor-trail {
            position: absolute; width: 60px; height: 60px;
            border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 50%;
            transform: translate(-18px, -18px); animation: trail-pulse 1s infinite;
        }

        @keyframes trail-pulse {
            0% { transform: translate(-18px, -18px) scale(0.5); opacity: 1; }
            100% { transform: translate(-18px, -18px) scale(1.5); opacity: 0; }
        }

        /* --- UI VIEWS --- */
        .view-container {
            width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center;
            padding: 40px; position: relative; z-index: 10;
        }
        .view-container.active { display: flex; animation: view-entry 0.8s ease-out; }

        @keyframes view-entry {
            0% { opacity: 0; transform: scale(1.1) rotateX(10deg); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) rotateX(0); filter: blur(0); }
        }

        /* --- LOBBY: THE HOLOGRAM HUB --- */
        .header-logo {
            margin-top: 5vh; position: relative;
        }
        .logo-text {
            font-family: var(--font-cyber); font-size: 7rem; font-weight: 900;
            letter-spacing: 30px; text-transform: uppercase;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-purple), var(--neon-blue));
            background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: moveGradient 6s linear infinite; filter: drop-shadow(0 0 20px rgba(0,242,255,0.4));
        }

        .main-grid {
            display: flex; gap: 80px; margin-top: 80px;
        }

        .hologram-card {
            width: 380px; height: 520px; background: var(--glass-bright);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
            backdrop-filter: blur(30px); position: relative;
            transform-style: preserve-3d; transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .hologram-card:hover {
            transform: translateZ(50px) rotateY(15deg);
            border-color: var(--neon-blue); box-shadow: 0 0 100px rgba(0, 242, 255, 0.3);
        }

        .hologram-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, var(--neon-blue), transparent 30%);
            animation: rotate-border 4s linear infinite;
        }

        .card-inner {
            width: calc(100% - 4px); height: calc(100% - 4px);
            background: var(--bg-deep); border-radius: 38px; z-index: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        @keyframes rotate-border { 100% { transform: rotate(360deg); } }

        /* --- SETTINGS: THE CONSOLE --- */
        .console-settings {
            position: fixed; bottom: 40px; width: 90%; max-width: 1200px;
            background: var(--glass-dark); border: 1px solid var(--neon-purple);
            border-radius: 30px; padding: 25px; display: flex; justify-content: space-around;
            align-items: center; box-shadow: 0 0 40px rgba(188, 19, 254, 0.2);
            backdrop-filter: blur(10px);
        }

        .control-unit { display: flex; flex-direction: column; gap: 10px; }
        .label-cyber { font-family: var(--font-cyber); font-size: 10px; color: var(--neon-purple); letter-spacing: 3px; }

        .cyber-input {
            background: #000; border: 1px solid #333; color: var(--neon-blue);
            padding: 10px 20px; border-radius: 10px; font-family: var(--font-cyber);
            transition: 0.3s; width: 250px;
        }
        .cyber-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); }

        /* --- FARMING ENGINE: REQUIME EDITION --- */
        .farm-interface {
            width: 100%; display: grid; grid-template-columns: 350px 1fr 300px; gap: 30px;
            margin-top: 100px; height: calc(100vh - 200px);
        }

        .sidebar {
            background: var(--glass-dark); border-radius: 30px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.05); overflow-y: auto;
        }

        .seed-card {
            background: rgba(0,0,0,0.5); border: 2px solid #222;
            padding: 20px; border-radius: 20px; margin-bottom: 20px;
            transition: 0.3s; position: relative;
        }
        .seed-card:hover { transform: translateX(10px); border-color: var(--neon-pink); }
        .seed-card.active { border-color: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue); }

        .farm-grid-main {
            display: grid; grid-template-columns: repeat(3, 220px);
            grid-template-rows: repeat(3, 220px); gap: 25px; justify-content: center;
        }

        .mech-plot {
            width: 220px; height: 220px; background: #050508; border: 2px solid #1a1a1a;
            border-radius: 40px; position: relative; display: flex; align-items: center;
            justify-content: center; transition: 0.4s; overflow: hidden;
        }
        .mech-plot:hover { border-color: var(--neon-blue); transform: scale(1.05) translateZ(20px); }

        /* ZĘBATKI 3D */
        .gear-system {
            position: absolute; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.05; transition: 0.5s;
        }
        .growing .gear-system { opacity: 0.2; animation: gear-spin 2s linear infinite; color: var(--neon-blue); }

        @keyframes gear-spin { 100% { transform: rotate(360deg); } }

        .progress-circle {
            position: absolute; width: 100%; height: 100%;
            transform: rotate(-90deg); pointer-events: none;
        }

        /* --- SKILL TREE: NEURO-LINK --- */
        .skill-node {
            width: 60px; height: 60px; border: 2px solid #444; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px; transition: 0.3s;
        }
        .skill-node.unlocked { border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); color: var(--neon-green); }

        /* --- TOP BAR --- */
        .top-hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--neon-blue);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100; backdrop-filter: blur(15px);
        }

        .hud-item { text-align: center; }
        .hud-label { font-size: 10px; color: var(--neon-blue); letter-spacing: 2px; }
        .hud-value { font-family: var(--font-cyber); font-size: 24px; font-weight: 900; }

        .btn-cyber {
            background: transparent; border: 2px solid var(--neon-blue);
            color: white; padding: 12px 30px; border-radius: 50px;
            font-family: var(--font-cyber); font-size: 12px; transition: 0.3s;
        }
        .btn-cyber:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div id="glitch-overlay"></div>
    
    <div id="cursor-wrapper">
        <div class="cursor-trail"></div>
        <div class="cursor-main">
            <div class="cursor-dot"></div>
        </div>
    </div>

    <div id="view-lobby" class="view-container active">
        <div class="header-logo">
            <h1 class="logo-text">Requiem</h1>
        </div>

        <div class="main-grid">
            <div class="hologram-card" onclick="changeView('view-farm')">
                <div class="card-inner">
                    <div style="font-size: 100px; margin-bottom: 30px;">🛰️</div>
                    <h2 style="font-family: var(--font-cyber); font-size: 1.8rem;">NEON-FARM</h2>
                    <p style="color: var(--neon-blue); margin-top: 15px; letter-spacing: 4px;">SYSTEM ONLINE</p>
                    <div style="margin-top: 40px;" class="btn-cyber">BOOT INTERFACE</div>
                </div>
            </div>

            <div class="hologram-card" style="opacity: 0.3; filter: grayscale(1);">
                <div class="card-inner">
                    <div style="font-size: 100px; margin-bottom: 30px;">⚔️</div>
                    <h2 style="font-family: var(--font-cyber); font-size: 1.8rem;">VOID ARENA</h2>
                    <p style="margin-top: 15px; letter-spacing: 4px;">ENCRYPTED</p>
                </div>
            </div>
        </div>

        <div class="console-settings">
            <div class="control-unit">
                <span class="label-cyber">Operator Identity</span>
                <input type="text" id="input-nick" class="cyber-input" placeholder="ACCESS_ID...">
            </div>
            <div class="control-unit">
                <span class="label-cyber">Neural Audio</span>
                <button class="btn-cyber" id="btn-music">AUDIO: OFF</button>
            </div>
            <div class="control-unit">
                <span class="label-cyber">Engine Core</span>
                <div style="color: var(--neon-green); font-family: 'JetBrains Mono'; font-size: 14px;">STATUS: STABLE // 2026.5.7</div>
            </div>
        </div>
    </div>

    <div id="view-farm" class="view-container">
        <div class="top-hud">
            <div class="hud-item"><span class="hud-label">CREDITS</span><div class="hud-value" id="val-cash" style="color: var(--neon-green);">$0</div></div>
            <div class="hud-item"><span class="hud-label">NEURO-XP</span><div class="hud-value" id="val-xp" style="color: var(--neon-pink);">0</div></div>
            <div class="hud-item"><span class="hud-label">LEVEL</span><div class="hud-value" id="val-lvl">1</div></div>
            <button class="btn-cyber" onclick="changeView('view-lobby')">DISCONNECT</button>
        </div>

        <div class="farm-interface">
            <div class="sidebar" id="seed-shop">
                <h3 style="font-family: var(--font-cyber); font-size: 14px; margin-bottom: 25px; color: var(--neon-blue);">RESOURCES SHOP</h3>
            </div>

            <div class="farm-grid-main" id="grid-main">
                </div>

            <div class="sidebar" id="skill-tree">
                <h3 style="font-family: var(--font-cyber); font-size: 14px; margin-bottom: 25px; color: var(--neon-purple);">NEURO-LINK SKILLS</h3>
                <div class="skill-node" id="skill-1" title="Szybsza Produkcja">⚡</div>
                <div class="skill-node" id="skill-2" title="Bonusowe Kredyty">💎</div>
                <div class="skill-node" id="skill-3" title="RGB Overdrive">🌈</div>
            </div>
        </div>
    </div>

    <audio id="audio-bg" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* ================================================================
           CYBER-OMEGA: REQUIEM - LOGIC CORE (JS ENGINE)
           ================================================================
        */

        const GlobalState = {
            cash: parseInt(localStorage.getItem('req_cash')) || 500,
            xp: parseInt(localStorage.getItem('req_xp')) || 0,
            lvl: parseInt(localStorage.getItem('req_lvl')) || 1,
            nick: localStorage.getItem('req_nick') || "PILOT_01",
            audio: localStorage.getItem('req_audio') === 'true',
            activeSeed: null,
            skills: JSON.parse(localStorage.getItem('req_skills')) || [false, false, false]
        };

        const ResourceDatabase = [
            { id: 0, name: "Neon Pulse", icon: "💎", cost: 50, time: 5, win: 120, xp: 50 },
            { id: 1, name: "Plasma Core", icon: "🔋", cost: 250, time: 15, win: 700, xp: 200 },
            { id: 2, name: "Void Matter", icon: "🌑", cost: 1200, time: 40, win: 4500, xp: 850 },
            { id: 3, name: "Omega Crystal", icon: "💠", cost: 5000, time: 120, win: 25000, xp: 4000 }
        ];

        let PlotState = Array(9).fill().map(() => ({ seedId: null, timer: 0, ready: false }));

        // --- CANVAS BACKGROUND SYSTEM ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * canvas.width;
                this.o = Math.random();
            }
            update() {
                this.z -= 4;
                if(this.z <= 0) this.reset();
            }
            draw() {
                let sx = (this.x - canvas.width/2) * (canvas.width/this.z) + canvas.width/2;
                let sy = (this.y - canvas.height/2) * (canvas.width/this.z) + canvas.height/2;
                let r = (canvas.width / this.z) * 1.2;
                ctx.fillStyle = `rgba(0, 242, 255, ${1 - this.z/canvas.width})`;
                ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
            }
        }

        function initStars() {
            resize();
            for(let i=0; i<300; i++) particles.push(new Star());
            loop();
        }

        function loop() {
            ctx.fillStyle = '#010103'; ctx.fillRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }

        // --- CORE UI CONTROLLER ---
        function changeView(vid) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
            document.getElementById(vid).classList.add('active');
            syncUI();
        }

        function syncUI() {
            document.getElementById('val-cash').innerText = `$${GlobalState.cash}`;
            document.getElementById('val-xp').innerText = GlobalState.xp;
            document.getElementById('val-lvl').innerText = GlobalState.lvl;
            localStorage.setItem('req_cash', GlobalState.cash);
            localStorage.setItem('req_xp', GlobalState.xp);
            localStorage.setItem('req_lvl', GlobalState.lvl);
        }

        // --- FARMING ENGINE LOGIC ---
        function initFarm() {
            const grid = document.getElementById('grid-main');
            const shop = document.getElementById('seed-shop');

            // Build Grid
            PlotState.forEach((_, i) => {
                const el = document.createElement('div');
                el.className = 'mech-plot';
                el.id = `p-${i}`;
                el.innerHTML = `
                    <div class="gear-system">⚙️</div>
                    <div id="emoji-${i}" style="font-size: 60px; z-index: 5;"></div>
                    <svg class="progress-circle" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" stroke="var(--neon-blue)" stroke-width="2" fill="none" 
                                stroke-dasharray="283" stroke-dashoffset="283" id="circle-${i}"></circle>
                    </svg>
                    <div id="time-${i}" style="position: absolute; bottom: 20px; font-size: 12px; font-family: 'Orbitron';"></div>
                `;
                el.onclick = () => handlePlotClick(i);
                grid.appendChild(el);
            });

            // Build Shop
            ResourceDatabase.forEach(res => {
                const el = document.createElement('div');
                el.className = 'seed-card';
                el.innerHTML = `
                    <div style="font-size: 30px; margin-right: 15px;">${res.icon}</div>
                    <div>
                        <div style="font-weight: 700; color: var(--neon-blue);">${res.name}</div>
                        <div style="font-size: 11px;">COST: $${res.cost} | PROFIT: $${res.win}</div>
                    </div>
                `;
                el.onclick = () => {
                    if(GlobalState.cash >= res.cost) {
                        GlobalState.activeSeed = res;
                        document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('active'));
                        el.classList.add('active');
                    }
                };
                shop.appendChild(el);
            });

            setInterval(tick, 1000);
        }

        function handlePlotClick(i) {
            const p = PlotState[i];
            if(!p.seedId && GlobalState.activeSeed) {
                GlobalState.cash -= GlobalState.activeSeed.cost;
                p.seedId = GlobalState.activeSeed.id;
                p.timer = GlobalState.activeSeed.time;
                GlobalState.activeSeed = null;
                document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('active'));
                
                document.getElementById(`p-${i}`).classList.add('growing');
                document.getElementById(`emoji-${i}`).innerText = "🛰️";
                syncUI();
            } else if(p.ready) {
                const res = ResourceDatabase[p.seedId];
                let multiplier = GlobalState.skills[1] ? 1.5 : 1.0;
                GlobalState.cash += Math.floor(res.win * multiplier);
                GlobalState.xp += res.xp;
                
                // Reset
                p.seedId = null; p.ready = false;
                document.getElementById(`p-${i}`).classList.remove('growing');
                document.getElementById(`emoji-${i}`).innerText = "";
                document.getElementById(`time-${i}`).innerText = "";
                document.getElementById(`circle-${i}`).style.strokeDashoffset = 283;
                
                checkLevel();
                syncUI();
            }
        }

        function tick() {
            PlotState.forEach((p, i) => {
                if(p.seedId !== null && p.timer > 0) {
                    p.timer--;
                    const res = ResourceDatabase[p.seedId];
                    const offset = 283 - (283 * (res.time - p.timer) / res.time);
                    document.getElementById(`circle-${i}`).style.strokeDashoffset = offset;
                    document.getElementById(`time-${i}`).innerText = p.timer + "s";
                    
                    if(p.timer === 0) {
                        p.ready = true;
                        document.getElementById(`emoji-${i}`).innerText = res.icon;
                        document.getElementById(`time-${i}`).innerText = "READY";
                        document.getElementById(`time-${i}`).style.color = "var(--neon-green)";
                    }
                }
            });
        }

        function checkLevel() {
            let next = GlobalState.lvl * 3000;
            if(GlobalState.xp >= next) {
                GlobalState.lvl++;
                triggerGlitch();
            }
        }

        function triggerGlitch() {
            const o = document.getElementById('glitch-overlay');
            o.style.opacity = "1";
            setTimeout(() => o.style.opacity = "0.3", 500);
        }

        // --- MOUSE & CURSOR ENGINE ---
        const cursor = document.getElementById('cursor-wrapper');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            // Background reaction
            const xPct = e.clientX / window.innerWidth;
            const yPct = e.clientY / window.innerHeight;
            document.getElementById('bg-canvas').style.transform = `scale(1.05) translate(${(xPct-0.5)*20}px, ${(yPct-0.5)*20}px)`;
        });

        // --- SETTINGS ---
        const nickInput = document.getElementById('input-nick');
        nickInput.value = GlobalState.nick;
        nickInput.oninput = (e) => {
            GlobalState.nick = e.target.value;
            localStorage.setItem('req_nick', GlobalState.nick);
        };

        const musicBtn = document.getElementById('btn-music');
        musicBtn.onclick = () => {
            GlobalState.audio = !GlobalState.audio;
            localStorage.setItem('req_audio', GlobalState.audio);
            const audio = document.getElementById('audio-bg');
            if(GlobalState.audio) {
                audio.play(); musicBtn.innerText = "AUDIO: ON"; musicBtn.style.borderColor = "var(--neon-green)";
            } else {
                audio.pause(); musicBtn.innerText = "AUDIO: OFF"; musicBtn.style.borderColor = "var(--neon-pink)";
            }
        };

        // --- INITIALIZATION ---
        initStars();
        initFarm();
        syncUI();
        if(GlobalState.audio) {
            document.getElementById('audio-bg').play().catch(() => {
                GlobalState.audio = false;
                musicBtn.innerText = "AUDIO: OFF";
            });
        }

    </script>
</body>
</html>
