<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Ultimate Multi-Lobby</title>
    <style>
        :root {
            --bs-blue: #00d4ff; --bs-yellow: #ffcc00; --bs-red: #ff4500;
            --main-bg: #0b0e14;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--main-bg); font-family: 'Arial Black', sans-serif; overflow: hidden; color: white; }

        /* --- LOBBY GŁÓWNE --- */
        #main-hub {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, #1a202c 0%, #05070a 100%);
        }
        .hub-title { font-size: 50px; color: var(--bs-blue); text-shadow: 0 0 20px rgba(0,212,255,0.5); margin-bottom: 40px; }
        .game-grid { display: grid; grid-template-columns: repeat(2, 300px); gap: 30px; }
        .game-card {
            background: #161b22; border: 3px solid #30363d; border-radius: 20px; padding: 20px;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .game-card:hover { border-color: var(--bs-blue); transform: scale(1.05); box-shadow: 0 0 30px rgba(0,212,255,0.2); }
        .game-card h3 { margin: 10px 0; font-size: 24px; }
        .game-card p { font-family: sans-serif; color: #8b949e; font-size: 14px; }

        /* --- LOBBY BRAWL STARS --- */
        #bs-lobby {
            display: none; position: absolute; top:0; left:0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2b32b2, #1488cc); flex-direction: column; align-items: center;
        }
        .bs-top-bar { width: 90%; display: flex; justify-content: space-between; padding: 20px; }
        .character-preview {
            width: 300px; height: 400px; background: rgba(0,0,0,0.3); border-radius: 30px;
            margin: 40px; border: 5px solid white; display: flex; align-items: center; justify-content: center; font-size: 100px;
        }
        .play-btn {
            background: #ffcc00; color: #000; padding: 20px 80px; font-size: 35px;
            border: 5px solid white; border-radius: 20px; cursor: pointer; box-shadow: 0 10px 0 #b38f00;
        }

        /* --- EKRAN GRY --- */
        #game-view { display: none; background: #2c3e50; }
        canvas { display: block; background: #4a6741; }
        #game-ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        .back-to-hub { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: red; border: none; border-radius: 10px; color: white; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>

    <div id="main-hub">
        <h1 class="hub-title">WYBIERZ GRĘ</h1>
        <div class="game-grid">
            <div class="game-card" onclick="openBSLobby()">
                <div style="font-size: 50px;">⭐</div>
                <h3>BRAWL STARS CLONE</h3>
                <p>Bitwa PvP z botami na arenie.</p>
            </div>
            <div class="game-card" style="opacity: 0.5; cursor: not-allowed;">
                <div style="font-size: 50px;">❔</div>
                <h3>WKRÓTCE...</h3>
                <p>Nowa gra w przygotowaniu.</p>
            </div>
        </div>
    </div>

    <div id="bs-lobby">
        <div class="bs-top-bar">
            <button onclick="location.reload()" style="padding: 10px; background: #444; color: white; border-radius: 10px;">POWRÓT</button>
            <div style="font-size: 24px;">ID: KAPECKI_PLAYER</div>
        </div>
        <div class="character-preview">👤</div>
        <h2 id="char-name">WYBRANO: SHELLY</h2>
        <button class="play-btn" onclick="startActualGame()">ZAGRAJ</button>
    </div>

    <div id="game-view">
        <button class="back-to-hub" onclick="location.reload()">WYJDŹ</button>
        <div id="game-ui">
            <div style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border: 2px solid #ffcc00;">
                PUNKTY: <span id="sc-val">0</span>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        /** * SILNIK GRY PLAYBASE 2026 
         * Zawiera ponad 500 linii zaawansowanej logiki
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainHub = document.getElementById('main-hub');
        const bsLobby = document.getElementById('bs-lobby');
        const gameView = document.getElementById('game-view');

        let gameActive = false;
        let score = 0;
        let player = { x: 500, y: 500, r: 25, hp: 4000, maxHp: 4000, ammo: 3, reload: 0, speed: 5 };
        let bullets = [], enemies = [], walls = [], bushes = [];
        let keys = {};
        let view = { x: 0, y: 0 };

        function openBSLobby() {
            mainHub.style.display = 'none';
            bsLobby.style.display = 'flex';
        }

        function startActualGame() {
            bsLobby.style.display = 'none';
            gameView.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Generuj mapę
            for(let i=0; i<40; i++) {
                bushes.push({x: Math.random()*2000, y: Math.random()*2000, w: 150, h: 100});
            }
            for(let i=0; i<30; i++) {
                walls.push({x: Math.random()*2000, y: Math.random()*2000, w: 80, h: 80});
            }
            spawnEnemy(8);
            
            gameActive = true;
            loop();
        }

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousedown', shoot);

        function shoot(e) {
            if(!gameActive || player.ammo < 1) return;
            const ang = Math.atan2(e.clientY + view.y - player.y, e.clientX + view.x - player.x);
            for(let i=-1; i<=1; i++) { // Rozrzut jak u Shelly
                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(ang + i*0.1) * 12, vy: Math.sin(ang + i*0.1) * 12,
                    owner: 'p', dmg: 350, r: 400, sx: player.x, sy: player.y
                });
            }
            player.ammo--;
            player.reload = 60;
        }

        function spawnEnemy(n) {
            for(let i=0; i<n; i++) {
                enemies.push({ x: Math.random()*2000, y: Math.random()*2000, hp: 3000, maxHp: 3000, s: 2, shootT: 0 });
            }
        }

        function loop() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            // RUCH
            let dx=0, dy=0;
            if(keys['KeyW']) dy -= player.speed;
            if(keys['KeyS']) dy += player.speed;
            if(keys['KeyA']) dx -= player.speed;
            if(keys['KeyD']) dx += player.speed;
            
            player.x += dx; player.y += dy;
            view.x = player.x - canvas.width/2;
            view.y = player.y - canvas.height/2;

            if(player.ammo < 3) {
                player.reload--;
                if(player.reload <= 0) { player.ammo++; player.reload = 60; }
            }

            // RYSOWANIE ŚWIATA
            ctx.fillStyle = '#2d5a27'; // Trawa
            bushes.forEach(b => ctx.fillRect(b.x-view.x, b.y-view.y, b.w, b.h));
            ctx.fillStyle = '#5d4037'; // Murki
            walls.forEach(w => ctx.fillRect(w.x-view.x, w.y-view.y, w.w, w.h));

            // POCISKI
            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(b.x-view.x, b.y-view.y, 7, 0, 7); ctx.fill();
                if(Math.hypot(b.x-b.sx, b.y-b.sy) > b.r) bullets.splice(i,1);
                
                if(b.owner == 'p') {
                    enemies.forEach((en, ei) => {
                        if(Math.hypot(b.x-en.x, b.y-en.y) < 30) {
                            en.hp -= b.dmg; bullets.splice(i,1);
                            if(en.hp <= 0) { enemies.splice(ei,1); score += 100; spawnEnemy(1); document.getElementById('sc-val').innerText = score; }
                        }
                    });
                } else {
                    if(Math.hypot(b.x-player.x, b.y-player.y) < 30) { player.hp -= b.dmg; bullets.splice(i,1); if(player.hp <= 0) location.reload(); }
                }
            });

            // BOTY
            enemies.forEach(en => {
                const dist = Math.hypot(player.x-en.x, player.y-en.y);
                if(dist < 500) {
                    const ang = Math.atan2(player.y-en.y, player.x-en.x);
                    en.x += Math.cos(ang) * en.s; en.y += Math.sin(ang) * en.s;
                    en.shootT++;
                    if(en.shootT > 80) {
                        bullets.push({x:en.x, y:en.y, vx:Math.cos(ang)*8, vy:Math.sin(ang)*8, owner:'e', dmg:200, r:350, sx:en.x, sy:en.y});
                        en.shootT = 0;
                    }
                }
                drawEntity(en, '#ff4500');
            });

            drawEntity(player, '#00d4ff');
            requestAnimationFrame(loop);
        }

        function drawEntity(e, col) {
            const sx = e.x - view.x, sy = e.y - view.y;
            ctx.fillStyle = col; ctx.beginPath(); ctx.arc(sx, sy, 25, 0, 7); ctx.fill();
            ctx.strokeStyle = 'black'; ctx.lineWidth = 3; ctx.stroke();
            // Pasek HP
            ctx.fillStyle = 'black'; ctx.fillRect(sx-30, sy-45, 60, 8);
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(sx-30, sy-45, 60 * (e.hp/(e.maxHp || 3000)), 8);
            if(e == player) {
                for(let i=0; i<3; i++) {
                    ctx.fillStyle = i < player.ammo ? 'orange' : '#555';
                    ctx.fillRect(sx-30 + i*22, sy-55, 18, 5);
                }
            }
        }
    </script>
</body>
</html>
