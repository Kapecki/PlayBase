<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBase | PvP Arena</title>
    <style>
        body { background-color: #05080a; color: #e6edf3; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        
        /* Ekran Lobby */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070');
            background-size: cover;
        }

        .lobby-card {
            background: rgba(22, 27, 34, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #00d4ff;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
        }

        h1 { font-size: 3.5rem; color: #00d4ff; margin-bottom: 10px; }
        .description { color: #8b949e; margin-bottom: 30px; max-width: 400px; }

        .btn-pvp {
            background: #00d4ff;
            color: #000;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-pvp:hover { transform: scale(1.1); background: #fff; box-shadow: 0 0 30px #00d4ff; }

        /* Ekran Gry */
        #game-screen { display: none; text-align: center; background: #000; height: 100vh; }
        canvas { background: #111; border-bottom: 4px solid #00d4ff; cursor: crosshair; }
        .game-stats { padding: 10px; font-size: 1.2rem; color: #00d4ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="lobby-screen">
        <div class="lobby-card">
            <h1>PLAYBASE LOBBY</h1>
            <p class="description">Witaj w bazie. Jesteś gotowy na starcie PvP z botami? Wykorzystaj WASD i myszkę, aby przetrwać jak najdłużej.</p>
            <button class="btn-pvp" onclick="startGame()">ZAGRAJ PVP</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="game-stats" id="stat-bar">KILLE: 0 | ZDROWIE: 100%</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const lobby = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player, bullets, enemies, keys, gameActive;

        function startGame() {
            // Przełączanie ekranów
            lobby.style.display = 'none';
            gameScreen.style.display = 'block';
            
            // Ustawienia płótna
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50;

            // Inicjalizacja gry
            player = { x: canvas.width/2, y: canvas.height/2, size: 20, health: 100, kills: 0 };
            bullets = [];
            enemies = [];
            keys = {};
            gameActive = true;

            gameLoop();
        }

        function returnToLobby() {
            gameActive = false;
            alert("ZOSTAŁEŚ ZABITY! Powrót do lobby. Wynik: " + player.kills + " killi.");
            gameScreen.style.display = 'none';
            lobby.style.display = 'flex';
        }

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousedown', e => {
            if(!gameActive) return;
            const angle = Math.atan2(e.clientY - 50 - player.y, e.clientX - player.x);
            bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8 });
        });

        function gameLoop() {
            if(!gameActive) return;

            // Ruch
            if(keys['KeyW'] && player.y > 20) player.y -= 5;
            if(keys['KeyS'] && player.y < canvas.height - 20) player.y += 5;
            if(keys['KeyA'] && player.x > 20) player.x -= 5;
            if(keys['KeyD'] && player.x < canvas.width - 20) player.x += 5;

            // Spawnowanie botów
            if(Math.random() < 0.02) {
                enemies.push({ 
                    x: Math.random() > 0.5 ? 0 : canvas.width, 
                    y: Math.random() * canvas.height, 
                    size: 20 
                });
            }

            // Logika pocisków i wrogów
            bullets.forEach((b, bi) => {
                b.x += b.vx; b.y += b.vy;
                if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(bi, 1);
            });

            enemies.forEach((en, ei) => {
                const angle = Math.atan2(player.y - en.y, player.x - en.x);
                en.x += Math.cos(angle) * 2;
                en.y += Math.sin(angle) * 2;

                // Kolizja z graczem
                if(Math.hypot(player.x - en.x, player.y - en.y) < 30) {
                    player.health -= 1;
                    if(player.health <= 0) returnToLobby();
                }

                // Trafienie bota
                bullets.forEach((b, bi) => {
                    if(Math.hypot(b.x - en.x, b.y - en.y) < 25) {
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        player.kills++;
                    }
                });
            });

            // Rysowanie
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00d4ff'; // Gracz
            ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#ff4500'; // Boty
            enemies.forEach(en => { ctx.beginPath(); ctx.arc(en.x, en.y, en.size, 0, Math.PI*2); ctx.fill(); });

            ctx.fillStyle = '#fff'; // Strzały
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

            document.getElementById('stat-bar').innerHTML = `KILLE: ${player.kills} | ZDROWIE: ${Math.ceil(player.health)}%`;

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
