<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore Ultra RGB | Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --dark-bg: #020205;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- TŁO I CZĄSTECZKI --- */
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a0a25 0%, #000 100%);
        }

        .overlay-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0, 242, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- INTERFEJS --- */
        .hub-container {
            width: 90%;
            max-width: 1200px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 20px;
            margin-bottom: 60px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-purple), var(--neon-blue));
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 5s linear infinite;
            filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.5));
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* --- GRID GIER --- */
        .games-wrapper {
            display: flex;
            gap: 50px;
            margin-bottom: 80px;
        }

        .card {
            width: 320px;
            height: 450px;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            text-decoration: none;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Efekt dla aktywnej gry */
        .card.active-game:hover {
            transform: scale(1.15) translateY(-10px);
            border-color: var(--neon-blue);
            box-shadow: 0 0 60px rgba(0, 242, 255, 0.3);
        }

        .card.active-game::after {
            content: "PLAY NOW";
            position: absolute;
            bottom: -40px;
            font-family: 'Orbitron';
            font-size: 14px;
            color: var(--neon-blue);
            letter-spacing: 5px;
            opacity: 0;
            transition: 0.3s;
        }

        .card.active-game:hover::after {
            opacity: 1;
            bottom: 30px;
        }

        .card.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .card .icon {
            font-size: 100px;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .card.active-game:hover .icon {
            transform: scale(1.2) rotate(5deg);
            filter: drop-shadow(0 0 20px var(--neon-blue));
        }

        .card h2 {
            font-family: 'Orbitron';
            letter-spacing: 3px;
            font-size: 1.5rem;
        }

        /* --- PANEL USTAWIEŃ --- */
        .settings-bar {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px 50px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 40px;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 10px;
            font-weight: 700;
            color: var(--neon-pink);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #nickField {
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            color: white;
            font-family: 'Orbitron';
            font-size: 16px;
            padding: 5px;
            transition: 0.3s;
            width: 150px;
        }

        #nickField:focus {
            border-color: var(--neon-blue);
            width: 200px;
        }

        .control-btn {
            background: #111;
            border: 1px solid #444;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 12px;
            transition: 0.3s;
        }

        .control-btn.active {
            background: var(--neon-blue);
            color: black;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100px;
            height: 4px;
            background: #333;
            border-radius: 5px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 15px; width: 15px;
            border-radius: 50%;
            background: var(--neon-pink);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* --- FOOTER --- */
        .version {
            position: fixed;
            bottom: 20px;
            right: 30px;
            font-size: 12px;
            color: #444;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div class="overlay-glow" id="glow"></div>

    <div class="hub-container">
        <h1 class="main-header">CyberBase</h1>

        <div class="games-wrapper">
            <a href="farma.html" class="card active-game">
                <div class="icon">🌾</div>
                <h2>NEON FARM</h2>
                <p style="font-size: 10px; opacity: 0.5; margin-top: 10px;">VERSION 5.2 STABLE</p>
            </a>

            <div class="card locked">
                <div class="icon">🏎️</div>
                <h2>COMING SOON</h2>
                <p style="font-size: 10px; margin-top: 10px;">LOCKED BY SYSTEM</p>
            </div>
        </div>

        <div class="settings-bar">
            <div class="setting-group">
                <label>Operator Name</label>
                <input type="text" id="nickField" placeholder="ENTER NICK...">
            </div>

            <div class="setting-group">
                <label>Audio Engine</label>
                <button class="control-btn" id="musicBtn">MUSIC: OFF</button>
            </div>

            <div class="setting-group">
                <label>Master Volume</label>
                <input type="range" id="volRange" min="0" max="100" value="50">
            </div>
        </div>
    </div>

    <div class="version">ULTRA RGB ENGINE v5.2 // BY GEMINI</div>

    <script>
        // --- CZĄSTECZKI W TLE ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = Math.random() > 0.5 ? '#00f2ff' : '#ff007a';
                this.opacity = Math.random();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resize();
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        // --- MOUSE GLOW ---
        window.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('glow');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.setProperty('--x', x + '%');
            glow.style.setProperty('--y', y + '%');
        });

        // --- SYSTEM USTAWIEŃ ---
        const nickField = document.getElementById('nickField');
        const musicBtn = document.getElementById('musicBtn');
        const volRange = document.getElementById('volRange');

        // Wczytaj dane
        nickField.value = localStorage.getItem('cyber_nick') || "PILOT_01";
        let musicOn = localStorage.getItem('cyber_music') === 'true';
        let volume = localStorage.getItem('cyber_vol') || 50;
        volRange.value = volume;

        function updateMusicUI() {
            if (musicOn) {
                musicBtn.classList.add('active');
                musicBtn.innerText = "MUSIC: ON";
            } else {
                musicBtn.classList.remove('active');
                musicBtn.innerText = "MUSIC: OFF";
            }
        }

        nickField.oninput = () => localStorage.setItem('cyber_nick', nickField.value);
        volRange.oninput = () => localStorage.setItem('cyber_vol', volRange.value);
        
        musicBtn.onclick = () => {
            musicOn = !musicOn;
            localStorage.setItem('cyber_music', musicOn);
            updateMusicUI();
        };

        window.addEventListener('resize', resize);
        updateMusicUI();
        init();

    </script>
</body>
</html>
