<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Core // 3D Infrastructure Dashboard</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-magenta: #ff0077;
            --neon-green: #00ff66;
            --cyber-bg: #04040a;
            --panel-bg: rgba(6, 6, 16, 0.85);
        }

        body {
            background-color: var(--cyber-bg);
            color: #ffffff;
            font-family: 'Consolas', monospace;
            margin: 0; padding: 0; overflow: hidden;
            width: 100vw; height: 100vh;
        }

        #canvas-3d {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        #app-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: grid; grid-template-columns: 360px 1fr 360px;
            padding: 20px; box-sizing: border-box; gap: 20px;
        }

        .ui-panel {
            background: var(--panel-bg); border: 1px solid #1a1a2e; border-radius: 8px;
            padding: 16px; display: flex; flex-direction: column; pointer-events: auto;
            backdrop-filter: blur(14px); box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        .panel-header {
            font-size: 11px; font-weight: bold; color: var(--neon-blue); letter-spacing: 2px;
            text-transform: uppercase; border-bottom: 1px solid #1a1a2e;
            padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between;
        }

        /* PRZEŁĄCZNIKI MONITORINGU */
        .mode-selector { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .btn-mode {
            background: #090914; color: #888; border: 1px solid #1c1c30;
            padding: 10px; border-radius: 4px; cursor: pointer; text-align: left;
            font-family: inherit; font-size: 11px; text-transform: uppercase; transition: all 0.2s;
        }
        .btn-mode.active {
            color: #fff; border-color: var(--neon-blue); background: rgba(0,240,255,0.05);
            box-shadow: 0 0 10px rgba(0,240,255,0.2);
        }

        /* METRYKI SYSTEMOWE */
        .metric-box {
            background: rgba(0,0,0,0.4); border: 1px solid #111; border-radius: 4px;
            padding: 12px; margin-bottom: 10px;
        }
        .metric-value { font-size: 22px; font-weight: bold; color: var(--neon-green); margin-top: 4px; }

        /* KONTROLA SUWAKAMI */
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 4px;}
        .cyber-slider {
            width: 100%; -webkit-appearance: none; background: #111; height: 4px; outline: none;
            border-radius: 2px;
        }
        .cyber-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px; background: var(--neon-blue);
            cursor: pointer; border-radius: 50%;
        }

        /* LOGI TERMINALA */
        #terminal-stream {
            background: #010103; border: 1px solid #111; border-radius: 4px;
            padding: 8px; font-size: 10px; color: #66ff66; height: 180px;
            overflow-y: auto; flex: 1; line-height: 1.4;
        }

        .btn-action {
            background: #00f0ff; color: #000; font-family: inherit; font-weight: bold;
            border: none; padding: 12px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; font-size: 11px; letter-spacing: 1px; transition: all 0.2s;
        }
        .btn-action:hover { background: #fff; box-shadow: 0 0 15px #00f0ff; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="canvas-3d"></canvas>

    <div id="app-container">
        
        <div class="ui-panel">
            <div class="panel-header"><div>[01] TRYB MONITOROWANIA REJESTRU</div></div>
            <div class="mode-selector">
                <button class="btn-mode active" id="m-1" onclick="setAppMode(1)">1. Global Network Traffic</button>
                <button class="btn-mode" id="m-2" onclick="setAppMode(2)">2. Cyber Security Matrix</button>
                <button class="btn-mode" id="m-3" onclick="setAppMode(3)">3. Quantum Core Database</button>
            </div>

            <div class="panel-header"><div>[02] WYDAJNOŚĆ INFRASTRUKTURY</div></div>
            <div class="metric-box">
                <div style="font-size:10px; color:#777;">PRZEPUSTOWOŚĆ DUPLIKATÓW</div>
                <div class="metric-value" id="val-speed">450 Mb/s</div>
            </div>
            <div class="metric-box">
                <div style="font-size:10px; color:#777;">AKTYWNE MIKROSERWERY (3D)</div>
                <div class="metric-value" style="color:var(--neon-blue);">64 NODES</div>
            </div>
            <div class="metric-box">
                <div style="font-size:10px; color:#777;">WSPÓŁCZYNNIK INTEGRALNOŚCI</div>
                <div class="metric-value" id="val-integrity" style="color:var(--neon-magenta);">99.982%</div>
            </div>
        </div>

        <div></div>

        <div class="ui-panel">
            <div class="panel-header"><div>[03] PARAMETRYZACJA STRUMIENIA</div></div>
            
            <div class="slider-group">
                <label><span>Prędkość Symulacji 3D</span><span id="lbl-slide-1">1.0x</span></label>
                <input type="range" class="cyber-slider" id="sld-speed" min="0.2" max="3.0" step="0.1" value="1.0" oninput="adjustSimSpeed()">
            </div>
            <div class="slider-group">
                <label><span>Gęstość Pakietów (Danych)</span><span id="lbl-slide-2">Normal</span></label>
                <input type="range" class="cyber-slider" id="sld-density" min="1" max="3" step="1" value="2">
            </div>

            <button class="btn-action" style="margin-bottom:15px;" onclick="triggerPingBurst()">Inicjuj Ping Test (Wstrzyknięcie)</button>

            <div class="panel-header"><div>[04] STRUMIEŃ SYGNAŁÓW SYSTÉMOWYCH</div></div>
            <div id="terminal-stream"></div>
        </div>

    </div>

<script>
    /* ==========================================================================
       KONFIGURACJA APLIKACJI I STRUMIENI DANYCH
       ========================================================================== */
    let currentMode = 1;
    let simSpeed = 1.0;
    
    const modeMeta = {
        1: { name: "Global Traffic", color: 0x00f0ff, baseMetric: "Mb/s" },
        2: { name: "Security Matrix", color: 0xff0077, baseMetric: "Threats/s" },
        3: { name: "Quantum Core", color: 0x00ff66, baseMetric: "Qubits/s" }
    };

    function appendLog(text) {
        const term = document.getElementById('terminal-stream');
        const time = new Date().toLocaleTimeString();
        term.innerHTML += `<div>[${time}] ${text}</div>`;
        term.scrollTop = term.scrollHeight;
    }

    /* ==========================================================================
       SILNIK WIZUALIZACJI TRÓJWYMIAROWEJ THREE.JS
       ========================================================================== */
    let scene, camera, renderer, serverGroup, packetParticles = [];

    function init3DApp() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030308);
        scene.fog = new THREE.FogExp2(0x030308, 0.03);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 18);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Światła budujące głębię przestrzeni cyfrowej
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);
        
        const mainLight = new THREE.PointLight(0x00f0ff, 2, 50);
        mainLight.position.set(0, 0, 0);
        scene.add(mainLight);

        // Tworzenie "cyber-rdzenia serwerów" w siatce 4x4x4 (64 nody)
        serverGroup = new THREE.Group();
        const nodeGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        
        for(let x = -1.5; x <= 1.5; x += 1) {
            for(let y = -1.5; y <= 1.5; y += 1) {
                for(let z = -1.5; z <= 1.5; z += 1) {
                    const nodeMat = new THREE.MeshBasicMaterial({ 
                        color: 0x00f0ff, 
                        wireframe: true,
                        transparent: true,
                        opacity: 0.7 
                    });
                    const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
                    nodeMesh.position.set(x * 1.8, y * 1.8, z * 1.8);
                    
                    // Każdy serwer przechowuje losowe przesunięcie fazy pulsu
                    nodeMesh.userData = { phase: Math.random() * Math.PI * 2 };
                    serverGroup.add(nodeMesh);
                }
            }
        }
        scene.add(serverGroup);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        appendLog("Inicjalizacja silnika WebGL 3D zakończona powodzeniem.");
        appendLog("Mapowanie 64 węzłów mikroserwera w sieci...");
        
        animateApp();
    }

    /* GENEROWANIE WIĄZKI PAKIETÓW DANYCH 3D (NEONOWE CZĄSTECZKI) */
    function spawnDataPacket(isBurst = false) {
        const meta = modeMeta[currentMode];
        const pGeo = new THREE.SphereGeometry(0.08, 4, 4);
        const pMat = new THREE.MeshBasicMaterial({ color: meta.color });
        const mesh = new THREE.Mesh(pGeo, pMat);

        // Pakiety zaczynają z zewnątrz i lecą do środka (do rdzenia serwerów)
        const angle = Math.random() * Math.PI * 2;
        const radius = 15;
        mesh.position.set(
            Math.cos(angle) * radius,
            (Math.random() - 0.5) * 10,
            Math.sin(angle) * radius
        );

        // Obliczanie kierunku wektora lotu do centrum (0,0,0)
        const speedFactor = isBurst ? 0.3 : 0.08 * simSpeed;
        mesh.userData = {
            target: new THREE.Vector3(0, 0, 0),
            speed: speedFactor
        };

        scene.add(mesh);
        packetParticles.push(mesh);
    }

    /* WYWOŁANIE NAGŁEGO TESTU PING (POTĘŻNY WYSTRZAŁ SYGNAŁÓW) */
    window.triggerPingBurst = function() {
        appendLog(">> WYKRYTO ŻĄDANIE UŻYTKOWNIKA: INICJACJA PING TEST BURST...");
        for(let i=0; i<60; i++) {
            spawnDataPacket(true);
        }
    };

    window.setAppMode = function(modeId) {
        currentMode = modeId;
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        document.getElementById(`m-${modeId}`).classList.add('active');

        const meta = modeMeta[modeId];
        appendLog(`ZMIANA KONTEKSTU SYSTEMU: Aktywowano tryb -> ${meta.name}`);

        // Aktualizacja kolorów całej architektury 3D pod nowy tryb aplikacji
        serverGroup.children.forEach(node => {
            node.material.color.setHex(meta.color);
        });
    };

    window.adjustSimSpeed = function() {
        simSpeed = parseFloat(document.getElementById('sld-speed').value);
        document.getElementById('lbl-slide-1').innerText = `${simSpeed.toFixed(1)}x`;
    };

    /* GŁÓWNA PĘTLA RENDEROWANIA I ANALIZY MATEMATYCZNEJ */
    function animateApp() {
        requestAnimationFrame(animateApp);

        // Powolna rotacja całej chmury serwerów dla efektu głębi
        serverGroup.rotation.y += 0.003 * simSpeed;
        serverGroup.rotation.x = Math.sin(Date.now() * 0.0005) * 0.1;

        // Dynamiczna animacja pulsowania pojedynczych serwerów
        serverGroup.children.forEach(node => {
            node.userData.phase += 0.04 * simSpeed;
            const scale = 1.0 + Math.sin(node.userData.phase) * 0.18;
            node.scale.set(scale, scale, scale);
        });

        // Przetwarzanie ruchu pakietów danych
        for(let i = packetParticles.length - 1; i >= 0; i--) {
            const p = packetParticles[i];
            // Ruch w kierunku środka aplikacji
            p.position.lerp(p.userData.target, p.userData.speed);

            // Jeśli pakiet doleciał blisko centrum – zostaje przetworzony i usunięty
            if(p.position.length() < 0.5) {
                scene.remove(p);
                packetParticles.splice(i, 1);
                
                if(Math.random() < 0.05) {
                    appendLog(`Pakiet wejściowy przetworzony przez Node_${Math.floor(Math.random()*64)}`);
                }
            }
        }

        renderer.render(scene, camera);
    }

    // Generator pakietów oparty na suwaku gęstości danych
    setInterval(() => {
        const density = parseInt(document.getElementById('sld-density').value);
        for(let i=0; i<density; i++) {
            if(Math.random() < 0.6) spawnDataPacket();
        }
    }, 150);

    // Dynamiczna symulacja i losowanie wartości na panelu metryk (Dashboardu)
    setInterval(() => {
        const density = parseInt(document.getElementById('sld-density').value);
        const meta = modeMeta[currentMode];
        
        let baseValue = (currentMode === 1 ? 300 : currentMode === 2 ? 5 : 1200) * simSpeed * density;
        baseValue += (Math.random() - 0.5) * (baseValue * 0.1);

        document.getElementById('val-speed').innerText = `${Math.floor(baseValue)} ${meta.baseMetric}`;
        
        let integrity = 99.9 + (Math.random() * 0.09);
        document.getElementById('val-integrity').innerText = `${integrity.toFixed(3)}%`;
        
        document.getElementById('lbl-slide-2').innerText = density === 1 ? "Low" : density === 2 ? "Normal" : "Maximum";
    }, 800);


    window.onload = () => {
        init3DApp();
    };

</script>
</body>
</html>
