<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAPECKI MULTIVERSUM</title>
    <style>
        :root {
            --primary: #ff0000;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #050505; color: white;
            font-family: 'Orbitron', sans-serif; /* Futurystyczna czcionka */
            display: flex; overflow: hidden;
        }

        /* ANIMOWANE TŁO RGB MESH */
        .bg-animate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #200000 0%, #000 100%);
            z-index: -1;
        }

        /* GŁÓWNY PULPIT */
        .dashboard {
            display: grid;
            grid-template-columns: 80px 300px 1fr 300px;
            width: 100%; height: 100vh;
            padding: 10px; gap: 10px; box-sizing: border-box;
        }

        .panel {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex; flex-direction: column;
            transition: 0.3s;
        }

        .panel:hover { border-color: var(--primary); box-shadow: 0 0 20px rgba(255,0,0,0.2); }

        /* LOGO K - PULSUJĄCE */
        .logo-k {
            width: 60px; height: 60px; background: var(--primary);
            margin: 10px auto; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: bold; cursor: pointer;
            animation: pulse 2s infinite; text-decoration: none; color: white;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px red; }
            50% { transform: scale(1.1); box-shadow: 0 0 30px red; }
            100% { transform: scale(1); box-shadow: 0 0 10px red; }
        }

        /* CZAT MODUŁOWY */
        #chat-flow {
            flex-grow: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }

        .msg {
            background: rgba(255,255,255,0.03);
            padding: 12px; border-radius: 12px;
            border-left: 4px solid var(--primary);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } }

        /* INPUT W STYLU CYBERPUNK */
        .input-wrapper { padding: 20px; }
        #user-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            padding: 15px; border-radius: 10px; color: #ff0000;
            outline: none; font-weight: bold; text-transform: uppercase;
        }

        /* WIDGETY */
        .widget { padding: 20px; border-bottom: 1px solid var(--border); }
        .stat { font-size: 24px; color: var(--primary); font-weight: bold; }
        
    </style>
</head>
<body>

    <div class="bg-animate" id="bg"></div>

    <div class="dashboard">
        <div class="panel">
            <a href="https://www.youtube.com/@Kapecki" target="_blank" class="logo-k">K</a>
        </div>

        <div class="panel">
            <div class="widget">
                <div style="font-size: 12px; opacity: 0.5;">STATUS SYSTEMU</div>
                <div class="stat">ONLINE</div>
            </div>
            <div style="padding: 20px;">
                <p># MULTIVERSUM</p>
                <p># RGB-CORE</p>
                <p># YT-LIVE</p>
            </div>
        </div>

        <div class="panel">
            <div id="chat-flow">
                <div class="msg"><b>SYSTEM:</b> Witaj w Multiversum Kapeckiego. Wpisz polecenie...</div>
            </div>
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="WPISZ WIADOMOŚĆ LUB 'RGB'...">
            </div>
        </div>

        <div class="panel">
            <div class="widget">
                <div style="font-size: 12px; opacity: 0.5;">CZAS SESJI</div>
                <div id="clock" class="stat">00:00:00</div>
            </div>
            <div class="widget">
                <div style="font-size: 12px; opacity: 0.5;">MOC RGB</div>
                <div class="stat">100%</div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const chat = document.getElementById('chat-flow');
        const bg = document.getElementById('bg');

        // Zegar
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value !== "") {
                const val = input.value.toUpperCase();
                
                // Dodaj wiadomość
                const m = document.createElement('div');
                m.className = 'msg';
                m.innerHTML = `<b>TY:</b> ${input.value}`;
                chat.appendChild(m);
                chat.scrollTop = chat.scrollHeight;

                // Specjalna komenda RGB
                if (val === 'RGB') {
                    bg.style.background = "linear-gradient(45deg, red, blue, green, yellow)";
                    bg.style.backgroundSize = "400% 400%";
                    bg.style.animation = "rainbow 2s infinite linear";
                    
                    const botMsg = document.createElement('div');
                    botMsg.className = 'msg';
                    botMsg.style.borderColor = 'lime';
                    botMsg.innerHTML = `<b>SYSTEM:</b> TRYB RGB AKTYWOWANY! 🌈`;
                    chat.appendChild(botMsg);
                }

                input.value = "";
            }
        });
    </script>

    <style>
        @keyframes rainbow {
            0% {background-position: 0% 50%}
            50% {background-position: 100% 50%}
            100% {background-position: 0% 50%}
        }
    </style>

</body>
</html>
