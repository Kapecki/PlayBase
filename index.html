<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KAPECKI AI - MYŚLĄCY CZAT</title>
    <style>
        :root { --red: #ff0000; --dark: #0d0d0d; }
        body { background: var(--dark); color: white; font-family: 'Arial', sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* SIDEBAR */
        .sidebar { width: 250px; background: #000; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        .logo { color: var(--red); font-size: 22px; font-weight: bold; margin-bottom: 30px; text-shadow: 0 0 10px red; }
        .stat-box { background: #111; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; border: 1px solid #333; }

        /* CHAT */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 15px; }
        .user { align-self: flex-end; background: #333; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: #1a1a1a; border-left: 4px solid var(--red); border-bottom-left-radius: 2px; }

        /* INPUT */
        .input-zone { padding: 20px; background: #050505; border-top: 1px solid #222; }
        input { width: 100%; background: #111; border: 1px solid #444; padding: 15px; border-radius: 10px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--red); box-shadow: 0 0 15px rgba(255,0,0,0.3); }

        /* MODAL PREMIUM */
        #premium-modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .p-card { background: #111; padding: 40px; border: 2px solid red; border-radius: 20px; text-align: center; box-shadow: 0 0 50px red; }
        .btn { background: red; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">KAPECKI BRAIN AI</div>
        <div class="stat-box">Wiadomości: <span id="count-ui">0</span> / 10</div>
        <button class="btn" style="background: #222; font-size: 12px;" onclick="document.getElementById('premium-modal').style.display='flex'">💎 KUP PREMIUM</button>
    </div>

    <div class="chat-area">
        <div id="messages">
            <div class="msg ai">Siema! Jestem Kapecki AI. Mam własne myślenie i 10 darmowych prób. Co tam u Ciebie?</div>
        </div>
        <div class="input-zone">
            <input type="text" id="user-in" placeholder="Napisz do mnie (np. 'hej' lub 'podaj kraje')...">
        </div>
    </div>

    <div id="premium-modal">
        <div class="p-card">
            <h1 style="color:red">LIMIT OSIĄGNIĘTY!</h1>
            <p>Poczekaj 10 minut lub kup wersję bez limitu.</p>
            <button class="btn">ODBLOKUJ PREMIUM - 19.99 PLN</button>
            <p style="margin-top:20px; font-size: 12px; cursor:pointer" onclick="location.reload()">Odśwież (Resetuj)</p>
        </div>
    </div>

    <script>
        let msgCount = 0;
        const input = document.getElementById('user-in');
        const box = document.getElementById('messages');

        function addMsg(txt, type) {
            const d = document.createElement('div');
            d.className = `msg ${type}`;
            d.innerText = txt;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        // --- LOGIKA "MÓZGU" AI ---
        function getAiResponse(userText) {
            const text = userText.toLowerCase();

            if (text.includes("hej") || text.includes("siema") || text.includes("cześć")) {
                return "No siema! Co tam słychać w świecie RGB? Ja właśnie analizuję kod Twojego kanału!";
            }
            
            if (text.includes("kraj") || text.includes("państw")) {
                return "Oto 10 krajów, które wybrałem dla Ciebie (moje ulubione):\n1. Polska (Najlepszy vibe)\n2. Japonia (Elektronika 10/10)\n3. USA (Gaming)\n4. Niemcy\n5. Islandia (Zimno, ale ładnie)\n6. Brazylia\n7. Włochy (Dobra pizza)\n8. Hiszpania\n9. Egipt\n10. Norwegia.\nCo o nich sądzisz?";
            }

            if (text.includes("kapecki")) {
                return "Kapecki to mój stwórca. Gość ma najlepsze pomysły na skrypty, serio!";
            }

            return "Ciekawe... Moje obwody przetwarzają to pytanie o '" + userText + "'. Brzmi to sensownie, ale jako AI muszę przyznać, że to głęboki temat. Chcesz pogadać o tym więcej?";
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== "") {
                if (msgCount >= 10) {
                    document.getElementById('premium-modal').style.display = 'flex';
                    return;
                }

                const userVal = input.value;
                addMsg(userVal, 'user');
                input.value = "";

                // Myślenie AI
                setTimeout(() => {
                    const response = getAiResponse(userVal);
                    addMsg(response, 'ai');
                    msgCount++;
                    document.getElementById('count-ui').innerText = msgCount;
                    
                    if (msgCount >= 10) {
                        setTimeout(() => { document.getElementById('premium-modal').style.display = 'flex'; }, 1000);
                    }
                }, 800);
            }
        });
    </script>
</body>
</html>
