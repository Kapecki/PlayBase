<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Forge RGB // Generator Przyszłości</title>
    <style>
        /* Efekty Neon Chroma RGB */
        @keyframes rgb-glow {
            0% { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc; }
            25% { border-color: #ff0055; box-shadow: 0 0 20px #ff0055; }
            50% { border-color: #9b59b6; box-shadow: 0 0 20px #9b59b6; }
            75% { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; }
            100% { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        }

        @keyframes text-rainbow {
            0% { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
            50% { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
            100% { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        }

        body {
            background-color: #0a0a12;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            animation: text-rainbow 5s infinite linear;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* Główny Panel Statystyk */
        #control-panel {
            display: flex;
            gap: 25px;
            background: rgba(20, 20, 30, 0.9);
            padding: 15px 30px;
            border-radius: 12px;
            border: 2px solid #222;
            animation: rgb-glow 12s infinite linear;
            margin-bottom: 25px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-box {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .premium-badge {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #aaa;
        }
        .premium-on {
            background: #ff0055;
            color: white;
            box-shadow: 0 0 10px #ff0055;
        }

        /* Przyciski operacyjne */
        .btn-core {
            background: #111;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-core:hover {
            background: #00ffcc;
            color: #111;
            box-shadow: 0 0 15px #00ffcc;
            transform: translateY(-2px);
        }

        /* Sklep czasowy Premium */
        #premium-market {
            display: flex;
            gap: 15px;
            background: rgba(15, 15, 25, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 25px;
            width: 100%;
            max-width: 700px;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .market-card {
            background: #151522;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            min-width: 160px;
        }
        .market-card h3 { margin: 0 0 5px 0; font-size: 13px; color: #f1c40f; }
        .btn-activate {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-activate:hover { box-shadow: 0 0 10px #f1c40f; }

        /* Siatka Laboratorium (Matryca Tworzenia) */
        #forge-matrix {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 15px;
            background: rgba(10, 10, 15, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .matrix-slot {
            background: #11111d;
            border: 1px dashed #444;
            border-radius: 8px;
            position: relative;
        }
        .matrix-slot.drag-over {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }

        /* Przedmioty (Itemy RGB) */
        .cyber-item {
            width: 90px;
            height: 90px;
            position: absolute;
            top: 3px;
            left: 3px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            border: 2px solid;
            animation: rgb-glow 8s infinite linear;
            background: #1c1c28;
            box-sizing: border-box;
            padding: 5px;
            text-align: center;
        }
        .cyber-item:active { cursor: grabbing; }
        .item-icon { font-size: 24px; }
        .item-name { font-size: 9px; font-weight: bold; margin-top: 4px; color: #bbb; text-transform: uppercase; }
        .item-income { font-size: 9px; color: #00ffcc; margin-top: 2px; }

        /* Dolny Panel z Twoimi Linkami */
        #user-profiles {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .profile-btn {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: #161622;
            border-radius: 6px;
            border: 2px solid #333;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .profile-btn:hover {
            animation: rgb-glow 3s infinite linear;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Cyber-Forge // Matryca RGB</h1>

    <div id="control-panel">
        <div class="stat-box">KREDYTY: <span id="currency-val">100</span> 🌌</div>
        <div class="stat-box">GENERACJA: +<span id="income-val">0</span>/s</div>
        <div class="stat-box">BOOSTER PREMIUM: <span id="premium-status" class="premium-badge">NIEAKTYWNY</span></div>
        <button class="btn-core" id="btn-buy-core">Stwórz Rdzeń [Koszt: 40 🌌]</button>
    </div>

    <div id="premium-market">
        <div class="market-card">
            <h3>ZASILANIE 1 MINUTA</h3>
            <button class="btn-activate" onclick="triggerPremium(60)">AKTYWUJ ZA DARMO</button>
        </div>
        <div class="market-card">
            <h3>ZASILANIE 1 GODZINA</h3>
            <button class="btn-activate" onclick="triggerPremium(3600)">AKTYWUJ ZA DARMO</button>
        </div>
        <div class="market-card">
            <h3>ZASILANIE 1 DZIEŃ</h3>
            <button class="btn-activate" onclick="triggerPremium(86400)">AKTYWUJ ZA DARMO</button>
        </div>
    </div>

    <div id="forge-matrix"></div>

    <div id="user-profiles">
        <a href="https://github.com" target="_blank" class="profile-btn">MÓJ GITHUB 🚀</a>
        <a href="https://tiktok.com" target="_blank" class="profile-btn">MÓJ TIKTOK 🎬</a>
        <a href="https://youtube.com" target="_blank" class="profile-btn">MÓJ YOUTUBE 📺</a>
    </div>

<script>
    // Konfiguracja poziomów przedmiotów (Baza danych przedmiotów przyszłości)
    const itemDatabase = {
        1: { name: "Rdzeń Energii", icon: "💎", income: 1 },
        2: { name: "Micro-Chip RGB", icon: "💾", income: 3 },
        3: { name: "Cyber-Miecz", icon: "⚔️", income: 8 },
        4: { name: "Kwantowy PC", icon: "💻", income: 20 },
        5: { name: "Rdzeń Fuzji", icon: "⚛️", income: 50 },
        6: { name: "Napęd Antymaterii", icon: "🚀", income: 150 }
    };

    let credits = 100;
    let premiumSeconds = 0;
    let currentIncome = 0;
    let draggedItem = null;

    const matrix = document.getElementById('forge-matrix');
    const currencyTxt = document.getElementById('currency-val');
    const incomeTxt = document.getElementById('income-val');
    const premiumTxt = document.getElementById('premium-status');

    // Tworzenie siatki laboratoryjnej 4x3 (12 slotów)
    for (let i = 0; i < 12; i++) {
        const slot = document.createElement('div');
        slot.classList.add('matrix-slot');
        
        slot.addEventListener('dragover', (e) => {
            e.preventDefault();
            slot.classList.add('drag-over');
        });
        slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
        slot.addEventListener('drop', handleMergeDrop);
        
        matrix.appendChild(slot);
    }

    // Kupowanie podstawowego komponentu (Poziom 1)
    document.getElementById('btn-buy-core').addEventListener('click', () => {
        if (credits >= 40) {
            const freeSlot = Array.from(document.querySelectorAll('.matrix-slot')).find(s => !s.hasChildNodes());
            if (freeSlot) {
                credits -= 40;
                generateItem(freeSlot, 1);
                calculateTotalIncome();
                updateInterface();
            } else {
                alert("Wszystkie komory matrycy są zajęte!");
            }
        } else {
            alert("Brak wystarczającej ilości Kredytów Kosmicznych!");
        }
    });

    // Generator przedmiotów
    function generateItem(slot, level) {
        const data = itemDatabase[level];
        const item = document.createElement('div');
        item.classList.add('cyber-item');
        item.draggable = true;
        item.dataset.level = level;

        item.innerHTML = `
            <div class="item-icon">${data.icon}</div>
            <div class="item-name">${data.name}</div>
            <div class="item-income">+${data.income}/s</div>
        `;

        item.addEventListener('dragstart', () => draggedItem = item);
        item.addEventListener('dragend', () => draggedItem = null);

        slot.appendChild(item);
    }

    // System łączenia technologii (Merge)
    function handleMergeDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        if (!draggedItem) return;

        const targetItem = this.querySelector('.cyber-item');
        const oldSlot = draggedItem.parentElement;

        if (!targetItem) {
            this.appendChild(draggedItem);
        } else if (targetItem !== draggedItem) {
            const lvlA = parseInt(draggedItem.dataset.level);
            const lvlB = parseInt(targetItem.dataset.level);

            if (lvlA === lvlB && lvlA < 6) {
                oldSlot.innerHTML = '';
                this.innerHTML = '';
                generateItem(this, lvlA + 1);
                credits += 20; // Bonus finansowy za fuzję przedmiotów
                calculateTotalIncome();
                updateInterface();
            }
        }
    }

    // Kalkulator zysków z całego laboratorium
    function calculateTotalIncome() {
        let total = 0;
        document.querySelectorAll('.cyber-item').forEach(item => {
            const lvl = parseInt(item.dataset.level);
            total += itemDatabase[lvl].income;
        });
        
        // Jeśli premium działa, podwajamy całą produkcję fabryki!
        if (premiumSeconds > 0) {
            total = total * 2;
        }
        currentIncome = total;
    }

    // Aktywacja darmowych pakietów czasowych
    window.triggerPremium = function(seconds) {
        premiumSeconds += seconds;
        alert(`Booster Aktywowany! Całkowity przychód Twojego laboratorium rośnie x2 na czas trwania energii.`);
        calculateTotalIncome();
        updateInterface();
    };

    function updateInterface() {
        currencyTxt.innerText = Math.floor(credits);
        incomeTxt.innerText = currentIncome;
        if (premiumSeconds > 0) {
            premiumTxt.innerText = `AKTYWNY (${premiumSeconds}s)`;
            premiumTxt.classList.add('premium-on');
        } else {
            premiumTxt.innerText = "NIEAKTYWNY";
            premiumTxt.classList.remove('premium-on');
        }
    }

    // Pętla odliczania czasu Boostera Premium (co 1 sekundę)
    setInterval(() => {
        if (premiumSeconds > 0) {
            premiumSeconds--;
            if (premiumSeconds === 0) calculateTotalIncome();
            updateInterface();
        }
    }, 1000);

    // Automatyczne generowanie dochodu (co 1 sekundę)
    setInterval(() => {
        if (currentIncome > 0) {
            credits += currentIncome;
            updateInterface();
        }
    }, 1000);
</script>
</body>
</html>
