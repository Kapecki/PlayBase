<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gears Fortress - Ultra RGB Edition</title>
    <style>
        /* Zaawansowane Animacje Płynnego RGB (Neon Chroma) */
        @keyframes rgb-glow {
            0% { border-color: #ff0055; box-shadow: 0 0 20px #ff0055, inset 0 0 10px #ff0055; }
            20% { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc, inset 0 0 10px #00ffcc; }
            40% { border-color: #9b59b6; box-shadow: 0 0 20px #9b59b6, inset 0 0 10px #9b59b6; }
            60% { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f, inset 0 0 10px #f1c40f; }
            80% { border-color: #ff3300; box-shadow: 0 0 20px #ff3300, inset 0 0 10px #ff3300; }
            100% { border-color: #ff0055; box-shadow: 0 0 20px #ff0055, inset 0 0 10px #ff0055; }
        }

        @keyframes rgb-text {
            0% { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
            25% { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
            50% { color: #9b59b6; text-shadow: 0 0 10px #9b59b6; }
            75% { color: #f1c40f; text-shadow: 0 0 10px #f1c40f; }
            100% { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        }

        @keyframes background-rgb {
            0% { background-color: #0f051d; }
            50% { background-color: #05131a; }
            100% { background-color: #0f051d; }
        }

        @keyframes spin-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Główne Style Strony */
        body {
            animation: background-rgb 15s infinite ease-in-out;
            color: #ffffff;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            animation: rgb-text 6s infinite linear;
            font-size: 32px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        /* Górny Panel Statusu i Zakupów */
        #dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(20, 20, 20, 0.85);
            padding: 15px 30px;
            border-radius: 12px;
            border: 2px solid #fff;
            animation: rgb-glow 10s infinite linear;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .stat-box {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .premium-status {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            background: #444;
            color: #aaa;
        }
        .premium-active {
            background: #ff0055;
            color: #fff;
            text-shadow: 0 0 5px #fff;
            animation: rgb-glow 3s infinite linear;
        }

        .btn-action {
            background: #111;
            color: #fff;
            border: 2px solid #444;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            transform: translateY(-2px);
        }

        /* SEKCJA PREMIUM - DARMOWE ACTIVATION */
        #premium-shop {
            display: flex;
            gap: 15px;
            background: rgba(15, 15, 15, 0.9);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 25px;
            width: 100%;
            max-width: 750px;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .shop-card {
            background: #222;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            min-width: 180px;
        }
        .shop-card h3 { margin: 0 0 8px 0; font-size: 14px; color: #f1c40f; }
        .btn-premium {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-premium:hover {
            box-shadow: 0 0 10px #f1c40f;
        }

        /* Kontener Planszy */
        #arena {
            display: flex;
            background-color: rgba(10, 10, 10, 0.9);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #222;
            gap: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Tor Przeszkód i Potworów */
        #combat-lane {
            width: 120px;
            height: 380px;
            background: linear-gradient(180deg, #111 0%, #1a1a1a 100%);
            border: 2px solid #333;
            border-radius: 12px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .waypoint {
            position: absolute;
            width: 100%;
            text-align: center;
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
            background: rgba(30, 30, 30, 0.8);
            letter-spacing: 1px;
        }
        .spawn-zone { top: 0; border-bottom: 1px solid #ff0055; color: #ff0055; }
        .base-zone { bottom: 0; border-top: 1px solid #00ffcc; color: #00ffcc; }

        /* Siatka Konstrukcyjna Kół */
        #gear-matrix {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 20px;
        }
        .matrix-cell {
            background-color: rgba(25, 25, 25, 0.6);
            border: 2px dashed #444;
            border-radius: 50%;
            position: relative;
            transition: all 0.3s ease;
        }
        .matrix-cell.hovered {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
        }

        /* Neonowe Koła Zębate RGB */
        .gear-entity {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: grab;
            border: 5px dashed;
            animation: spin-clockwise 4s linear infinite, rgb-glow 6s infinite linear;
        }
        .gear-entity .level-badge { font-size: 26px; line-height: 26px; }
        .gear-entity .type-badge { font-size: 10px; opacity: 0.8; margin-top: 2px; }

        /* Jednostki Bojowe i Wrogowie */
        .enemy-unit, .ally-bullet {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            position: absolute;
            left: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: top 0.05s linear;
        }
        .enemy-unit {
            background: #9b59b6;
            box-shadow: 0 0 12px #9b59b6;
            border: 2px solid #fff;
            top: 40px;
        }
        .ally-bullet {
            background: #00ffcc;
            box-shadow: 0 0 12px #00ffcc;
            border: 2px solid #fff;
            bottom: 40px;
        }

        /* DOLNY PANEL SPOŁECZNOŚCIOWY */
        #social-footer {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .profile-hub {
            color: #ffffff;
            text-decoration: none;
            padding: 12px 25px;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 8px;
            border: 2px solid #333;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            transition: inherit;
        }
        .profile-hub:hover {
            animation: rgb-glow 3s infinite linear;
            transform: scale(1.05) translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>GEARS FORTRESS // CHROMA</h1>

    <div id="dashboard">
        <div class="stat-box">ZŁOTO: <span id="balance">60</span> 💰</div>
        <div class="stat-box">PŻ BAZY: <span id="health">10</span> ❤️</div>
        <div class="stat-box">PREMIUM: <span id="premium-indicator" class="premium-status">NIEAKTYWNE</span></div>
        <button class="btn-action" id="btn-buy">Kup Koło Lvl 1 [30 💰]</button>
    </div>

    <div id="premium-shop">
        <div class="shop-card">
            <h3>PAKIET MINUTOWY</h3>
            <button class="btn-premium" onclick="activatePremium(60)">1 MIN ZA DARMO</button>
        </div>
        <div class="shop-card">
            <h3>PAKIET GODZINNY</h3>
            <button class="btn-premium" onclick="activatePremium(3600)">1 GODZ ZA DARMO</button>
        </div>
        <div class="shop-card">
            <h3>PAKIET DZIENNY</h3>
            <button class="btn-premium" onclick="activatePremium(86400)">1 DZIEŃ ZA DARMO</button>
        </div>
    </div>

    <div id="arena">
        <div id="combat-lane">
            <div class="waypoint spawn-zone">PORTAL</div>
            <div class="waypoint base-zone">REAKTOR</div>
        </div>
        <div id="gear-matrix"></div>
    </div>

    <div id="social-footer">
        <a href="https://github.com" target="_blank" class="profile-hub">PROFIL GITHUB 🚀</a>
        <a href="https://tiktok.com" target="_blank" class="profile-hub">PROFIL TIKTOK 🎬</a>
        <a href="https://youtube.com" target="_blank" class="profile-hub">KANAŁ YOUTUBE 📺</a>
    </div>

<script>
    let gold = 60;
    let baseHp = 10;
    let premiumTimeLeft = 0;
    let draggedElement = null;
    
    let activeEnemies = [];
    let activeBullets = [];

    const matrix = document.getElementById('gear-matrix');
    const combatLane = document.getElementById('combat-lane');
    const balanceTxt = document.getElementById('balance');
    const healthTxt = document.getElementById('health');
    const premiumIndicator = document.getElementById('premium-indicator');

    // Inicjalizacja Slotów Planszy (3x3)
    for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.classList.add('matrix-cell');
        cell.addEventListener('dragover', (e) => {
            e.preventDefault();
            cell.classList.add('hovered');
        });
        cell.addEventListener('dragleave', () => cell.classList.remove('hovered'));
        cell.addEventListener('drop', handleDrop);
        matrix.appendChild(cell);
    }

    // Zakup Podstawowego Koła
    document.getElementById('btn-buy').addEventListener('click', () => {
        if (gold >= 30) {
            const openCell = Array.from(document.querySelectorAll('.matrix-cell')).find(c => !c.hasChildNodes());
            if (openCell) {
                gold -= 30;
                updateUI();
                spawnGearEntity(openCell, 1);
            } else {
                alert("Brak wolnego miejsca na polach RGB!");
            }
        } else {
            alert("Niewystarczająca ilość funduszy!");
        }
    });

    // Generator Kół Zębatych
    function spawnGearEntity(slot, lvl) {
        if (lvl > 5) lvl = 5;
        const gear = document.createElement('div');
        gear.classList.add('gear-entity');
        gear.draggable = true;
        
        // Zależność prędkości obrotowej od poziomu
        gear.style.animation = `spin-clockwise ${5 / lvl}s linear infinite, rgb-glow 6s infinite linear`;

        gear.innerHTML = `
            <div class="level-badge">${lvl}</div>
            <div class="type-badge">${lvl >= 3 ? 'OVERDRIVE' : 'CHROMA'}</div>
        `;
        gear.dataset.level = lvl;

        // Mechanizm automatycznego spawnowania obrońców (Premium skraca czas produkcji o połowę)
        let baseRate = 3500 / lvl;
        function setupShooter() {
            let actualRate = premiumTimeLeft > 0 ? baseRate / 2 : baseRate;
            return setTimeout(() => {
                if (document.body.contains(gear)) {
                    fireDefenderUnit(lvl);
                    gear.shooterTimeout = setupShooter();
                }
            }, actualRate);
        }
        gear.shooterTimeout = setupShooter();

        gear.addEventListener('dragstart', () => draggedElement = gear);
        gear.addEventListener('dragend', () => draggedElement = null);
        slot.appendChild(gear);
    }

    // Łączenie struktur kół (Merge System)
    function handleDrop(e) {
        e.preventDefault();
        this.classList.remove('hovered');
        if (!draggedElement) return;

        const targetGear = this.querySelector('.gear-entity');
        const originSlot = draggedElement.parentElement;

        if (!targetGear) {
            this.appendChild(draggedElement);
        } else if (targetGear !== draggedElement) {
            const srcLvl = parseInt(draggedElement.dataset.level);
            const trgLvl = parseInt(targetGear.dataset.level);

            if (srcLvl === trgLvl && srcLvl < 5) {
                clearTimeout(draggedElement.shooterTimeout);
                clearTimeout(targetGear.shooterTimeout);
                originSlot.innerHTML = '';
                this.innerHTML = '';
                
                spawnGearEntity(this, srcLvl + 1);
                gold += 15; // Nagroda za udany merge
                updateUI();
            }
        }
    }

    // Aktywacja Sklepu Premium (Czasowa)
    window.activatePremium = function(seconds) {
        premiumTimeLeft += seconds;
        premiumIndicator.classList.add('premium-active');
        alert(`Uruchomiono tryb Premium! Prędkość strzału Twoich kół wzrasta dwukrotnie na czas trwania pakietu.`);
        updateUI();
    };

    function updateUI() {
        balanceTxt.innerText = gold;
        healthTxt.innerText = baseHp;
        if (premiumTimeLeft > 0) {
            premiumIndicator.innerText = `AKTYWNE (${premiumTimeLeft}s)`;
            premiumIndicator.classList.add('premium-active');
        } else {
            premiumIndicator.innerText = "NIEAKTYWNE";
            premiumIndicator.classList.remove('premium-active');
        }
    }

    // Pętla Odliczania Czasu Premium
    setInterval(() => {
        if (premiumTimeLeft > 0) {
            premiumTimeLeft--;
            updateUI();
        }
    }, 1000);

    // Produkcja jednostek defensywnych na tor
    function fireDefenderUnit(level) {
        const bullet = document.createElement('div');
        bullet.classList.add('ally-bullet');
        bullet.innerText = level >= 3 ? "⚡" : "⚔️";
        bullet.style.bottom = "40px";
        bullet.dataset.damage = level;
        combatLane.appendChild(bullet);
        activeBullets.push(bullet);
    }

    // Spawner hord przeciwników
    setInterval(() => {
        const enemy = document.createElement('div');
        enemy.classList.add('enemy-unit');
        enemy.innerText = "👹";
        enemy.style.top = "40px";
        enemy.dataset.hp = 4;
        combatLane.appendChild(enemy);
        activeEnemies.push(enemy);
    }, 3000);

    // Główny Proces Przetwarzania Silnika Gry (60 FPS)
    function processEngine() {
        // Ruch przeciwników w dół toru
        for (let i = activeEnemies.length - 1; i >= 0; i--) {
            let enemy = activeEnemies[i];
            let topPosition = enemy.offsetTop;
            enemy.style.top = (topPosition + 1.2) + "px";

            // Detekcja wdarcia się do rdzenia bazy
            if (topPosition >= 340) {
                baseHp--;
                updateUI();
                enemy.remove();
                activeEnemies.splice(i, 1);
                
                if (baseHp <= 0) {
                    alert("System zniszczony! Nastąpi restart reaktora.");
                    window.location.reload();
                }
            }
        }

        // Ruch pocisków/obrońców w górę toru
        for (let i = activeBullets.length - 1; i >= 0; i--) {
            let bullet = activeBullets[i];
            let topPosition = bullet.offsetTop;
            bullet.style.top = (topPosition - 2.5) + "px";

            if (topPosition <= 20) {
                bullet.remove();
                activeBullets.splice(i, 1);
            }
        }

        // System Kolizji i Obliczania Obrażeń (Kombat)
        for (let i = activeEnemies.length - 1; i >= 0; i--) {
            let enemy = activeEnemies[i];
            for (let j = activeBullets.length - 1; j >= 0; j--) {
                let bullet = activeBullets[j];
                
                if (Math.abs(enemy.offsetTop - bullet.offsetTop) < 20) {
                    let currentHp = parseInt(enemy.dataset.hp) - parseInt(bullet.dataset.damage);
                    bullet.remove();
                    activeBullets.splice(j, 1);

                    if (currentHp <= 0) {
                        // Bonus za zniszczenie (Premium daje x2 złota)
                        gold += premiumTimeLeft > 0 ? 40 : 20;
                        updateUI();
                        enemy.remove();
                        activeEnemies.splice(i, 1);
                        break;
                    } else {
                        enemy.dataset.hp = currentHp;
                    }
                }
            }
        }
        requestAnimationFrame(processEngine);
    }
    
    // Uruchomienie pętli silnika
    requestAnimationFrame(processEngine);
</script>
</body>
</html>
