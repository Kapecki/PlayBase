<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBase | Lobby</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card: #1d232a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        #top-bar { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; }
        .pill { background: var(--card); border: 2px solid var(--primary); padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; gap: 10px; }
        
        .grid { display: flex; gap: 30px; margin-top: 50px; }
        .card { width: 280px; background: var(--card); border: 3px solid #333; border-radius: 40px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--primary); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,212,255,0.3); }
        
        #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; border: 2px solid var(--primary); text-align: center; width: 320px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: none; text-align: center; font-size: 16px; }
        .btn { padding: 10px 25px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="pill">
            <span id="display-nick">Gracz</span>
            <span style="cursor:pointer" onclick="toggleSettings()">⚙️</span>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-box">
            <h2 style="color:var(--primary)">USTAWIENIA</h2>
            <input type="text" id="input-nick" placeholder="Twój Nick">
            <button class="btn" style="background:var(--primary)" onclick="saveNick()">ZAPISZ</button>
            <button class="btn" style="background:#333; color:white; margin-top:10px;" onclick="toggleSettings()">ZAMKNIJ</button>
        </div>
    </div>

    <h1 style="font-size: 70px; color: var(--primary); text-shadow: 0 0 20px rgba(0,212,255,0.5);">PlayBase</h1>
    
    <div class="grid">
        <div class="card" onclick="location.href='ttt.html'">
            <div style="font-size: 50px;">❌</div>
            <h2>KÓŁKO I KRZYŻYK</h2>
            <p>20 poziomów trudności</p>
        </div>
        <div class="card" onclick="location.href='dash.html'">
            <div style="font-size: 50px;">⚡</div>
            <h2>CYBER DASH</h2>
            <p>Zabójczy bieg neonowy</p>
        </div>
    </div>

    <script>
        const nick = localStorage.getItem('p_nick') || "Gracz_" + Math.floor(Math.random()*99);
        document.getElementById('display-nick').innerText = nick;

        function toggleSettings() {
            const m = document.getElementById('settings-modal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
            document.getElementById('input-nick').value = nick;
        }

        function saveNick() {
            const newNick = document.getElementById('input-nick').value;
            if(newNick) {
                localStorage.setItem('p_nick', newNick);
                location.reload();
            }
        }
    </script>
</body>
</html>
