<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KAPECKI AI - LIMITLESS</title>
    <style>
        :root {
            --rgb-red: #ff0000;
            --bg-dark: #0f0f0f;
            --glass: rgba(255, 255, 255, 0.07);
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; display: flex; height: 100vh;
        }

        /* BOCZNE MENU */
        .sidebar {
            width: 260px; background: #000; border-right: 1px solid #333;
            display: flex; flex-direction: column; padding: 15px;
        }

        .nav-item {
            padding: 12px; margin-bottom: 5px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; color: #ccc;
        }

        .nav-item:hover { background: var(--glass); color: white; }
        
        .premium-btn {
            background: linear-gradient(45deg, #ff0000, #ff8800);
            color: white; font-weight: bold; border: none; margin-top: auto;
            padding: 15px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        /* GŁÓWNY CZAT */
        .chat-main { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        
        #chat-window {
            flex-grow: 1; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
        }

        .msg { padding: 15px; border-radius: 10px; max-width: 80%; line-height: 1.5; }
        .user-msg { background: #2f2f2f; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: var(--glass); align-self: flex-start; border-left: 4px solid red; }

        /* STOPKA Z INPUTEM */
        .input-area { padding: 20px 100px; background: var(--bg-dark); }
        .input-container { position: relative; display: flex; align-items: center; }

        input {
            width: 100%; background: #222; border: 1px solid #444; padding: 15px;
            border-radius: 12px; color: white; outline: none; font-size: 16px;
        }

        input:disabled { opacity: 0.5; cursor: not-allowed; border-color: red; }

        /* EKRAN BLOKADY / PREMIUM */
        #lock-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 100; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        .limit-text { color: red; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color:red; letter-spacing: 2px;">KAPECKI AI</h2>
        <div class="nav-item" onclick="location.reload()">+ Nowy czat</div>
        <div class="nav-item">Historia</div>
        <div class="nav-item" onclick="showPremium()">⭐ Moje konto</div>
        
        <button class="premium-btn" onclick="showPremium()">KUP PREMIUM</button>
    </div>

    <div class="chat-main">
        <div id="lock-screen">
            <div class="limit-text">LIMIT WIADOMOŚCI OSIĄGNIĘTY!</div>
            <p>Wykorzystałeś darmowe 10 wiadomości.</p>
            <p style="color: #888;">Poczekaj 10 minut lub odblokuj teraz:</p>
            <button class="premium-btn" style="width: 250px;">ODBLOKUJ PREMIUM - 19,99 PLN</button>
            <br>
            <a href="#" onclick="hidePremium()" style="color:white; font-size: 12px;">Wróć do czatu</a>
        </div>

        <div id="chat-window">
            <div class="msg ai-msg">Cześć! Jestem Twoim AI. Mam dla Ciebie 10 darmowych wiadomości. O czym chcesz pogadać?</div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Napisz coś...">
                <div id="counter" style="position:absolute; right: -80px; color: #555;">0/10</div>
            </div>
        </div>
    </div>

    <script>
        let msgCount = 0;
        const maxMsgs = 10;
        const input = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');
        const lockScreen = document.getElementById('lock-screen');
        const counter = document.getElementById('counter');

        function showPremium() { lockScreen.style.display = 'flex'; }
        function hidePremium() { lockScreen.style.display = 'none'; }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== "") {
                if (msgCount >= maxMsgs) {
                    showPremium();
                    return;
                }

                // Dodaj wiadomość użytkownika
                const userMsg = document.createElement('div');
                userMsg.className = 'msg user-msg';
                userMsg.innerText = input.value;
                chatWindow.appendChild(userMsg);

                // Symuluj odpowiedź AI
                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'msg ai-msg';
                    aiMsg.innerText = "To ciekawe! Jako Twoje AI mogę Ci powiedzieć, że " + input.value + " to świetny temat. Co jeszcze?";
                    chatWindow.appendChild(aiMsg);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }, 600);

                msgCount++;
                counter.innerText = `${msgCount}/${maxMsgs}`;
                
                if (msgCount >= maxMsgs) {
                    counter.style.color = 'red';
                    input.disabled = true;
                    input.placeholder = "LIMIT OSIĄGNIĘTY!";
                    setTimeout(showPremium, 1500);
                }

                input.value = "";
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        });
    </script>

</body>
</html>
