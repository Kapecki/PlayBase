<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intergalactic Trade Tycoon 3D // System OS v12</title>
    <style>
        /* ==========================================================================
           CYBERPUNK CHROMA GLOW & FULLSCREEN LAYOUT
           ========================================================================== */
        :root {
            --neon-blue: #00f0ff;
            --neon-magenta: #ff0077;
            --neon-green: #00ff66;
            --neon-gold: #ffcc00;
            --panel-bg: rgba(6, 6, 14, 0.9);
        }

        @keyframes border-chroma {
            0% { border-color: var(--neon-magenta); box-shadow: 0 0 15px var(--neon-magenta); }
            33% { border-color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); }
            66% { border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }
            100% { border-color: var(--neon-magenta); box-shadow: 0 0 15px var(--neon-magenta); }
        }

        body {
            background-color: #020205;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        /* Canvas dla silnika 3D */
        #canvas-3d {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Warstwa Interfejsu 2D (HUD) */
        #hud-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            display: grid;
            grid-template-columns: 360px 1fr 380px;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
        }

        @media (max-width: 1100px) {
            #hud-layer {
                grid-template-columns: 1fr;
                overflow-y: auto;
                pointer-events: auto;
            }
            .interactive-panel { pointer-events: auto !important; }
        }

        .interactive-panel {
            background: var(--panel-bg);
            border: 2px solid #222;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            animation: border-chroma 20s infinite linear;
            max-height: 92vh;
            overflow-y: auto;
        }

        .panel-header {
            font-size: 14px;
            font-weight: bold;
            color: var(--neon-blue);
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* STATYSTYKI FINANSOWE */
        .wallet-container {
            background: rgba(0,0,0,0.4);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0,255,102,0.3);
            margin-bottom: 15px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #aaa;
        }
        .stat-row span { color: #fff; font-weight: bold; }

        /* SKLEP / HANDELKI */
        .trade-item-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .trade-item-card:hover {
            background: rgba(255,255,255,0.07);
            border-color: var(--neon-blue);
        }

        .btn-action {
            background: #090912;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            transition: all 0.2s;
        }
        .btn-action:hover:not(:disabled) {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0,255,102,0.4);
            transform: translateY(-1px);
        }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }

        /* TOPKA / LEADERBOARD */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .leader-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid transparent;
        }
        .leader-row.player {
            border-color: var(--neon-magenta);
            background: rgba(255,0,119,0.1);
            font-weight: bold;
        }
        .rank-badge {
            width: 24px;
            font-weight: bold;
            color: var(--neon-blue);
        }

        /* TIMER SEZONU */
        #season-timer-bar {
            width: 100%;
            height: 4px;
            background: #222;
            margin-top: 5px;
            border-radius: 2px;
            overflow: hidden;
        }
        #season-progress {
            width: 100%;
            height: 100%;
            background: var(--neon-magenta);
            transition: width 1s linear;
        }

        /* SKLEP DOPOALACZY */
        .booster-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .btn-boost {
            font-size: 9px;
            padding: 8px 4px;
            text-align: center;
        }

        /* HISTORIA NAGRÓD */
        #rewards-log {
            font-size: 11px;
            color: var(--neon-gold);
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 6px;
            height: 70px;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #222;
        }

        /* SCROLLBARS */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="canvas-3d"></canvas>

    <div id="hud-layer">
        
        <div class="interactive-panel">
            <div class="panel-header"><div>[01] Licencje Handlowe</div></div>
            <div class="wallet-container"><span id="player-cash">0</span> 🪙</div>
            
            <div class="stat-row">CAŁKOWITY PRZYCHÓD: <span id="total-ips">0 🪙/s</span></div>
            <div class="stat-row">NAJLEPSZY HANDELEK: <span id="best-item-txt">Brak</span></div>
            
            <button class="btn-action" id="btn-manual-click" style="width:100%; margin-bottom:15px; background:#111125; border-color:var(--neon-blue);">
                Wymuś Transakcję Ręczną (+10 🪙)
            </button>

            <div style="flex:1; overflow-y:auto;" id="shop-items-container">
                </div>
        </div>

        <div></div>

        <div class="interactive-panel">
            <div class="panel-header">
                <div>[02] Globalna Topka Handlowa</div>
                <div style="font-size:10px; color:#666;">SEZON #1</div>
            </div>
            
            <div class="stat-row">KONIEC SEZONU ZA: <span id="timer-txt">60s</span></div>
            <div id="season-timer-bar"><div id="season-progress"></div></div>

            <div style="margin: 15px 0;" class="leaderboard-list" id="leaderboard-dom">
                </div>

            <div class="panel-header" style="margin-top:10px;"><div>[03] Dopalacze Matrycy</div></div>
            <div class="booster-grid">
                <button class="btn-action btn-boost" onclick="triggerFreeBoost(30)">Impuls 30s (x2)</button>
                <button class="btn-action btn-boost" onclick="triggerFreeBoost(300)">Błysk 5m (x2)</button>
                <button class="btn-action btn-boost" onclick="triggerFreeBoost(3600)">Hiper 1H (x2)</button>
            </div>

            <div class="panel-header" style="margin-top:20px; margin-bottom:5px;"><div>Dziennik Przyznanych Nagród</div></div>
            <div id="rewards-log">Oczekiwanie na zakończenie pierwszego sezonu handlowego...</div>
        </div>

    </div>

<script>
    /* ==========================================================================
       ZAAWANSOWANY SILNIK INTERGALAKTYCZNEGO TYCOONA 3D
       ========================================================================== */

    // Definicje domyślnych typów handlowych (Sklep)
    const baseShopConfig = [
        { id: "h1", name: "Dron Kurierski", cost: 50, income: 2, count: 0 },
        { id: "h2", name: "Kuter Handlowy", cost: 250, income: 12, count: 0 },
        { id: "h3", name: "Fregata Transportowa", cost: 1200, income: 65, count: 0 },
        { id: "h4", name: "Gwiezdny Transporter", cost: 7500, income: 380, count: 0 },
        { id: "h5", name: "Mega-Galeon Korporacji", cost: 45000, income: 2100, count: 0 }
    ];

    // Nazwy botów do symulacji rankingu (Topki)
    const corporateCompetitors = [
        { name: "Apex Corp", cash: 3000, incomeRate: 15 },
        { name: "Vortex Logistics", cash: 1500, incomeRate: 35 },
        { name: "Nexus Freight", cash: 8000, incomeRate: 90 },
        { name: "Quantum Cargo", cash: 25000, incomeRate: 400 },
        { name: "Nebula Trade", cash: 90000, incomeRate: 1800 },
        { name: "Hyperion Inc", cash: 200, incomeRate: 2 },
        { name: "Chroma Shipping", cash: 400, incomeRate: 8 },
        { name: "Core Systems", cash: 12000, incomeRate: 150 },
        { name: "Solar Wind Ltd", cash: 60000, incomeRate: 1100 }
    ];

    // Globalny stan aplikacji
    let state = {
        cash: 100,
        shopItems: JSON.parse(JSON.stringify(baseShopConfig)),
        competitors: JSON.parse(JSON.stringify(corporateCompetitors)),
        rewardHandelki: [], // Tu trafiają wygrane super-handelki z topki
        seasonTimeLeft: 60,
        globalBoosterTime: 0
    };

    // Inicjalizacja Audio Synthesizera
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type="sine", duration=0.1) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    /* ==========================================================================
       SILNIK 3D (THREE.JS GRAPHICS ENGINE)
       ========================================================================== */
    let scene, camera, renderer, stationGroup, particles;

    function init3DEngine() {
        const container = document.getElementById('canvas-3d');
        
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020206);
        scene.fog = new THREE.FogExp2(0x020206, 0.015);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 45;

        renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Tworzenie stacji kosmicznej 3D
        stationGroup = new THREE.Group();
        
        // Pierścień główny stacji
        const ringGeo = new THREE.TorusGeometry(12, 0.6, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
        const mainRing = new THREE.Mesh(ringGeo, ringMat);
        stationGroup.add(mainRing);

        // Drugi pierścień (krzyżowy)
        const ringGeo2 = new THREE.TorusGeometry(9, 0.3, 12, 80);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff0077, wireframe: true });
        const crossRing = new THREE.Mesh(ringGeo2, ringMat2);
        crossRing.rotation.x = Math.PI / 2;
        stationGroup.add(crossRing);

        // Rdzeń energetyczny stacji
        const coreGeo = new THREE.IcosahedronGeometry(3, 1);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        stationGroup.add(coreMesh);

        scene.add(stationGroup);

        // System cząsteczek gwiazd w tle
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 800;
        const starPositions = new Float32Array(starsCount * 3);

        for(let i=0; i<starsCount*3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true });
        particles = new THREE.Points(starsGeo, starsMat);
        scene.add(particles);

        // Obsługa ruchu myszką
        window.addEventListener('mousemove', (e) => {
            const mouseX = (e.clientX / window.innerWidth) - 0.5;
            const mouseY = (e.clientY / window.innerHeight) - 0.5;
            stationGroup.rotation.y = mouseX * 2;
            stationGroup.rotation.x = mouseY * 2;
        });

        window.addEventListener('resize', onWindowResize);
        animate3D();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate3D() {
        requestAnimationFrame(animate3D);
        
        // Autonomiczny obrót obiektów 3D
        stationGroup.children[0].rotation.z += 0.005;
        stationGroup.children[1].rotation.z -= 0.008;
        stationGroup.children[2].rotation.y += 0.01;

        particles.rotation.y += 0.0005;

        renderer.render(scene, camera);
    }

    /* ==========================================================================
       LOGIKA BIZNESOWA, SKLEP I STRUKTURA EKONOMII
       ========================================================================== */
    function renderShop() {
        const container = document.getElementById('shop-items-container');
        container.innerHTML = '';

        // Najpierw renderujemy standardowe kupne licencje
        state.shopItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.classList.add('trade-item-card');
            card.innerHTML = `
                <div>
                    <div style="font-weight:bold; font-size:13px;">${item.name} (x${item.count})</div>
                    <div style="font-size:11px; color:var(--neon-green);">+${item.income} 🪙/s</div>
                </div>
                <button class="btn-action" onclick="buyStandardItem(${index})" ${state.cash < item.cost ? 'disabled' : ''}>
                    Kup [${Math.floor(item.cost)} 🪙]
                </button>
            `;
            container.appendChild(card);
        });

        // Jeśli posiadamy specjalne statki zdobyte z nagród TOP 1/2/3, wyświetlamy je niżej
        if(state.rewardHandelki.length > 0) {
            const separator = document.createElement('div');
            separator.style.cssText = "margin:15px 0 10px 0; font-size:11px; color:var(--neon-gold); text-transform:uppercase; font-weight:bold; border-top:1px dashed #444; padding-top:10px;";
            separator.innerText = "Flota Nagród Specjalnych (Topka)";
            container.appendChild(separator);

            state.rewardHandelki.forEach(bonus => {
                const card = document.createElement('div');
                card.classList.add('trade-item-card');
                card.style.borderColor = "var(--neon-gold)";
                card.innerHTML = `
                    <div>
                        <div style="font-weight:bold; font-size:13px; color:var(--neon-gold);">${bonus.name}</div>
                        <div style="font-size:11px; color:#fff;">Mnożnik Pozycji: +${bonus.bonusPercent}%</div>
                    </div>
                    <div style="font-weight:bold; color:var(--neon-green); font-size:13px;">+${Math.floor(bonus.finalIncome)} 🪙/s</div>
                `;
                container.appendChild(card);
            });
        }
    }

    window.buyStandardItem = function(index) {
        const item = state.shopItems[index];
        if(state.cash >= item.cost) {
            state.cash -= item.cost;
            item.count++;
            item.cost = Math.floor(item.cost * 1.25); // Skalowanie ceny o 25%
            playBeep(600, "triangle");
            recalculateTotalIncome();
            updateInterface();
            saveGameData();
        }
    };

    function getBestHandelekIncome() {
        // Funkcja przeszukuje całe imperium, by znaleźć pojedynczy najbardziej dochodowy statek handlowy
        let maxIncome = 0;
        
        // Sprawdzamy standardowy sklep
        state.shopItems.forEach(i => {
            if(i.count > 0 && i.income > maxIncome) {
                maxIncome = i.income;
            }
        });
        // Sprawdzamy dotychczasowe nagrody z wygranych topek
        state.rewardHandelki.forEach(r => {
            if(r.finalIncome > maxIncome) {
                maxIncome = r.finalIncome;
            }
        });

        // Jeśli gracz nie ma nic, punktem odniesienia staje się bazowy dochód drona (2)
        return maxIncome > 0 ? maxIncome : 2;
    }

    let calculatedPlayerIPS = 0;

    function recalculateTotalIncome() {
        let total = 0;
        state.shopItems.forEach(item => {
            total += item.count * item.income;
        });
        state.rewardHandelki.forEach(bonus => {
            total += bonus.finalIncome;
        });

        if(state.globalBoosterTime > 0) {
            total = total * 2; // Dopalacz x2
        }

        calculatedPlayerIPS = total;
    }

    document.getElementById('btn-manual-click').addEventListener('click', () => {
        let clickPower = 10 + Math.floor(calculatedPlayerIPS * 0.1);
        state.cash += clickPower;
        playBeep(800, "sine", 0.05);
        updateInterface();
    });

    window.triggerFreeBoost = function(seconds) {
        state.globalBoosterTime += seconds;
        playBeep(400, "square", 0.2);
        recalculateTotalIncome();
        updateInterface();
    };

    /* ==========================================================================
       DYNAMICZNA TOPKA (LEADERBOARD AI ENGINE) & SEZONY
       ========================================================================= */
    function runLeaderboardEngine() {
        // Symulacja przychodów dla botów w czasie rzeczywistym
        state.competitors.forEach(bot => {
            bot.cash += (bot.incomeRate / 5);
            // Boty mają 5% szans na ulepszenie swoich systemów co sekundę
            if(Math.random() < 0.05) {
                bot.incomeRate = Math.floor(bot.incomeRate * 1.12);
            }
        });

        // Tworzenie zestawienia (Gracz + Boty) do posortowania rankingu
        let fullRanking = [];
        fullRanking.push({ name: "TWOJA FIRMA (TY)", cash: state.cash, isPlayer: true });
        
        state.competitors.forEach(bot => {
            fullRanking.push({ name: bot.name, cash: bot.cash, isPlayer: false });
        });

        // Sortowanie od największej ilości gotówki
        fullRanking.sort((a, b) => b.cash - a.cash);

        // Renderowanie rankingu na żywo w strukturze HTML dom
        const boardDOM = document.getElementById('leaderboard-dom');
        boardDOM.innerHTML = '';

        fullRanking.forEach((row, idx) => {
            const rank = idx + 1;
            const element = document.createElement('div');
            element.classList.add('leader-row');
            if(row.isPlayer) {
                element.classList.add('player');
                state.currentPlayerRank = rank; // Zapamiętujemy miejsce gracza
            }

            element.innerHTML = `
                <div style="display:flex; align-items:center;">
                    <div class="rank-badge">#${rank}</div>
                    <div>${row.name}</div>
                </div>
                <div style="font-weight:bold; color:var(--neon-green);">${Math.floor(row.cash).toLocaleString()} 🪙</div>
            `;
            boardDOM.appendChild(element);
        });
    }

    function executeSeasonEnd() {
        const rank = state.currentPlayerRank;
        const logBox = document.getElementById('rewards-log');
        const bestBase = getBestHandelekIncome();

        playBeep(300, "square", 0.5);

        if(rank === 1) {
            // Nagroda za TOP 1 -> 300% (3x lepszy od najlepszego)
            const finalValue = bestBase * 3;
            const itemBonus = { name: `Super-Artefakt Sezonu (TOP 1)`, bonusPercent: 300, finalIncome: finalValue };
            state.rewardHandelki.push(itemBonus);
            logBox.innerHTML = `[SEZON ZAKOŃCZONY] WYGRAŁEŚ! Miejsce #1. Otrzymujesz Handelek z bonusem 300% (+${Math.floor(finalValue)} 🪙/s)!`;
        } else if(rank === 2) {
            // Nagroda za TOP 2 -> 200% (2x lepszy od najlepszego)
            const finalValue = bestBase * 2;
            const itemBonus = { name: `Sonda Kwantowa (TOP 2)`, bonusPercent: 200, finalIncome: finalValue };
            state.rewardHandelki.push(itemBonus);
            logBox.innerHTML = `[SEZON ZAKOŃCZONY] Świetnie! Miejsce #2. Otrzymujesz Handelek z bonusem 200% (+${Math.floor(finalValue)} 🪙/s)!`;
        } else if(rank === 3) {
            // Nagroda za TOP 3 -> 150% (1.5x lepszy od najlepszego)
            const finalValue = bestBase * 1.5;
            const itemBonus = { name: `Kuter Przebicia (TOP 3)`, bonusPercent: 150, finalIncome: finalValue };
            state.rewardHandelki.push(itemBonus);
            logBox.innerHTML = `[SEZON ZAKOŃCZONY] Dobrze! Miejsce #3. Otrzymujesz Handelek z bonusem 150% (+${Math.floor(finalValue)} 🪙/s)!`;
        } else {
            logBox.innerHTML = `[SEZON ZAKOŃCZONY] Ukończyłeś na miejscu #${rank}. Brak darmowych nagród z floty premium. Celuj w TOP 3!`;
        }

        // Reset gotówki i parametrów botów na nowy sezon rywalizacji
        state.competitors.forEach(bot => {
            bot.cash = Math.floor(state.cash * (0.5 + Math.random())); 
            bot.incomeRate = Math.floor(calculatedPlayerIPS * (0.6 + Math.random()));
        });
        
        state.seasonTimeLeft = 60; // Nowe 60 sekund
        recalculateTotalIncome();
        updateInterface();
        saveGameData();
    }

    /* ==========================================================================
       SYSTEM MONITOROWANIA, AKTUALIZACJI UI I AUTO-SAVE
       ========================================================================== */
    function updateInterface() {
        document.getElementById('player-cash').innerText = Math.floor(state.cash).toLocaleString();
        document.getElementById('total-ips').innerText = `${Math.floor(calculatedPlayerIPS).toLocaleString()} 🪙/s`;
        document.getElementById('timer-txt').innerText = `${state.seasonTimeLeft}s`;
        
        // Pasek postępu sezonu
        const percent = (state.seasonTimeLeft / 60) * 100;
        document.getElementById('season-progress').style.width = `${percent}%`;

        // Najlepsza posiadana pojedyncza wartość
        let best = getBestHandelekIncome();
        document.getElementById('best-item-txt').innerText = `+${Math.floor(best)} 🪙/s`;

        renderShop();
    }

    // Pętla główna (10 razy na sekundę) dla zachowania płynności przyrostu gotówki
    setInterval(() => {
        if(state.globalBoosterTime > 0) {
            state.globalBoosterTime -= 0.1;
            if(state.globalBoosterTime <= 0) recalculateTotalIncome();
        }

        if(calculatedPlayerIPS > 0) {
            state.cash += (calculatedPlayerIPS / 10);
        }

        runLeaderboardEngine();
        updateInterface();
    }, 100);

    // Zmniejszanie czasu sezonu (Co 1 sekundę)
    setInterval(() => {
        if(state.seasonTimeLeft > 0) {
            state.seasonTimeLeft--;
            if(state.seasonTimeLeft === 0) {
                executeSeasonEnd();
            }
        }
    }, 1000);

    /* ==========================================================================
       PERSISTENCE (ZAPIS STANU GRY)
       ========================================================================== */
    function saveGameData() {
        localStorage.setItem('intergalactic_tycoon_save', JSON.stringify(state));
    }

    function loadGameData() {
        const saved = localStorage.getItem('intergalactic_tycoon_save');
        if(saved) {
            const parsed = JSON.parse(saved);
            state.cash = parsed.cash || 100;
            if(parsed.shopItems) state.shopItems = parsed.shopItems;
            if(parsed.rewardHandelki) state.rewardHandelki = parsed.rewardHandelki;
        }
        recalculateTotalIncome();
        updateInterface();
    }

    // Inicjalizacja przy ładowaniu okna przeglądarki
    window.onload = () => {
        init3DEngine();
        loadGameData();
    };

</script>
</body>
</html>
