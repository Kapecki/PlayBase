<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBase | Premium Lobby</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card: #1d232a; --accent: #00ff99; }
        body { 
            margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden;
        }
        /* Efekt mgławicy w tle */
        body::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #16213e 0%, #0b0e14 100%); z-index: -1;
        }

        .hero { text-align: center; animation: slideUp 0.8s ease-out; }
        h1 { 
            font-size: clamp(50px, 8vw, 90px); margin: 0; color: var(--primary); 
            text-shadow: 0 0 25px rgba(0,212,255,0.6); letter-spacing: -2px;
        }
        .tagline { color: var(--accent); letter-spacing: 4px; font-weight: bold; margin-bottom: 60px; font-size: 14px; }

        .grid { display: flex; gap: 25px; }
        .game-card {
            width: 280px; background: var(--card); border: 2px solid #222; border-radius: 40px;
            padding: 50px 30px; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none; color: white; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .game-card:hover {
            border-color: var(--accent); transform: translateY(-20px);
            box-shadow: 0 20px 50px rgba(0,255,153,0.2);
        }
        .icon-circle {
            width: 80px; height: 80px; background: rgba(255,255,255,0.05); 
            border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; margin: 0 auto 20px; font-size: 40px;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="hero">
        <h1>PlayBase</h1>
        <div class="tagline">PREMIUM GAMING HUB</div>

        <div class="grid">
            <a href="farma.html" class="game-card">
                <div class="icon-circle">🌿</div>
                <h2 style="margin: 0; letter-spacing: 1px;">CYBER FARMER</h2>
                <p style="color: #666; font-size: 14px; margin-top: 10px;">Zbuduj swoje zielone imperium.</p>
            </a>
        </div>
    </div>

</body>
</html>
