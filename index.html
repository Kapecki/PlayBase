<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBase | Home</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --card: #1d232a; --accent: #00ff99; }
        body { 
            margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #16213e 0%, #0b0e14 100%); z-index: -1;
        }

        .container { text-align: center; animation: fadeIn 1s ease-in; }
        h1 { font-size: 80px; margin: 0; color: var(--primary); text-shadow: 0 0 30px rgba(0,212,255,0.5); }
        .subtitle { color: var(--accent); letter-spacing: 5px; font-weight: bold; margin-bottom: 50px; }

        .grid { display: flex; gap: 30px; justify-content: center; }
        .card {
            width: 300px; background: var(--card); border: 2px solid #333; border-radius: 35px;
            padding: 40px; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none; color: white; display: block;
        }
        .card:hover {
            border-color: var(--primary); transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(0,212,255,0.3);
        }
        .card .icon { font-size: 60px; margin-bottom: 20px; display: block; }
        .card h2 { margin: 10px 0; letter-spacing: 2px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>PlayBase</h1>
        <p class="subtitle">PREMIUM GAMING HUB</p>

        <div class="grid">
            <a href="farma.html" class="card">
                <span class="icon">🌿</span>
                <h2>CYBER FARMER</h2>
                <p style="color: #888;">Zbuduj swoje imperium roślinne.</p>
            </a>
            </div>
    </div>

</body>
</html>
