<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Tic-Tac-Toe & UNO</title>
    <style>
        :root {
            --primary: #00d4ff; --secondary: #ffcc00; --danger: #ff4d4d;
            --bg: #0b0e14; --card: #161b22; --uno-red: #ff5555; --uno-blue: #5555ff; --uno-green: #55aa55; --uno-yellow: #ffaa00;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Arial Black', sans-serif; background: var(--bg); color: white; overflow: hidden; }

        /* --- UI GÓRNE --- */
        #top-bar { position: fixed; top: 0; right: 0; padding: 20px; display: flex; align-items: center; gap: 15px; z-index: 1000; }
        .user-pill { background: rgba(0, 212, 255, 0.1); border: 2px solid var(--primary); padding: 8px 20px; border-radius: 50px; display: flex; align-items: center; gap: 12px; }
        .settings-icon { cursor: pointer; transition: 0.3s; font-size: 24px; }
        .settings-icon:hover { transform: rotate(90deg); color: var(--secondary); }

        /* --- MODAL USTAWIEŃ --- */
        #settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .settings-card { background: var(--card); padding: 30px; border-radius: 30px; border: 3px solid var(--primary); width: 320px; text-align: center; }
        .settings-card input { width: 80%; padding: 10px; margin: 15px 0; border-radius: 10px; border: none; text-align: center; font-family: inherit; }

        /* --- HUB GŁÓWNY --- */
        #home-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hub-grid { display: flex; gap: 30px; }
        .hub-btn { width: 300px; background: var(--card); border: 4px solid #333; border-radius: 40px; padding: 40px; text-align: center; cursor: pointer; transition: 0.4s; }
        .hub-btn:hover { border-color: var(--primary); transform: translateY(-10px); }

        /* --- UNO ARENA --- */
        #uno-arena { display: none; position: fixed; inset: 0; background: radial-gradient(circle, #2c3e50, #000); z-index: 800; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px; }
        .uno-card { width: 80px; height: 120px; border-radius: 10px; border: 3px solid white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; position: relative; user-select: none; }
        .uno-card:hover { transform: translateY(-20px); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .uno-card.red { background: var(--uno-red); }
        .uno-card.blue { background: var(--uno-blue); }
        .uno-card.green { background: var(--uno-green); }
        .uno-card.yellow { background: var(--uno-yellow); }
        .uno-card.black { background: #333; }

        #opponent-hand { display: flex; gap: -20px; height: 120px; }
        #player-hand { display: flex; gap: 10px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 20px; max-width: 90vw; overflow-x: auto; }
        #center-pile { display: flex; gap: 40px; align-items: center; }
        .deck-pile { width: 80px; height: 120px; background: linear-gradient(45deg, #444, #111); border: 3px solid #666; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* --- TIC-TAC-TOE (Lobby i Arena) --- */
        #ttt-lobby, #ttt-arena { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 500; flex-direction: column; align-items: center; padding-top: 60px; }
        .board { display: grid; gap: 10px; background: var(--primary); padding: 10px; border-radius: 15px; }
        .board.s9 { grid-template-columns: repeat(3, 120px); }
        .board.s18 { grid-template-columns: repeat(6, 90px); }
        .cell { width: 100%; height: 100%; min-height: 90px; background: var(--bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 50px; cursor: pointer; }
        
        .btn { padding: 12px 25px; border-radius: 12px; border: none; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.3s; }
        .lvl-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .lvl-box { width: 50px; height: 50px; border-radius: 10px; border: 2px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .lvl-box.locked { opacity: 0.2; }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg"></audio>

    <div id="top-bar">
        <div class="user-pill">
            <span id="nick-tag">Gracz</span>
            <span class="settings-icon" onclick="toggleSets()">⚙️</span>
        </div>
    </div>

    <div id="settings-overlay">
        <div class="settings-card">
            <h2>USTAWIENIA</h2>
            <input type="text" id="nick-in" maxlength="12">
            <div style="margin: 15px 0;">
                Muzyka: <button id="m-btn" class="btn" style="background: var(--danger);" onclick="switchMusic()">OFF</button>
            </div>
            <button class="btn" style="background: var(--primary); width: 100%;" onclick="saveSets()">ZAPISZ</button>
        </div>
    </div>

    <div id="home-screen">
        <h1 style="font-size: 60px; color: var(--primary);">PlayBase</h1>
        <div class="hub-grid">
            <div class="hub-btn" onclick="openTTT()">
                <div style="font-size: 50px;">❌⭕</div>
                <h2>KÓŁKO I KRZYŻYK</h2>
                <p>Ranking i Poziomy</p>
            </div>
            <div class="hub-btn" onclick="openUno()">
                <div style="font-size: 50px;">🃏</div>
                <h2>UNO PLAYBASE</h2>
                <p>Szybka gra w karty!</p>
            </div>
        </div>
    </div>

    <div id="uno-arena">
        <div id="opponent-hand"></div>
        
        <div id="center-pile">
            <div class="deck-pile" onclick="playerDrawCard()">
                <div style="font-size: 30px;">🎴</div>
            </div>
            <div id="discard-pile"></div>
        </div>

        <div id="uno-status" style="font-size: 24px; color: var(--secondary);">TWOJA KOLEJ</div>

        <div id="player-hand"></div>
        
        <button class="btn" onclick="location.reload()" style="background: var(--danger); color: white;">WYJDŹ</button>
    </div>

    <div id="ttt-lobby">
        <div id="ttt-rank" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; width: 300px; margin-bottom: 20px; border: 2px solid var(--secondary);"></div>
        <h3>POZIOMY (3x3 / 6x3)</h3>
        <div class="lvl-grid" id="ttt-lvls"></div>
        <button class="btn" onclick="location.reload()" style="background: #444; color: white;">POWRÓT</button>
    </div>

    <div id="ttt-arena">
        <div id="ttt-status" style="font-size: 30px; margin-bottom: 20px;">X ZACZYNA</div>
        <div id="ttt-board" class="board"></div>
        <button class="btn" onclick="openTTT()" style="background: var(--danger); color: white; margin-top: 20px;">WYJDŹ</button>
    </div>

    <script>
        let nick = localStorage.getItem('pb_n') || "Gracz_" + Math.floor(Math.random()*999);
        let tttWins = parseInt(localStorage.getItem('pb_tw')) || 0;
        let tttLvl = parseInt(localStorage.getItem('pb_tl')) || 1;
        let music = false;

        function init() {
            document.getElementById('nick-tag').innerText = nick;
            document.getElementById('nick-in').value = nick;
        }

        function toggleSets() { 
            const s = document.getElementById('settings-overlay');
            s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveSets() {
            nick = document.getElementById('nick-in').value || nick;
            localStorage.setItem('pb_n', nick);
            document.getElementById('nick-tag').innerText = nick;
            toggleSets();
            if(document.getElementById('ttt-lobby').style.display === 'flex') renderTTTRank();
        }

        function switchMusic() {
            const m = document.getElementById('bg-music');
            const b = document.getElementById('m-btn');
            music = !music;
            if(music) { m.play(); b.innerText="ON"; b.style.background="#2ecc71"; }
            else { m.pause(); b.innerText="OFF"; b.style.background="var(--danger)"; }
        }

        /* --- KÓŁKO I KRZYŻYK --- */
        function openTTT() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('ttt-arena').style.display = 'none';
            document.getElementById('ttt-lobby').style.display = 'flex';
            renderTTTRank();
            renderTTTLvls();
        }

        function renderTTTRank() {
            const r = document.getElementById('ttt-rank');
            r.innerHTML = `<h4 style="margin:0">RANKING</h4>
            <div style="display:flex; justify-content:space-between; color:var(--secondary)"><span>#1 ${nick}</span><span>${tttWins} W</span></div>`;
        }

        function renderTTTLvls() {
            const g = document.getElementById('ttt-lvls'); g.innerHTML = '';
            for(let i=1; i<=20; i++) {
                const b = document.createElement('div');
                b.className = `lvl-box ${i > tttLvl ? 'locked' : ''}`;
                b.style.background = i <= 10 ? "#2ecc71" : "#8e44ad";
                b.innerText = i;
                if(i <= tttLvl) b.onclick = () => startTTT(i);
                g.appendChild(b);
            }
        }

        let tttBoard = [];
        let tttActive = true;
        let tttMode = 3;

        function startTTT(l) {
            document.getElementById('ttt-lobby').style.display = 'none';
            document.getElementById('ttt-arena').style.display = 'flex';
            tttMode = l <= 10 ? 3 : 6;
            const size = l <= 10 ? 9 : 18;
            tttBoard = Array(size).fill("");
            const b = document.getElementById('ttt-board');
            b.className = `board ${l <= 10 ? 's9' : 's18'}`;
            b.innerHTML = '';
            for(let i=0; i<size; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => { if(tttBoard[i]==="" && tttActive) { tttBoard[i]="X"; refreshTTT(); checkTTT(); if(tttActive) setTimeout(aiTTT, 500); } };
                b.appendChild(c);
            }
            tttActive = true;
            document.getElementById('ttt-status').innerText = "TWOJA KOLEJ (X)";
        }

        function aiTTT() {
            let f = tttBoard.map((v,i)=>v===""?i:null).filter(v=>v!==null);
            if(f.length) tttBoard[f[Math.floor(Math.random()*f.length)]] = "O";
            refreshTTT(); checkTTT();
        }

        function refreshTTT() {
            const cells = document.querySelectorAll('.cell');
            tttBoard.forEach((v,i) => { cells[i].innerText = v; cells[i].style.color = v==="X"?"var(--danger)":"var(--primary)"; });
        }

        function checkTTT() {
            const win = (p) => {
                const target = tttMode === 3 ? 3 : 4;
                const cols = tttMode === 3 ? 3 : 6;
                for(let i=0; i<tttBoard.length; i++) {
                    if(scan(i, 1, p, target, cols)) return true;
                    if(scan(i, cols, p, target, cols)) return true;
                }
                return false;
            };
            if(win("X")) { 
                tttActive = false; tttWins++; tttLvl = Math.max(tttLvl, tttLvl+1); 
                localStorage.setItem('pb_tw', tttWins); localStorage.setItem('pb_tl', tttLvl);
                document.getElementById('ttt-status').innerText = "WYGRAŁEŚ!";
            } else if(win("O")) { tttActive = false; document.getElementById('ttt-status').innerText = "PRZEGRAŁEŚ!"; }
        }

        function scan(s, st, p, t, cols) {
            let c = 0;
            for(let i=0; i<t; i++) {
                let idx = s + i*st;
                if(idx < tttBoard.length && tttBoard[idx] === p) c++;
            }
            return c === t;
        }

        /* --- UNO LOGIC --- */
        let unoDeck = [];
        let playerHand = [];
        let cpuHand = [];
        let topCard = null;
        let unoTurn = "player";

        function openUno() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('uno-arena').style.display = 'flex';
            startUno();
        }

        function startUno() {
            const colors = ["red", "blue", "green", "yellow"];
            unoDeck = [];
            colors.forEach(c => {
                for(let i=0; i<=9; i++) unoDeck.push({color: c, val: i});
                unoDeck.push({color: c, val: "+2"});
            });
            for(let i=0; i<4; i++) unoDeck.push({color: "black", val: "WILD"});
            
            unoDeck.sort(() => Math.random() - 0.5);
            playerHand = unoDeck.splice(0, 7);
            cpuHand = unoDeck.splice(0, 7);
            topCard = unoDeck.splice(0, 1)[0];
            while(topCard.color === "black") { unoDeck.push(topCard); topCard = unoDeck.splice(0,1)[0]; }
            
            renderUno();
        }

        function renderUno() {
            const p = document.getElementById('player-hand'); p.innerHTML = '';
            playerHand.forEach((c, i) => {
                const d = document.createElement('div');
                d.className = `uno-card ${c.color}`;
                d.innerText = c.val;
                d.onclick = () => playCard(i);
                p.appendChild(d);
            });

            const opp = document.getElementById('opponent-hand'); opp.innerHTML = '';
            cpuHand.forEach(() => {
                const d = document.createElement('div');
                d.className = `uno-card black`;
                d.style.background = "linear-gradient(45deg, #222, #000)";
                opp.appendChild(d);
            });

            const pile = document.getElementById('discard-pile'); pile.innerHTML = '';
            const tc = document.createElement('div');
            tc.className = `uno-card ${topCard.color}`;
            tc.innerText = topCard.val;
            pile.appendChild(tc);
        }

        function playCard(idx) {
            if(unoTurn !== "player") return;
            const c = playerHand[idx];
            if(c.color === topCard.color || c.val === topCard.val || c.color === "black") {
                topCard = c;
                playerHand.splice(idx, 1);
                if(playerHand.length === 0) { alert("WYGRAŁEŚ W UNO!"); location.reload(); return; }
                
                if(c.val === "+2") { for(let i=0; i<2; i++) cpuHand.push(unoDeck.pop()); }
                
                unoTurn = "cpu";
                document.getElementById('uno-status').innerText = "AI MYŚLI...";
                renderUno();
                setTimeout(cpuPlay, 1000);
            }
        }

        function playerDrawCard() {
            if(unoTurn !== "player") return;
            playerHand.push(unoDeck.pop());
            unoTurn = "cpu";
            renderUno();
            setTimeout(cpuPlay, 1000);
        }

        function cpuPlay() {
            let possible = cpuHand.findIndex(c => c.color === topCard.color || c.val === topCard.val || c.color === "black");
            if(possible !== -1) {
                let c = cpuHand.splice(possible, 1)[0];
                topCard = c;
                if(c.val === "+2") { for(let i=0; i<2; i++) playerHand.push(unoDeck.pop()); }
                if(cpuHand.length === 0) { alert("AI WYGRAŁO W UNO!"); location.reload(); return; }
            } else {
                cpuHand.push(unoDeck.pop());
            }
            unoTurn = "player";
            document.getElementById('uno-status').innerText = "TWOJA KOLEJ";
            renderUno();
        }

        init();
    </script>
</body>
</html>
