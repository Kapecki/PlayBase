<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapecki - YouTube</title>
    <style>
        /* Styl tła - czarny i elegancki */
        body {
            background-color: #0b0b0b;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Kontener na logo */
        .container {
            text-align: center;
        }

        /* Styl czerwonego logo "K" */
        .logo {
            width: 140px;
            height: 140px;
            background-color: #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 35px; /* Zaokrąglone rogi jak w ikonie */
            font-size: 90px;
            font-weight: 900;
            color: white;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
            animation: float 3s ease-in-out infinite; /* Logo będzie "pływać" */
        }

        /* Efekt po najechaniu myszką */
        .logo:hover {
            transform: scale(1.15);
            box-shadow: 0 0 70px rgba(255, 0, 0, 0.9);
            background-color: #ff2222;
        }

        /* Napis pod spodem */
        .sub-text {
            margin-top: 30px;
            font-size: 18px;
            letter-spacing: 2px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* Animacja pływania logo */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* Dodatkowy efekt RGB w tle (bardzo delikatny) */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <a href="https://www.youtube.com/@Kapecki" target="_blank" class="logo">
            K
        </a>
        <div class="sub-text">Kliknij logo, aby wejść</div>
    </div>

</body>
</html>
