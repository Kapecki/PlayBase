<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBase | Lobby RGB</title>
    <style>
        :root { --bg: #05070a; --primary: #00d4ff; --neon-pink: #ff00ff; }
        body { 
            margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        
        h1 { 
            font-size: 70px; margin-bottom: 50px;
            background: linear-gradient(to right, var(--primary), var(--neon-pink));
            -webkit-background-clip: text; -webkit-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0,212,255,0.5));
            animation: glow 2s infinite alternate;
        }

        .grid { display: flex; gap: 30px; }
        
        .card {
            width: 280px; height: 350px; background: #0f1218; border: 2px solid #222;
            border-radius: 40px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; transition: 0.4s; text-decoration: none; color: white;
        }

        .card:hover {
            border-color: var(--primary); transform: translateY(-15px);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .icon { font-size: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--primary)); }
        h2 { letter-spacing: 2px; margin: 0; }
        p { color: #555; margin-top: 10px; }

        @keyframes glow { from { opacity: 0.8; } to { opacity: 1; } }
    </style>
</head>
<body>

    <h1>PlayBase</h1>

    <div class="grid">
        <a href="farma.html" class="card">
            <div class="icon">🌿</div>
            <h2>CYBER FARMER</h2>
            <p>KLIKNIJ ABY WEJŚĆ</p>
        </a>
    </div>

</body>
</html>
