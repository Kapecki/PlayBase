<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore v5.0 | Ultra RGB Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --dark-bg: #020205;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- ANIMOWANE TŁO CZĄSTECZEK --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0a0a25 0%, #020205 100%);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
            z-index: 10;
        }

        /* --- NAGŁÓWEK RGB --- */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 15px;
            margin-bottom: 50px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-blue));
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flow 3s linear infinite, glow 2s ease-in-out infinite alternate;
        }

        @keyframes flow { to { background-position: 200% center; } }
        @keyframes glow { from { filter: drop-shadow(0 0 10px var(--neon-blue)); } to { filter: drop-shadow(0 0 30px var(--neon-pink)); } }

        /* --- GRID GIER --- */
        .games-grid {
            display: flex;
            gap: 40px;
            justify-content: center;
            perspective: 1000px;
        }

        .game-card {
            width: 300px;
            height: 400px;
            background: var(--glass);
            border: 2px solid rgba(0, 242, 255, 0.2);
            border-radius: 40px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: white;
        }

        /* EFEKT ROŚNIĘCIA I TRANSFORMACJI */
        .game-card:hover {
            transform: scale(1.1) translateY(-20px) rotateY(10deg);
            border-color: var(--neon-pink);
            box-shadow: 0 0 60px rgba(255, 0, 122, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }

        .game-card i { font-size: 100px; margin-bottom: 30px; transition: 0.5s; }
        .game-card:hover i { transform: scale(1.3); filter: drop-shadow(0 0 20px var(--neon-pink)); }

        .game-card h2 { font-family: 'Orbitron'; font-size: 1.8rem; margin-bottom: 10px; }
        .game-card p { font-size: 14px; opacity: 0.7; letter-spacing: 2px; }

        /* --- PANEL USTAWIEŃ --- */
        .settings-panel {
            margin-top: 60px;
            padding: 30px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            display: inline-flex;
            gap: 30px;
            align-items: center;
        }

        .setting-item { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
        .setting-item label { font-size: 12px; font-weight: bold; color: var(--neon-blue); letter-spacing: 2px; }

        input[type="text"] {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--neon-blue);
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            font-family: 'Orbitron';
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus { border-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }

        .switch {
            width: 80px; height: 40px;
            background: #222;
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            border: 2px solid #444;
            transition: 0.4s;
        }

        .switch::before {
            content: "";
            position: absolute;
            width: 30px; height: 30px;
            background: white;
            border-radius: 50%;
            top: 3px; left: 3px;
            transition: 0.4s;
        }

        .switch.on { background: var(--neon-green); border-color: var(--neon-green); }
        .switch.on::before { left: 43px; box-shadow: 0 0 15px white; }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <h1>CyberCore</h1>

        <div class="games-grid">
            <a href="farma.html" class="game-card" id="farm-card">
                <div style="font-size: 80px;">🌾</div>
                <h2>NEON FARM</h2>
                <p>SIMULATION ACTIVE</p>
            </a>

            <div class="game-card" style="opacity: 0.3; filter: grayscale(1);">
                <div style="font-size: 80px;">🏎️</div>
                <h2>NEON RACE</h2>
                <p>COMING SOON</p>
            </div>

            <div class="game-card" style="opacity: 0.3; filter: grayscale(1);">
                <div style="font-size: 80px;">⚔️</div>
                <h2>CYBER ARENA</h2>
                <p>LOCKED</p>
            </div>
        </div>

        <div class="settings-panel">
            <div class="setting-item">
                <label>OPERATOR NICKNAME</label>
                <input type="text" id="nickInput" maxlength="12">
            </div>
            <div class="setting-item">
                <label>RGB AUDIO</label>
                <div class="switch" id="musicToggle"></div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIKA CZĄSTECZEK ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = Math.random() > 0.5 ? '#00f2ff' : '#ff007a';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.x > canvas.width) this.x = 0;
                if(this.x < 0) this.x = canvas.width;
                if(this.y > canvas.height) this.y = 0;
                if(this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for(let i=0; i<100; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        // --- OBSŁUGA USTAWIEŃ ---
        const nickInput = document.getElementById('nickInput');
        const musicToggle = document.getElementById('musicToggle');

        nickInput.value = localStorage.getItem('ultra_nick') || "Pilot_01";
        let musicActive = localStorage.getItem('ultra_music') === 'true';
        if(musicActive) musicToggle.classList.add('on');

        nickInput.oninput = () => localStorage.setItem('ultra_nick', nickInput.value);
        musicToggle.onclick = () => {
            musicActive = !musicActive;
            localStorage.setItem('ultra_music', musicActive);
            musicToggle.classList.toggle('on');
        };

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();
    </script>
</body>
</html>
