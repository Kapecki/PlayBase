<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBase | Cosmic RGB Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --primary: #00d4ff;
            --secondary: #ff00ff;
            --bg: #02050a;
            --card-bg: rgba(15, 20, 30, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Dynamiczne tło RGB */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #16213e 0%, #02050a 100%);
            z-index: -1;
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            animation: moveStars 100s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        .logo {
            font-size: 85px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 15px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .tagline {
            font-size: 14px;
            letter-spacing: 8px;
            color: var(--secondary);
            margin-bottom: 60px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .grid {
            display: flex;
            gap: 40px;
            padding: 20px;
        }

        .card {
            position: relative;
            width: 320px;
            height: 450px;
            background: var(--card-bg);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            backdrop-filter: blur(15px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .card:hover {
            transform: translateY(-20px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .card:hover::before {
            left: 100%;
        }

        .card .icon-box {
            font-size: 100px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px var(--primary));
            transition: 0.5s;
        }

        .card:hover .icon-box {
            transform: scale(1.2) rotate(10deg);
        }

        .card h2 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 2px;
            color: var(--primary);
        }

        .card p {
            color: #888;
            font-size: 12px;
            margin-top: 15px;
            padding: 0 30px;
            line-height: 1.6;
        }

        .card .enter-btn {
            margin-top: 30px;
            padding: 10px 30px;
            border: 1px solid var(--primary);
            border-radius: 50px;
            font-size: 12px;
            transition: 0.3s;
        }

        .card:hover .enter-btn {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 20px var(--primary);
        }
    </style>
</head>
<body>

    <div class="bg-animate"></div>
    <div class="stars"></div>

    <div class="container">
        <div class="logo">PlayBase</div>
        <div class="tagline">The Future of Gaming</div>

        <div class="grid">
            <a href="farma.html" class="card">
                <div class="icon-box">🌿</div>
                <h2>CYBER FARMER</h2>
                <p>Eksploruj neonowe pola, zbieraj rzadkie rośliny i buduj swoją cybernetyczną potęgę.</p>
                <div class="enter-btn">URUCHOM GRĘ</div>
            </a>
            
            <div class="card" style="opacity: 0.5; cursor: not-allowed;">
                <div class="icon-box" style="filter: grayscale(1);">🔒</div>
                <h2>COMING SOON</h2>
                <p>Nowy projekt w przygotowaniu. Wkrótce kolejne wyzwania RGB.</p>
                <div class="enter-btn">ZABLOKOWANE</div>
            </div>
        </div>
    </div>

</body>
</html>
