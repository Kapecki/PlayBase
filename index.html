<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Terminal | Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        
        body {
            margin: 0; background: #05050a; color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            background: radial-gradient(circle, #0a0a2e 0%, #05050a 100%);
        }

        .main-panel {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            padding: 50px; border-radius: 40px; border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.1); text-align: center;
        }

        h1 { font-size: 3rem; text-shadow: 0 0 20px #00d4ff; margin-bottom: 30px; }

        .settings-box { margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }

        input {
            background: #000; border: 2px solid #00d4ff; color: #0ff;
            padding: 10px; border-radius: 10px; text-align: center; font-family: 'Orbitron';
        }

        .btn {
            background: #00d4ff; color: #000; border: none; padding: 15px 40px;
            border-radius: 50px; font-weight: 900; cursor: pointer; transition: 0.3s;
            text-decoration: none; display: inline-block; font-size: 1.2rem;
        }
        .btn:hover { box-shadow: 0 0 30px #00d4ff; transform: scale(1.1); }

        .audio-controls { margin-top: 20px; }
        .audio-btn {
            background: transparent; border: 1px solid white; color: white;
            padding: 5px 15px; border-radius: 5px; cursor: pointer; opacity: 0.6;
        }
        .audio-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="main-panel">
        <h1>CYBER-BASE</h1>
        
        <div class="settings-box">
            <label>TWÓJ CYBER-NICK:</label>
            <input type="text" id="nickInput" placeholder="Wpisz nick...">
        </div>

        <div class="audio-controls">
            <button class="audio-btn" id="musicToggle">MUZYKA: OFF</button>
        </div>

        <br><br>
        <a href="farma.html" class="btn" onclick="saveSettings()">START SIMULATION</a>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bgMusic');
        const btn = document.getElementById('musicToggle');
        const input = document.getElementById('nickInput');

        // Wczytaj ustawienia
        input.value = localStorage.getItem('nick') || "Player1";
        let isPlaying = localStorage.getItem('musicOn') === 'true';

        function updateMusic() {
            if(isPlaying) {
                music.play().catch(() => console.log("Czekam na interakcję..."));
                btn.innerText = "MUZYKA: ON";
                btn.style.borderColor = "#39ff14";
            } else {
                music.pause();
                btn.innerText = "MUZYKA: OFF";
                btn.style.borderColor = "red";
            }
        }

        btn.onclick = () => {
            isPlaying = !isPlaying;
            localStorage.setItem('musicOn', isPlaying);
            updateMusic();
        };

        function saveSettings() {
            localStorage.setItem('nick', input.value);
        }

        // Próba auto-startu muzyki przy kliknięciu gdziekolwiek
        window.onclick = () => { if(isPlaying) music.play(); };
    </script>
</body>
</html>
