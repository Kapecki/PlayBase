<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PlayBase | Ultimate Hub</title>
    <style>
        :root {
            --primary: #00d4ff; --secondary: #ffcc00; --danger: #ff4d4d;
            --bg: #0b0e14; --card: #161b22; --accent: #8e44ad;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Arial Black', sans-serif; background: var(--bg); color: white; overflow: hidden; }

        /* --- PASEK GÓRNY --- */
        #top-bar {
            position: fixed; top: 0; right: 0; padding: 20px; display: flex; align-items: center; gap: 15px; z-index: 1000;
        }
        .user-info { background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--primary); display: flex; align-items: center; gap: 10px; }
        .settings-btn { font-size: 24px; cursor: pointer; transition: 0.3s; }
        .settings-btn:hover { transform: rotate(90deg); color: var(--primary); }

        /* --- OKNO USTAWIEŃ --- */
        #settings-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000;
            align-items: center; justify-content: center;
        }
        .modal-content { background: var(--card); padding: 40px; border-radius: 30px; border: 3px solid var(--primary); width: 350px; text-align: center; }
        .modal-content input { width: 100%; padding: 10px; margin: 20px 0; border-radius: 10px; border: none; font-family: inherit; font-size: 18px; }
        .toggle-box { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }

        /* --- STRONA GŁÓWNA --- */
        #home-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .hub-grid { display: flex; gap: 30px; margin-top: 50px; }
        .hub-card { 
            width: 300px; background: var(--card); border: 4px solid #333; border-radius: 35px; 
            padding: 40px; transition: 0.4s; cursor: pointer; 
        }
        .hub-card:hover { border-color: var(--primary); transform: translateY(-10px); }
        .hub-card.mystery { border-style: dashed; opacity: 0.5; }

        /* --- MENU GRY & TABELA --- */
        #game-menu {
            display: none; position: fixed; inset: 0; background: var(--bg); z-index: 500;
            flex-direction: column; align-items: center; padding-top: 80px; overflow-y: auto;
        }
        .leaderboard {
            width: 90%; max-width: 500px; background: rgba(255,255,255,0.05); border: 2px solid var(--secondary);
            border-radius: 20px; padding: 20px; margin-bottom: 30px;
        }
        .rank-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; }
        .rank-row.active { color: var(--secondary); background: rgba(255,204,0,0.1); border-radius: 8px; }

        /* --- ARENA --- */
        #game-arena { display: none; position: fixed; inset: 0; background: #000; z-index: 600; flex-direction: column; align-items: center; justify-content: center; }
        .board { display: grid; gap: 10px; background: var(--primary); padding: 10px; border-radius: 15px; }
        .board.s9 { grid-template-columns: repeat(3, 120px); }
        .board.s18 { grid-template-columns: repeat(6, 90px); }
        .cell { width: 100%; height: 100%; min-height: 90px; background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 50px; border-radius: 10px; }
        .cell.x { color: var(--danger); } .cell.o { color: var(--primary); }

        .btn { padding: 12px 30px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; }
        .lvl-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .lvl-btn { width: 60px; height: 60px; border-radius: 10px; border: 2px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .lvl-btn.locked { opacity: 0.2; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <div id="top-bar">
        <div class="user-info">
            <span id="display-nick">Gracz_123</span>
            <span class="settings-btn" onclick="toggleSettings()">⚙️</span>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h2>USTAWIENIA</h2>
            <p>Zmień swój nick:</p>
            <input type="text" id="nick-input" placeholder="Wpisz nick...">
            
            <div class="toggle-box">
                <span>Muzyka:</span>
                <button id="music-toggle" class="btn" style="background: var(--danger);" onclick="toggleMusic()">WYŁĄCZONA</button>
            </div>
            
            <button class="btn" style="background: var(--primary); width: 100%;" onclick="saveSettings()">ZAPISZ I ZAMKNIJ</button>
        </div>
    </div>

    <div id="home-screen">
        <h1 style="font-size: 70px; color: var(--primary); margin: 0;">PlayBase</h1>
        <div class="hub-grid">
            <div class="hub-card" onclick="openGameMenu()">
                <div style="font-size: 60px;">❌⭕</div>
                <h2>KÓŁKO I KRZYŻYK</h2>
                <p>Graj, zdobywaj wygrane i bądź #1 w tabeli!</p>
            </div>
            <div class="hub-card mystery">
                <div style="font-size: 60px;">❓</div>
                <h2>WKRÓTCE ????</h2>
            </div>
        </div>
    </div>

    <div id="game-menu">
        <div class="leaderboard">
            <h3 style="text-align: center; color: var(--secondary);">RANKING GLOBALNY</h3>
            <div id="rank-list"></div>
        </div>

        <div style="text-align: center;">
            <h3>POZIOMY (3x3)</h3>
            <div class="lvl-grid" id="grid9"></div>
            <h3>POZIOMY (6x3)</h3>
            <div class="lvl-grid" id="grid18"></div>
        </div>

        <button class="btn" onclick="location.reload()" style="background: #333; margin-top: 20px; color: white;">POWRÓT</button>
    </div>

    <div id="game-arena">
        <div id="status" style="font-size: 30px; color: var(--secondary); margin-bottom: 20px;">TWOJA KOLEJ</div>
        <div id="board" class="board"></div>
        <button class="btn" onclick="exitArena()" style="background: var(--danger); color: white; margin-top: 30px;">ZREZYGNUJ</button>
    </div>

    <script>
        // SYSTEM DANYCH
        const nicks = ["SzybkiGamer", "MistrzKółka", "Ninja_X", "ProPlayer", "TurboKrzyżyk"];
        let userNick = localStorage.getItem('pb_nick') || nicks[Math.floor(Math.random()*nicks.length)] + "_" + Math.floor(Math.random()*99);
        let wins = parseInt(localStorage.getItem('pb_wins')) || 0;
        let unlocked = parseInt(localStorage.getItem('pb_lvl')) || 1;
        let musicOn = false;

        document.getElementById('display-nick').innerText = userNick;
        document.getElementById('nick-input').value = userNick;

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveSettings() {
            const newNick = document.getElementById('nick-input').value;
            if(newNick) {
                userNick = newNick;
                localStorage.setItem('pb_nick', userNick);
                document.getElementById('display-nick').innerText = userNick;
            }
            toggleSettings();
            updateLeaderboard();
        }

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle');
            if(!musicOn) {
                music.play();
                btn.innerText = "WŁĄCZONA";
                btn.style.background = "#2ecc71";
                musicOn = true;
            } else {
                music.pause();
                btn.innerText = "WYŁĄCZONA";
                btn.style.background = var(--danger);
                musicOn = false;
            }
        }

        function updateLeaderboard() {
            const list = document.getElementById('rank-list');
            const players = [
                {n: userNick, w: wins, me: true},
                {n: "Marek_PL", w: 12},
                {n: "Kasia99", w: 7},
                {n: "Zordon", w: 3}
            ].sort((a,b) => b.w - a.w);

            list.innerHTML = '';
            players.forEach((p, i) => {
                list.innerHTML += `
                    <div class="rank-row ${p.me ? 'active' : ''}">
                        <span>#${i+1} ${p.n}</span>
                        <span>${p.w} wygranych</span>
                    </div>`;
            });
        }

        function openGameMenu() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-menu').style.display = 'flex';
            updateLeaderboard();
            renderLevels();
        }

        function renderLevels() {
            const draw = (id, s, e, col) => {
                const g = document.getElementById(id); g.innerHTML = '';
                for(let i=s; i<=e; i++) {
                    const b = document.createElement('div');
                    b.className = `lvl-btn ${i > unlocked ? 'locked' : ''}`;
                    b.style.background = col; b.innerText = i;
                    if(i <= unlocked) b.onclick = () => startMatch(i);
                    g.appendChild(b);
                }
            };
            draw('grid9', 1, 10, '#2ecc71');
            draw('grid18', 11, 20, '#8e44ad');
        }

        // LOGIKA GRY
        let board = [];
        let curLvl = 1;
        let active = true;

        function startMatch(l) {
            curLvl = l;
            document.getElementById('game-menu').style.display = 'none';
            document.getElementById('game-arena').style.display = 'flex';
            const b = document.getElementById('board');
            const size = l <= 10 ? 9 : 18;
            b.className = `board ${l <= 10 ? 's9' : 's18'}`;
            board = Array(size).fill("");
            b.innerHTML = '';
            for(let i=0; i<size; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => { if(board[i]==="" && active) { board[i]="X"; checkGame(); if(active) setTimeout(ai, 500); } };
                b.appendChild(c);
            }
            active = true; refresh();
        }

        function ai() {
            let free = board.map((v,i) => v===""?i:null).filter(v=>v!==null);
            if(free.length && active) board[free[Math.floor(Math.random()*free.length)]] = "O";
            checkGame(); refresh();
        }

        function checkGame() {
            const win = (p) => {
                const target = curLvl <= 10 ? 3 : 4;
                const cols = curLvl <= 10 ? 3 : 6;
                for(let i=0; i<board.length; i++) {
                    if(line(i, 1, p, target, cols)) return true;
                    if(line(i, cols, p, target, cols)) return true;
                }
                return false;
            };

            if(win("X")) {
                active = false; wins++; unlocked = Math.max(unlocked, curLvl + 1);
                localStorage.setItem('pb_wins', wins); localStorage.setItem('pb_lvl', unlocked);
                document.getElementById('status').innerText = "WYGRAŁEŚ!";
            } else if(win("O")) {
                active = false; document.getElementById('status').innerText = "PRZEGRAŁEŚ!";
            } else if(!board.includes("")) {
                active = false; document.getElementById('status').innerText = "REMIS!";
            }
        }

        function line(s, step, p, t, cols) {
            let count = 0;
            for(let i=0; i<t; i++) {
                let idx = s + i*step;
                if(idx < board.length && board[idx] === p) count++;
            }
            return count === t;
        }

        function refresh() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((v,i) => { cells[i].innerText = v; cells[i].className = `cell ${v.toLowerCase()}`; });
        }

        function exitArena() {
            document.getElementById('game-arena').style.display = 'none';
            openGameMenu();
        }
    </script>
</body>
</html>
