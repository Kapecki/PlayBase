<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kapecki - Moja Strona</title>
    <style>
        body {
            /* Intensywne czerwone tło RGB */
            background-color: rgb(255, 0, 0);
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { background-color: rgb(200, 0, 0); }
            50% { background-color: rgb(255, 0, 0); }
            100% { background-color: rgb(200, 0, 0); }
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid white;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; }

        .yt-button {
            display: inline-block;
            background-color: #ff0000;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            border: 2px solid white;
            transition: transform 0.3s;
            font-size: 1.2rem;
        }

        .yt-button:hover {
            transform: scale(1.1);
            background-color: white;
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KAPECKI</h1>
        <p>Witaj na mojej oficjalnej stronie!</p>
        <a href="https://www.youtube.com/@Kapecki" target="_blank" class="yt-button">
            SUBSKRYBUJ MÓJ KANAŁ
        </a>
    </div>
</body>
</html>
