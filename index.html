<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kapecki - Logo</title>
    <style>
        body {
            background-color: #000; /* Czarne tło, żeby czerwony "bił" po oczach */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .logo-link {
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* To jest Twoje czerwone logo "K" */
        .red-logo {
            width: 150px;
            height: 150px;
            background-color: #ff0000;
            color: white;
            font-family: 'Arial Black', sans-serif;
            font-size: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 30px; /* Zaokrąglone rogi jak w ikonie */
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.7);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            user-select: none;
            animation: glow 2s infinite alternate;
        }

        /* Efekt najechania myszką */
        .red-logo:hover {
            transform: scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 0, 1);
        }

        /* Animacja świecenia */
        @keyframes glow {
            from { box-shadow: 0 0 30px rgba(255, 0, 0, 0.5); }
            to { box-shadow: 0 0 60px rgba(255, 0, 0, 0.9); }
        }
    </style>
</head>
<body>

    <a href="https://www.youtube.com/@Kapecki" target="_blank" class="logo-link">
        <div class="red-logo">K</div>
    </a>

</body>
</html>
